  text:{l:() => t('fbText'), main:r => `<button class="linklike clamp3" data-act="fbopen" data-id="${r.id}" title="${esc(r.text)}">${esc(r.text)}</button>`, sort:r => r.text, cls:'w-wide'},
  status:{l:() => t('fbStatusCol'), main:r => fbBadge(r.status), sort:r => FB_STATUSES.indexOf(r.status), filter:r => r.status, flabel:v => esc(tv(v))},
  answer:{l:() => t('fbAnswer'), main:r => r.answer ? `<span class="clamp3" title="${esc(r.answer)}">${esc(r.answer)}</span>` : '<span class="muted">—</span>', sort:r => r.answer, cls:'w-wide'},
  shots:{l:() => t('fbShots'), main:r => r.shots.length ? String(r.shots.length) : '<span class="muted">—</span>', sort:r => r.shots.length},
  screen:{l:() => t('fbScreen'), main:r => r.screen ? esc(fbScreenLabel(r.screen)) : '<span class="muted">—</span>', sort:r => fbScreenLabel(r.screen)}
};
TDEFS.feedback = FDEF; TDEFAULTS.feedback = ['num','date','author','text','status','answer','shots','screen'];
// экран отзыва — понятная подпись, как screenLabel приложения: «Проєкти · Усі проєкти · картка проєкту»
const fbScreenLabel = s => String(s || '').split('|').map(x => x.indexOf(':') === 0 ? tv(x.slice(1)) : t(x)).join(' · ');
function fbScreenNow(){
  const page = {home:'navHome', projects:'navProjects', reports:'navReports', risks:'navRisks', archive:'navArchive', feedback:'navFeedback'}[state.page] || 'navHome';
  const views = {projects:[PV, state.pv], reports:[RV, state.rv], risks:[KV, state.kv], archive:[AV, state.av]}[state.page];
  const parts = [page];
  if (views && views[0][views[1]]) parts.push(':' + views[0][views[1]].t);
  const k = state.panel && state.panel.kind;
  if (k === 'project') parts.push('scrCard'); else if (k === 'report') parts.push('apTitle'); else if (k === 'help' || k === 'releases' || k === 'overview') parts.push('help');
  return parts.join('|');
}
function pageFeedback(){
  const rows = FEEDBACK.filter(FBV[state.fv].f);
  return `${hero(t('navFeedback'), t('fbPageSub'))}
  <div class="listcard"><div class="cmdbar"><button class="cmd primary" data-act="fbnew">${t('feedbackNew')}</button><span class="spacer"></span>
    <label class="viewsel">${t('view')}<select data-act="view" data-key="fv">${Object.keys(FBV).map(k => `<option value="${k}"${k === state.fv ? ' selected' : ''}>${t(FBV[k].t)}</option>`).join('')}</select></label>${gearBtn('feedback')}</div>
    ${dataTable('feedback', rows, t('fbNoItems'))}</div>`;
}
const icoChevL = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>';
const icoChevR = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';
function fbView(id){
  const r = FEEDBACK.find(x => x.id === id); if (!r) return;
  state.panel = {kind:'feedback', id};
  // «‹ №N ›» — соседние отзывы в порядке таблицы (вид, фильтры, сортировка)
  const order = state.page === 'feedback' ? applyTable('feedback', FEEDBACK.filter(FBV[state.fv].f)).map(x => x.id) : FEEDBACK.map(x => x.id);
  const i = order.indexOf(id), prev = i > 0 ? order[i - 1] : 0, next = i >= 0 && i < order.length - 1 ? order[i + 1] : 0;
  const shots = !r.shots.length ? '' : fbShotsSeen(r) ? `<div class="fb-shots">${r.shots.map(s => `<a href="${s}" target="_blank" rel="noopener noreferrer"><figure><img src="${s}" alt=""></figure></a>`).join('')}</div>`
    : `<p class="note">${t('fbShotsHidden')} (${r.shots.length})</p>`;
  openPanel(`<div class="ph"><div><div class="k">${entTag('feedback')}<span>${t('navFeedback')} · <span class="fb-nav"><button type="button" id="fb-prev" title="${t('fbPrev')}" aria-label="${t('fbPrev')}"${prev ? ` data-act="fbopen" data-id="${prev}"` : ' disabled'}>${icoChevL}</button>
      <span>№${r.id}</span><button type="button" id="fb-next" title="${t('fbNext')}" aria-label="${t('fbNext')}"${next ? ` data-act="fbopen" data-id="${next}"` : ' disabled'}>${icoChevR}</button></span></span></div><h2>${esc(r.author)}</h2></div>${closeBtn()}</div>
    <div class="badges">${fbBadge(r.status)}${r.screen ? `<span class="badge">${esc(fbScreenLabel(r.screen))}</span>` : ''}</div>
    <p class="fb-text">${esc(r.text)}</p>${shots}
    ${isSiteOwner() ? `<form id="fb-ans-form" novalidate>
      <div class="frow"><label class="t" for="fb-st">${t('fbStatusCol')}</label><select id="fb-st">${FB_STATUSES.map(v => opt(v, r.status)).join('')}</select></div>
      <div class="frow"><label class="t" for="fb-ans">${t('fbAnswer')}</label><textarea id="fb-ans" style="min-height:110px">${esc(r.answer)}</textarea></div>
      <div class="actions"><button type="submit" class="btn primary">${t('save')}</button><button type="button" class="btn" data-act="close">${t('cancel')}</button></div></form>`
    : `<div class="sec"><h3>${t('fbAnswer')}</h3>${r.answer ? `<p class="fb-text">${esc(r.answer)}</p>` : `<p class="empty">${t('fbNoAnswer')}</p>`}</div>`}`);
  const f = panel.querySelector('#fb-ans-form');
  if (f) f.addEventListener('submit', e => {
    e.preventDefault();
    const st = f.querySelector('#fb-st').value, ans = f.querySelector('#fb-ans').value.trim();
    // разобран — сповіщення автору «Відгук розглянуто» (в приложении — fpDecidedAt, пишет синхронизация)
    if (st !== r.status || ans !== r.answer) r.decidedAt = new Date().toISOString();
    r.status = st; r.answer = ans;
    closePanel(); rerenderMain(); toast(t('fbAnswered'));
  });
}
const FB_MAX = 5, FB_BYTES = 10 * 1024 * 1024;
function fbForm(){
  const screen = fbScreenNow(), shots = [];
  state.panel = {kind:'fbnew'};
  openPanel(`${formHead(t('fbTitle'), `${t('listLabel')} «${t('fbList')}»`, 'feedback')}
    <form id="fb-form" novalidate><p class="note">${t('fbHint')}</p>
      <div class="frow"><label class="t" for="fb-t">${t('fbText')} *</label><textarea id="fb-t" style="min-height:120px"></textarea></div>
      <div class="frow"><span class="lbl-t" id="fb-shots-h"></span><div class="fb-shots" id="fb-shots"></div>
        <button type="button" class="btn" id="fb-add">${t('fbAdd')}</button><input type="file" id="fb-file" accept="image/*" multiple hidden>
        <p class="note fb-paste">${t('fbPaste')}</p></div>
      <p class="err" id="fb-err" role="alert" hidden></p>
      <div class="actions"><button type="submit" class="btn primary">${t('fbSend')}</button><button type="button" class="btn" data-act="close">${t('cancel')}</button></div></form>`);
  const f = panel.querySelector('#fb-form'), errEl = f.querySelector('#fb-err');
  const setErr = m => { errEl.textContent = m; errEl.hidden = !m; };
  const draw = () => {
    f.querySelector('#fb-shots-h').textContent = `${t('fbShots')} (${shots.length}/${FB_MAX})`;
    f.querySelector('#fb-shots').innerHTML = shots.map((s, i) => `<figure><img src="${s}" alt=""><button type="button" class="x x-sm" data-rm="${i}" aria-label="${t('fbRemove')}">×</button></figure>`).join('');
    f.querySelector('#fb-add').hidden = shots.length >= FB_MAX;
  };
  const add = files => {
    const imgs = [...files].filter(x => /^image\//.test(x.type)); if (!imgs.length) return;
    setErr('');
    const room = FB_MAX - shots.length; if (imgs.length > room) setErr(t('fbMax'));
    imgs.slice(0, Math.max(0, room)).forEach(x => {
      if (x.size > FB_BYTES) { setErr(t('fbBig')); return; }
      const rd = new FileReader(); rd.onload = () => { if (shots.length < FB_MAX) { shots.push(rd.result); draw(); } }; rd.readAsDataURL(x);
    });
  };
  draw();
  f.querySelector('#fb-add').addEventListener('click', () => f.querySelector('#fb-file').click());
  f.querySelector('#fb-file').addEventListener('change', e => { add(e.target.files || []); e.target.value = ''; });
  f.querySelector('#fb-shots').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { shots.splice(+b.dataset.rm, 1); draw(); } });
  // на компьютере — вставка снимка экрана из буфера (Ctrl/Cmd+V)
  f.addEventListener('paste', e => { const fs = [...((e.clipboardData && e.clipboardData.files) || [])]; if (fs.some(x => /^image\//.test(x.type))) { e.preventDefault(); add(fs); } });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const text = f.querySelector('#fb-t').value.trim();
    if (!text) { setErr(t('fbErrText')); return; }
    FEEDBACK.unshift({id:Math.max(0, ...FEEDBACK.map(x => x.id)) + 1, created:new Date().toISOString(), author:VIEWER, text, screen, status:'Новий', answer:'', decidedAt:'', shots:shots.slice()});
    // #103: отправленный отзыв сразу виден в списке «Відгуки»
    closePanel(); rerenderMain(); toast(t('fbSent'));
  });
}

/* ================= «Оновити дані» и «CSV» над таблицами — как components/DataTable приложения ================= */
const icoRefresh = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>';
const tableTools = key => `<button class="iconbtn refresh-btn" id="dt-refresh" data-act="refresh" title="${t('refresh')}" aria-label="${t('refresh')}">${icoRefresh}</button>`
  + `<button class="iconbtn csv-btn" data-act="csv" data-key="${key}" title="${t('csvTitle')}" aria-label="${t('csvTitle')}">${t('csv')}</button>`;
// CSV для Excel — те же правила, что logic/csv.ts: «;», кавычки при необходимости, BOM
function toCsv(head, rows){
  const q = v => (/[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);
  return '﻿' + [head, ...rows].map(r => r.map(x => q((x || '').replace(/\s+\n/g, '\n').trim())).join(';')).join('\r\n');
}
const cellText = c => { const s = (c.innerText ?? c.textContent ?? '').trim(); if (s) return s; const ti = c.querySelector('[title]'); return ti ? ti.title : ''; };
function exportCsv(key){
  const tb = document.querySelector(`.dt[data-tkey="${key}"] table`); if (!tb) return;
  const st = tState(key), defs = TDEFS[key];
  const rows = [...tb.querySelectorAll('tbody tr')].map(tr => [...tr.children].map(cellText));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toCsv(st.cols.map(c => defs[c].l()), rows)], {type:'text/csv;charset=utf-8'}));
  a.download = `${key}-${iso(new Date())}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
window.PPM_RULES = Object.assign(window.PPM_RULES || {}, {toCsv});

/* ================= Theme, toast, events ================= */
let THEME = null;
try { THEME = localStorage.getItem('pmo-theme'); } catch(e) {}
if (THEME !== 'light' && THEME !== 'dark') THEME = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
function applyTheme(){ document.documentElement.setAttribute('data-theme', THEME); }
applyTheme();
const toastEl = document.getElementById('toast'); let tt;
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 4200); }

// всплывающее окно закрывается нажатием вне его и прокруткой вне его (как Pop портала)
document.addEventListener('mousedown', e => { if (POP && !e.target.closest('#pop') && !e.target.closest('[data-act=tfilter],[data-act=tcols],#me')) closePop(); });
window.addEventListener('scroll', e => { if (POP && !(e.target.closest && e.target.closest('#pop'))) closePop(); }, true);
document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  if (POP && !e.target.closest('#pop') && !e.target.closest('[data-act=tfilter],[data-act=tcols],#me')) closePop();
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act, id = el.dataset.id ? +el.dataset.id : null;
  if (['newrep','repopen','riskopen','newrisk','riskcopy','editproj','assign','notif','help','fbnew','newfromret','releases','overview','fbopen','openp','comments'].includes(a)){
    const fromCard = state.panel && state.panel.kind === 'project' ? state.panel.id : (state.panel && BACK_TO) || null;
    BACK_TO = a === 'openp' || a === 'comments' ? null : fromCard || (a === 'repopen' || (a === 'riskopen' && el.dataset.src !== 'list') ? id : null);
  }
  // вкладка в шапке — всегда её вид по умолчанию и без фильтров колонок (#23, #24); показатели главной (goview) ставят свой вид
  if (a === 'nav'){ BACK_TO = null; state.page = el.dataset.page; state.rmCell = null; Object.assign(state, {pv:'all', rv:'all', kv:'open', av:'all', fv:'all'}); Object.keys(TS).forEach(k => { TS[k].filters = {}; }); TW = {}; closePop(); closePanel(); render(); window.scrollTo(0, 0); }
  else if (a === 'wreset'){ const k = el.dataset.key; if (TS[k]) { TS[k].w = {}; tSave(k); } closePop(); rerenderMain(); }
  // другой язык — другие ширины текста: закреплённые ширины колонок замеряются заново
  else if (a === 'lang'){ LI = +el.dataset.i; try { localStorage.setItem('pmo-lang', String(LI)); } catch(e) {} TW = {}; render(); if (POP && POP.kind === 'user') renderPop(); }
  else if (a === 'theme'){ THEME = el.dataset.t; try { localStorage.setItem('pmo-theme', THEME); } catch(e) {} applyTheme(); renderChrome(); if (POP && POP.kind === 'user') renderPop(); }
  else if (a === 'goview'){ state.page = el.dataset.page; state.rmCell = null; Object.keys(TS).forEach(k => { TS[k].filters = {}; }); state[{projects:'pv', reports:'rv', risks:'kv', archive:'av'}[state.page]] = el.dataset.view; render(); window.scrollTo(0, 0); }
  else if (a === 'mode'){ state[el.dataset.key] = el.dataset.mode; try { const k = {projMode:'pmo-projmode', archmode:'pmo-archmode'}[el.dataset.key]; if (k) localStorage.setItem(k, el.dataset.mode); } catch(e) {} rerenderMain(); }
  else if (a === 'openp') projectPanel(id, false);
  else if (a === 'comments') projectPanel(id, true);
  else if (a === 'togglecm') projectPanel(state.panel.id, !state.panel.showCm, true, state.panel.showCh);
  else if (a === "descmore"){ const ds = panel.querySelector("#card-desc"), open = ds.classList.toggle('clamp'); el.textContent = t(open ? 'descMore' : 'descLess'); }
  else if (a === 'togglech') projectPanel(state.panel.id, state.panel.showCm, true, !state.panel.showCh);
  else if (a === 'togglerp'){ state.panel.showRp = !state.panel.showRp; projectPanel(state.panel.id, state.panel.showCm, true, state.panel.showCh); }
  else if (a === 'newrep') reportForm(id);
  else if (a === 'repopen') reportView(id, el.dataset.rid);
  else if (a === 'rmcell'){ state.rmCell = state.rmCell === el.dataset.k ? null : el.dataset.k; rerenderMain(); }
  else if (a === 'newfromret'){ const p = pById(id), r = p && (p.reports || []).find(x => String(x.id) === el.dataset.rid); reportForm(id, r); }
  else if (a === 'newrisk') riskForm(id, null);
  else if (a === 'riskcopy') riskForm(id, null, false, el.dataset.rid);
  else if (a === 'riskopen') riskForm(id, el.dataset.rid, el.dataset.src === 'list');
  else if (a === 'newproj') projectForm(null);
  else if (a === 'editproj') projectForm(pById(id));
  else if (a === 'notif') notifPanel(false);
  else if (a === 'help') helpPanel();
  else if (a === 'releases') relPanel();
  else if (a === 'overview') overviewPanel();
  else if (a === 'fbnew') fbForm();
  else if (a === 'fbopen') fbView(id);
  // «Оновити дані»: в прототипе данные в памяти страницы — перерисовка; в приложении — перечитать с сайта
  else if (a === 'refresh'){ rerenderMain(); toast(t('refreshed')); }
  else if (a === 'csv') exportCsv(el.dataset.key);
  else if (a === 'notifback') notifPanel(false);   // как портал: список открывается заново
  // «Позначити все прочитаним» — «прочитано до» = сейчас (в приложении — номер последнего показанного события)
  else if (a === 'notifreadall') { NOTIF_READ[VIEWER] = new Date().toISOString(); notifSeen().clear(); notifPanel(!!el.dataset.new); renderChrome(); }
  else if (a === 'assign') assignForm(pById(id));
  else if (a === 'backp') { BACK_TO = null; if (id) projectPanel(id, false); else closePanel(true); }
  else if (a === 'close') closePanel();
  else if (a === 'seed'){ el.disabled = true; el.textContent = t('seeding'); seed().catch(err => { console.error(err); toast(t('saveErr')); }); }
  else if (a === 'reset') resetDemo();
  else if (a === 'tsort'){ const st = tState(el.dataset.key), c = el.dataset.col;
    st.sort = !st.sort || st.sort.id !== c ? {id:c, dir:'asc'} : st.sort.dir === 'asc' ? {id:c, dir:'desc'} : null; tSave(el.dataset.key); rerenderMain(); }
  else if (a === 'tfilter'){ if (POP && POP.kind === 'filter' && POP.col === el.dataset.col) closePop(); else openPop(el, 'filter', el.dataset.key, el.dataset.col); }
  else if (a === 'tcols'){ if (POP && POP.kind === 'cols') closePop(); else openPop(el, 'cols', el.dataset.key); }
  else if (a === 'fclear'){ const st = tState(el.dataset.key); delete st.filters[el.dataset.col]; tSave(el.dataset.key); rerenderMain(); if (POP && POP.kind === 'filter') renderPop(); }
  else if (a === 'cmove'){ const st = tState(POP.key), i = st.cols.indexOf(el.dataset.col), j = i + (+el.dataset.dir);
    if (i > 0 && j > 0 && j < st.cols.length){ [st.cols[i], st.cols[j]] = [st.cols[j], st.cols[i]]; tSave(POP.key); rerenderMain(); renderPop(); } }
  else if (a === 'creset'){ TS[POP.key] = {cols:TDEFAULTS[POP.key].slice(), sort:null, filters:{}}; tSave(POP.key); rerenderMain(); renderPop(); }
  else if (a === 'me'){ if (POP && POP.kind === 'user') closePop(); else openPop(el, 'user'); }
  else if (a === 'asuser'){ VIEWER = el.dataset.n; closePop(); render(); }
  // переключатели «Помічник ШІ» и «Імітувати збій ШІ»: меню не закрывается, открытая форма отчёта перестраивается
  else if (a === 'aiallow' || a === 'aideny'){
    const done = () => { AI_BUSY = false; if (a === 'aiallow'){ AI_CONSENTED = true; AI_DEMO = 'on'; } AI_ASK = false;
      if (POP && POP.kind === 'user') renderPop();
      const rf = document.getElementById('repform'); if (rf) rf.dispatchEvent(new Event('change', {bubbles:true})); };
    if (a === 'aiallow' && aiDelay()){ AI_BUSY = true; if (POP && POP.kind === 'user') renderPop(); setTimeout(done, aiDelay()); } else done(); }
  else if (a === 'aidemo' || a === 'aifail'){
    // включение — согласие один раз (как в приложении: components/Header, ai/useAiSwitch); в форме отчёта согласия нет
    if (a === 'aidemo'){ if (el.dataset.v === 'on' && !AI_CONSENTED) AI_ASK = true; else { AI_DEMO = el.dataset.v === 'on' ? 'on' : 'off'; AI_ASK = false; if (AI_DEMO === 'off') AI_FAIL = false; } }
    else if (AI_DEMO === 'on') AI_FAIL = !AI_FAIL;
    if (POP && POP.kind === 'user') renderPop();
    const rf = document.getElementById('repform'); if (rf) rf.dispatchEvent(new Event('change', {bubbles:true})); }
  else if (a === 'grp'){ el.classList.toggle('collapsed'); const h = el.classList.contains('collapsed'); document.querySelectorAll(`[data-gk="${el.dataset.g}"]`).forEach(r => r.hidden = h); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'view'){ state[e.target.dataset.key] = e.target.value; rerenderMain(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && POP){ closePop(); return; }
  if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
render();
initData();
})();
