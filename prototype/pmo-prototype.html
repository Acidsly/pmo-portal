<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPM — Портфель проєктів</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%230a84ff%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%235e5ce6%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2741%27%20text-anchor%3D%27middle%27%20font-family%3D%27Segoe%20UI%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2724%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20letter-spacing%3D%27-1%27%3EPPM%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap&amp;subset=cyrillic" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --theme:#007aff; --theme-2:#0062cc; --theme-soft:rgba(0,122,255,.12);
  --bg-page:#f5f5f7; --bg:#ffffff; --bg-alt:#f2f2f7; --bg-hover:rgba(0,0,0,.04);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(0,0,0,.08);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#aeaeb2;
  --line:rgba(0,0,0,.08); --track:#e5e5ea;
  --g:#34c759; --y:#ff9f0a; --r:#ff3b30; --na:#c7c7cc;
  --strat-bg:rgba(175,82,222,.12); --strat:#8e44c9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-hi:0 2px 6px rgba(0,0,0,.06),0 18px 40px rgba(0,0,0,.10);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --theme:#0a84ff; --theme-2:#409cff; --theme-soft:rgba(10,132,255,.2);
    --bg-page:#000000; --bg:#1c1c1e; --bg-alt:#2c2c2e; --bg-hover:rgba(255,255,255,.06);
    --glass:rgba(22,22,24,.72); --glass-line:rgba(255,255,255,.1);
    --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
    --line:rgba(255,255,255,.1); --track:#3a3a3c;
    --g:#30d158; --y:#ffd60a; --r:#ff453a; --na:#48484a;
    --strat-bg:rgba(191,90,242,.2); --strat:#da8fff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --shadow-hi:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --theme:#0a84ff; --theme-2:#409cff; --theme-soft:rgba(10,132,255,.2);
  --bg-page:#000000; --bg:#1c1c1e; --bg-alt:#2c2c2e; --bg-hover:rgba(255,255,255,.06);
  --glass:rgba(22,22,24,.72); --glass-line:rgba(255,255,255,.1);
  --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
  --line:rgba(255,255,255,.1); --track:#3a3a3c;
  --g:#30d158; --y:#ffd60a; --r:#ff453a; --na:#48484a;
  --strat-bg:rgba(191,90,242,.2); --strat:#da8fff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --shadow-hi:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.47;color:var(--text);background:var(--bg-page);-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--theme-soft);outline-offset:2px;border-radius:10px}
.muted{color:var(--text-2)}

/* Frosted header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#0a84ff,#5e5ce6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--text-2)}
.nav{display:flex;gap:2px;background:var(--bg-alt);padding:3px;border-radius:12px;overflow-x:auto;max-width:100%}
.nav button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:background-color .2s,color .2s}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-alt);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.viewas{display:inline-flex;align-items:center;gap:8px;background:var(--bg-alt);border-radius:10px;padding:3px 4px 3px 10px;font-size:13px;color:var(--text-2)}
.viewas select{border:0;background:var(--bg);border-radius:8px;padding:5px 8px;font-weight:600;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12);max-width:200px}
@media (max-width:1100px){.top-in{gap:12px}.nav{order:3;width:100%}.controls{margin-left:0}}

main{max-width:1280px;margin:0 auto;padding:40px 32px 96px}
@media (max-width:720px){main,.top-in{padding-left:16px;padding-right:16px} main{padding-top:24px}}
.hero{margin-bottom:28px}
.page-title{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0}
.page-sub{color:var(--text-2);font-size:17px;margin:8px 0 0}
@media (max-width:720px){.page-title{font-size:30px}}
.msgbar{display:flex;gap:10px;align-items:flex-start;background:var(--theme-soft);color:var(--text);border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:28px;max-width:900px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:24px}
.stack{margin-bottom:24px}
@media (max-width:920px){.grid2{grid-template-columns:minmax(0,1fr)}}
.wp{background:var(--bg);border-radius:var(--radius);padding:24px 26px;min-width:0;box-shadow:var(--shadow)}
.wp-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.wp-h h2{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
.wp-h > span{display:inline-flex;align-items:center;gap:12px}
.more{background:none;border:0;color:var(--theme);cursor:pointer;padding:0;font-size:14px;font-weight:500;white-space:nowrap}
.more:hover{text-decoration:underline}
.hint{font-size:13px;color:var(--text-2);margin:12px 4px 0;max-width:820px}

/* Lists */
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--text-2);padding:8px 14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:220px}
tbody tr.row td{transition:background-color .15s}
tbody tr.row:hover td{background:var(--bg-hover)}
tr.grp td{font-weight:600;cursor:pointer;user-select:none;padding-top:20px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--line)}
tr.grp .chev{display:inline-block;width:18px;transition:transform .2s}
tr.grp.collapsed .chev{transform:rotate(-90deg)}
.link{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;color:var(--text)}
.link:hover{color:var(--theme)}
.empty{color:var(--text-2);padding:20px 0;margin:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

.rag{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.sm{width:8px;height:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--text);white-space:nowrap}
.pill .dot{background:var(--c)}
.rep-ap{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px}
.rep-ap .pill{font-size:11.5px;padding:1px 8px 1px 6px}
.tile-upd .ul .rep-ap{display:inline-flex;margin:0 0 0 6px}
.pill.st{padding:3px 10px;background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
.prog{display:inline-flex;align-items:center;gap:10px;min-width:130px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;min-width:70px}
.prog .track i{display:block;height:100%;border-radius:3px}
.prog b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.late{color:var(--r);font-weight:600;white-space:nowrap}
.grid2 th.fit,.grid2 td.fit{width:1%;padding-left:8px;padding-right:8px}.grid2 td.fit{white-space:nowrap}
.warn{color:var(--y);font-weight:600}
.over{color:var(--r);font-weight:600}
.chip{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:12px}
.flag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--theme-soft);color:var(--theme);font-size:12px;font-weight:600}
.strat{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--strat-bg);color:var(--strat);font-weight:600;font-size:12px}
.loop{color:var(--theme);font-weight:600;text-decoration:none;font-size:14px}
.loop:hover{text-decoration:underline}

.person{display:inline-flex;gap:10px;align-items:center;min-width:0}
.pav{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;letter-spacing:.02em}
.pav.lg{width:40px;height:40px;font-size:14px}
.pn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pn b{font-weight:600}
.pn small{color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis}

.cmdbar{display:flex;align-items:center;gap:8px;padding:0 0 16px;flex-wrap:wrap}
.cmd{background:var(--bg-alt);border:0;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;border-radius:10px;white-space:nowrap;font-size:14px;font-weight:500}
.cmd:hover{background:var(--track)}
.cmd.primary{background:var(--theme);color:#fff}
.cmd.primary:hover{background:var(--theme-2)}
.spacer{flex:1}
.viewsel{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
.viewsel select{border:0;background:var(--bg-alt);border-radius:10px;padding:8px 12px;min-width:200px;font-size:14px;font-weight:500}
.listcard{background:var(--bg);border-radius:var(--radius);padding:22px 24px 12px;box-shadow:var(--shadow)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tile{background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;min-width:0}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.listcard .tiles{padding:4px 0 12px}
.wp .tiles .tile{box-shadow:0 0 0 1px var(--line)}
.wp .tiles .tile:hover{box-shadow:var(--shadow-hi)}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tile-top .code{font-size:12px;color:var(--text-2);font-weight:500;letter-spacing:.02em;margin-right:auto}
.tile-t{font-size:19px;font-weight:600;line-height:1.28;letter-spacing:-.015em;margin:-4px 0 0}
.tile-pm{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg-alt)}
.tile-prog .pl{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:8px}
.tile-prog .pl b{color:var(--text);font-variant-numeric:tabular-nums}
.tile-prog .track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.tile-prog .track i{display:block;height:100%;border-radius:4px}
.tile-upd{border-top:1px solid var(--line);padding-top:14px;flex:1}
.tile-upd .ul{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tile-upd .tx{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile-f{display:flex;justify-content:flex-end;min-height:20px}

/* Charts */
.donut-wrap{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.legend li{display:flex;align-items:center;gap:10px;font-size:14px}
.legend b{font-variant-numeric:tabular-nums;min-width:20px;display:inline-block;font-size:17px}
svg text{font-family:inherit}
.chart{width:100%;height:auto;max-width:560px;display:block}

/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
#scrim.open{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);box-shadow:var(--shadow-hi);border-radius:28px 0 0 28px;transform:translateX(104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;z-index:20;padding:calc(24px + env(safe-area-inset-top,0px)) 32px calc(40px + env(safe-area-inset-bottom,0px))}
@media (max-width:680px){#panel{border-radius:0;padding-left:20px;padding-right:20px}}
#panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.ph h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;line-height:1.15}
.x{background:var(--bg-alt);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--text-2)}
.x:hover{background:var(--track)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg-alt);font-size:12px;font-weight:600;color:var(--text-2)}
.btn{border:0;background:var(--bg-alt);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{background:var(--track)}
.btn.primary{background:var(--theme);color:#fff}
.btn.primary:hover{background:var(--theme-2)}
.sec{margin-top:28px}
.sec h3{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px;letter-spacing:.01em}
.group{background:var(--bg-alt);border-radius:16px;padding:4px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text-2);font-size:14px}
.kv .v{text-align:right;font-weight:500}
.k{font-size:12px;color:var(--text-2)}
.pmcard{display:flex;gap:14px;align-items:center;background:var(--bg-alt);border-radius:16px;padding:14px 16px}
.pmcard .pn b{font-size:16px}
.pmcard .role{margin-left:auto;font-size:12px;font-weight:600;color:var(--theme);background:var(--theme-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.people2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.people2 > div{background:var(--bg-alt);border-radius:16px;padding:12px 14px}
.people2.one{grid-template-columns:minmax(0,1fr)}
table.team{min-width:520px}
table.team th,table.team td{padding:10px 10px;vertical-align:top}
table.team th:first-child,table.team td:first-child{padding-left:0}
table.team td.wrap{min-width:160px}
.lnks{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.lnk-sec{margin:-8px 0 20px}
.lnk-sec .k{margin-bottom:4px}
.tile-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-rows{display:grid;gap:8px;margin-bottom:8px}
.ed-row{display:grid;gap:8px;align-items:center}
.tm-row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr) auto}
.ln-row{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto}
.btn.rm{padding:8px 12px;font-size:16px;line-height:1}
.btn.add{padding:8px 14px;font-size:14px}
@media (max-width:640px){.tm-row,.ln-row{grid-template-columns:minmax(0,1fr) auto;background:var(--bg-alt);border-radius:14px;padding:8px}.tm-row > :not(.rm),.ln-row > :not(.rm){grid-column:1}.ed-row .rm{grid-column:2;grid-row:1}.ed-row input,.ed-row select{background:var(--bg)!important}}
@media (max-width:520px){.people2{grid-template-columns:minmax(0,1fr)}}
.access{background:var(--bg-alt);border-radius:16px;padding:14px 16px;font-size:14px}
.access ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.access li{display:flex;align-items:center;gap:10px}
.access .lvl{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap}
.access .pn{min-width:0}
@media (max-width:640px){.access .lvl{white-space:normal;text-align:right;max-width:45%}}
.access .arrow{color:var(--text-3);font-size:12px;padding-left:9px}
.matrix td,.matrix th{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line)}
.matrix td:first-child,.matrix th:first-child{text-align:left;color:var(--text-2);font-weight:400}
.rep{background:var(--bg-alt);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rep-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rep p{margin:4px 0;font-size:14px}
.rep .lbl{color:var(--text-2)}
.hist-c{padding:10px 0;border-bottom:1px solid var(--line)}
.hist-c:last-of-type{border-bottom:0}
.hist-c .who{font-size:12px;color:var(--text-2);margin-bottom:2px}
.cmts{background:var(--bg-alt);border-radius:16px;padding:6px 16px 12px}
.cmt{display:inline-flex;gap:8px;align-items:center;max-width:300px}
.cmt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{background:var(--theme-soft);border:0;border-radius:999px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--theme);font-weight:700;flex:none}
.note{font-size:12px;color:var(--text-2);margin:10px 4px 0}

/* Form */
form .frow{margin-bottom:16px}
form label.t,form legend{display:block;font-weight:600;margin-bottom:6px;font-size:13px;padding:0;color:var(--text-2)}

let PROJ = [];
let MODE = 'loading';   // loading | db | empty | local
let db = null;
const queues = {};
const parse = (o) => {
  const p = Object.assign({}, JSON.parse(JSON.stringify(o)), {id:+o.id});
  if (!Array.isArray(p.stakeholders)) p.stakeholders = p.product ? [p.product] : [];
  delete p.product;
  if (!Array.isArray(p.team)) p.team = p.stakeholders.map(n => ({n, role:'Стейкхолдер', topics:''}));
  p.team = p.team.filter(m => m && m.n).map(m => ({n:m.n, role:m.role || '', topics:m.topics || ''}));
  if (!Array.isArray(p.links)) p.links = p.loop ? [{t:'Loop', u:p.loop}] : [];
  p.links = p.links.filter(l => l && l.u).map(l => ({t:l.t || '', u:l.u}));
  delete p.loop;
  syncStakeholders(p);
  (p.reports || []).forEach(r => { r.rag = calcRag(r); if (!r.approval) r.approval = AP_OK; });
  const last = (p.reports || []).filter(isApproved).sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
  if (last) p.rag = last.rag;
  return p;
};
function persist(p){
  if (!db) return Promise.resolve();
  const id = String(p.id), body = JSON.parse(JSON.stringify(p));
  const prev = queues[id] || Promise.resolve();
  const next = prev.then(() => db.doc('projects/' + id).set(body)).catch(e => { toast(t('saveErr')); console.error(e); });
  queues[id] = next;
  return next;
}
async function seed(){
  const data = buildSeed();
  if (!db){ PROJ = data.map(parse); MODE = 'local'; render(); return; }
  for (const p of data){ await db.doc('projects/' + p.id).set(p); }
}
async function resetDemo(){
  if (!confirm(t('resetConfirm'))) return;
  if (db){ for (const p of PROJ){ await db.doc('projects/' + p.id).delete(); } await seed(); }
  else { PROJ = buildSeed().map(parse); render(); }
}
async function initData(){
  try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch(e) { db = null; }
  if (!db){ MODE = 'local'; PROJ = buildSeed().map(parse); render(); return; }
  db.collection('projects').onSnapshot(snap => {
    if (snap.empty){ if (snap.metadata.fromCache) return; MODE = 'empty'; PROJ = []; }
    else { MODE = 'db'; PROJ = snap.docs.map(d => parse(Object.assign({}, d.data(), {id:d.id})));
      PROJ.filter(p => ['Завершено','Скасовано'].includes(p.status)).forEach(p => { p.status = 'Архівний'; p.archivedAt = p.archivedAt || p.lastUpdate || iso(TODAY); persist(p); }); }
    render();
  }, err => { console.error(err); if (MODE === 'loading'){ db = null; MODE = 'local'; PROJ = buildSeed().map(parse); render(); } });
}

let gSeq = 0;
function table(cols, rows, opt = {}){
  if (!rows.length) return `<p class="empty">${opt.empty || t('empty')}</p>`;
  const head = `<thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.l()}</th>`).join('')}</tr></thead>`;
  const row = (r, gk, hid) => `<tr class="row"${gk ? ` data-gk="${gk}"` : ''}${hid ? ' hidden' : ''}>${cols.map(c => `<td class="${c.cls || ''}">${c.r(r)}</td>`).join('')}</tr>`;
  let body = '';
  if (opt.group){
    const keys = [], map = {};
    rows.forEach(r => { const k = opt.group(r); if (!map[k]){ map[k] = []; keys.push(k); } map[k].push(r); });
    if (opt.order) keys.sort((a, b) => opt.order.indexOf(a) - opt.order.indexOf(b));
    keys.forEach(k => { const g = 'g' + (++gSeq);
      body += `<tr class="grp${opt.collapsed ? ' collapsed' : ''}" data-act="grp" data-g="${g}"><td colspan="${cols.length}"><span class="chev">▾</span>${esc(k)} <span class="muted">(${map[k].length})</span></td></tr>` + map[k].map(r => row(r, g, opt.collapsed)).join(''); });
  } else body = rows.map(r => row(r)).join('');
  return `<div class="tablewrap"><table>${head}<tbody>${body}</tbody></table></div>`;
}

function dynamics(){
  const pts = [];
  for (let k = 6; k >= 0; k--){
    const tt = daysAgo(k * 14), c = {'Зелений':0,'Жовтий':0,'Червоний':0,'':0};
    // кожен проєкт, що вже існував на дату зрізу (і ще не в архіві): стан останнього погодженого звіту; немає звіту — сірий
    visAll().forEach(p => { if (p.status === 'Скасовано') return;
      const cr = (p.changes || []).find(x => x.kind === 'create'); if (cr && new Date(cr.date) > tt) return;
      if (isArch(p) && tt >= lastUpd(p)) return;   // в день архивации проект уже в архиве — как в кольце
      const rs = repsOf(p).filter(r => r.d <= tt && isApproved(r)); c[rs.length ? rs[rs.length - 1].rag : '']++; });
    pts.push({tt, c});
  }
  const W = 500, H = 230, L = 30, B = 30, TP = 12;
  const max = Math.max(1, ...pts.map(p => p.c['Зелений'] + p.c['Жовтий'] + p.c['Червоний'] + p.c['']));
  // у каждого сегмента видно число: сегмент не ниже MIN, масштаб подбирается так, чтобы самый высокий столбец поместился
  const KS = RAGS.concat(['']), PH = H - B - TP, MIN = 18, seg = (v, u) => v ? Math.max(v * u, MIN) : 0;
  let u = PH / max;
  for (let n = 0; n < 5; n++) { const top = Math.max(...pts.map(p => KS.reduce((a, k) => a + seg(p.c[k], u), 0))); if (top <= PH) break; u *= PH / top; }
  const slot = (W - L - 8) / pts.length, bw = slot * 0.5, y = v => H - B - v * u;
  let g = '';
  [0, Math.ceil(max / 2), max].forEach(v => { g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-2)">${v}</text>`; });
  pts.forEach((p, i) => { const x = L + i * slot + (slot - bw) / 2; let base = H - B;
    KS.forEach(k => { const v = p.c[k]; if (!v) return; const h = seg(v, u), y1 = base - h; base = y1;
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(h - 2, 1)}" rx="5" fill="${k ? RC[k] : 'var(--na)'}"><title>${fmt(p.tt)}: ${k ? tv(k) : t('notRated')} — ${v}</title></rect>`;
      g += `<text x="${x + bw / 2}" y="${y1 + h / 2 + 3}" text-anchor="middle" font-size="11" font-weight="600" fill="${k ? '#fff' : 'var(--text)'}">${v}</text>`; });
    g += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--text-2)">${i === pts.length - 1 ? t('today') : fmtShort(p.tt)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('wpDyn')}">${g}</svg><p class="hint">${t('dynHint')}</p>`;
}

// #33: на широком экране ширины колонок закрепляются после первой раскладки по содержимому (фильтры и вид их не меняют);
// пересчёт — при смене колонок, переходе на вкладку и изменении окна. На телефоне и планшете (< 900 px) — как раньше.
let TW = {};
function tLockOpen(key, cols){
  const w = TW[key];
  if (!w || w.cols !== cols.join(',') || innerWidth < 900) return '<table>';
  const user = (TS[key] && TS[key].w) || {}, ws = cols.map((c, i) => user[c] || w.w[i]);
  return `<table class="locked" style="table-layout:fixed;width:${ws.reduce((a, b) => a + b, 0)}px"><colgroup>${ws.map(x => `<col style="width:${x}px">`).join('')}</colgroup>`;
}
function tLockMeasure(){
  if (innerWidth < 900) return;
  document.querySelectorAll('.dt[data-tkey]').forEach(el => {
    const key = el.dataset.tkey, cols = (TS[key] ? TS[key].cols : []).join(',');
    if (TW[key] && TW[key].cols === cols) return;
    const w = [...el.querySelectorAll('thead th')].map(th => Math.round(th.getBoundingClientRect().width));
    if (w.length) TW[key] = { cols, w };
  });
}
addEventListener('resize', () => { TW = {}; });
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.col-rs'); if (!h || e.button) return;
  e.preventDefault(); e.stopPropagation();
  const key = h.dataset.rs, id = h.dataset.col, th = h.closest('th'), tr = th.parentElement, idx = [...tr.children].indexOf(th);
  const col = th.closest('table').querySelectorAll('col')[idx]; if (!col) return;
  const x0 = e.clientX, w0 = parseFloat(col.style.width) || th.getBoundingClientRect().width;
  const wOf = x => Math.max(56, Math.min(800, Math.round(w0 + x - x0)));
  h.classList.add('on');
  const move = ev => { col.style.width = wOf(ev.clientX) + 'px'; };
  const stop = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', cancel); };
  const up = ev => { stop(); TS[key].w = Object.assign({}, TS[key].w || {}, {[id]: wOf(ev.clientX)}); tSave(key); rerenderMain(); };
  const cancel = () => { stop(); rerenderMain(); };   // жест отменён — ширина прежняя
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', cancel);
}, true);

const pop = document.getElementById('pop');
let POP = null;
function openPop(anchor, kind, key, col){
  POP = {kind, key, col, q:''};

  renderPop();
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = kind === 'filter' ? r.left : r.right - w, top = r.bottom + 6;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  const f = pop.querySelector('input[type=search]'); if (f) f.focus();
}
function closePop(){ POP = null; pop.hidden = true; pop.innerHTML = ''; }

  if (!POP) return;
  if (POP.kind === 'filter'){
    const d = TDEFS[POP.key][POP.col], st = tState(POP.key), cur = st.filters[POP.col] || [];

// #26: поле даты — «дд.мм.рррр» с подсказкой на языке интерфейса (встроенное поле браузера берёт язык ОС) и кнопка календаря.

const VAL_DESC = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
const dmyMask = r => { const d = String(r || '').replace(/\D/g, '').slice(0, 8); return d.length > 4 ? `${d.slice(0, 2)}.${d.slice(2, 4)}.${d.slice(4)}` : d.length > 2 ? `${d.slice(0, 2)}.${d.slice(2)}` : d; };
const dmyParse = x => { if (!x) return ''; const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(x); if (!m) return null; const dt = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));

const dmyFmt = v => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : ''; };
function enhanceDates(root){

    const txt = document.createElement('input'); txt.type = 'text'; txt.inputMode = 'numeric'; txt.autocomplete = 'off';

    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'date-btn'; btn.title = btn.ariaLabel = t('pickDate'); btn.disabled = orig.disabled;
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7 3v3M17 3v3M4 9h16M5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-12A1.5 1.5 0 0 1 5.5 5z"/></svg>';
    orig.parentNode.insertBefore(wrap, orig); wrap.append(txt, btn, orig); orig.classList.add('date-native'); orig.tabIndex = -1;
    const lbl = root.querySelector(`label[for="${orig.id}"]`); if (lbl) lbl.htmlFor = txt.id;
    // код формы задаёт дату программно (orig.value = …) — показать её в текстовом поле
    Object.defineProperty(orig, 'value', { get(){ return VAL_DESC.get.call(this); }, set(v){ VAL_DESC.set.call(this, v); txt.value = dmyFmt(v); } });

    orig.addEventListener('change', () => { txt.value = dmyFmt(VAL_DESC.get.call(orig)); });

  });

const NOTIF_LOADED = new Date().toISOString(), NOTIF_READ = {};

function notifFor(kind, author, diffs, p, risk){

  const pm = p.pm === me, owner = p.owner === me, team = (p.team || []).some(m => m.n === me) || (p.stakeholders || []).includes(me);

function notifItems(){

      const kind = notifKind(c), risk = c.ref && c.ref.type === 'risk' ? (p.risks || []).find(k => String(k.id) === String(c.ref.id)) : null;
      if (notifFor(kind, c.who, c.diffs, p, risk)) out.push({p, c, kind, date:c.date, who:c.who, unread:c.date > read});

function projectPanel(id, showCm, keep, showCh){
  const p = pById(id); if (!p) return;
  state.panel = {kind:'project', id, showCm:!!showCm, showCh:!!showCh};
  const rs = repsOf(p), last8 = rs.filter(isApproved).slice(-8), edit = canEditP(p) && !isArch(p);
  let dev = '';
  if (p.fc && p.plan){ const dd = Math.round((D(p.fc) - D(p.plan)) / DAY); dev = dd > 0 ? ` <span class="late">+${dd} ${t('days')}</span>` : dd < 0 ? ` <span class="muted">${dd} ${t('days')}</span>` : ''; }
  const dims = [['rag','rag'],['sched','rSched'],['budget','rBudget'],['res','rRes']];
  const matrix = last8.length ? `<div class="tablewrap"><table class="matrix"><thead><tr><th></th>${last8.map(r => `<th>${fmtShort(r.d)}</th>`).join('')}</tr></thead><tbody>
    ${dims.map(([k, l]) => `<tr><td>${fl(l)}</td>${last8.map(r => `<td>${dotOnly(r[k])}</td>`).join('')}</tr>`).join('')}
    <tr><td>${fl('progress')}</td>${last8.map(r => `<td class="muted">${r.progress}</td>`).join('')}</tr></tbody></table></div>` : `<p class="empty">${t('noReportsYet')}</p>`;
  const repList = rs.slice().reverse().map(r => `<div class="rep rep-open" role="button" tabindex="0" data-act="repopen" data-id="${p.id}" data-rid="${esc(r.id)}">
    <div class="rep-h"><b>${fmt(r.d)}</b>${ragHtml(r.rag)}${person(r.author)}${r.decision ? `<span class="flag">${t('needDecision')}</span>` : ''}${apBadge(r.approval)}</div>
    <p><b>${esc(r.title)}</b></p><p><span class="lbl">${t('done')}:</span> ${esc(r.done)}</p><p><span class="lbl">${t('plan')}:</span> ${esc(r.next)}</p>
    ${r.issues ? `<p><span class="lbl">${t('issues')}:</span> ${esc(r.issues)}</p>` : ''}${r.decisionText ? `<p><span class="lbl">${t('needDecision')}:</span> ${esc(r.decisionText)}</p>` : ''}</div>`).join('');
  const cms = (p.comments || []).slice().reverse();
  const cmItem = c => `<div class="hist-c"><div class="who">${fmtDT(D(c.date))} · ${esc(c.who)}</div><div>${esc(c.txt)}</div></div>`;
  const cmBlock = cms.length ? '<div class="cmts">' + cmItem(cms[0]) + (cms.length > 1 ? (showCm ? cms.slice(1).map(cmItem).join('') : '') +
      `<button class="more" data-act="togglecm">${showCm ? t('hideHistory') : t('showHistory') + ` (${cms.length})`}</button>` : '') + '</div>'
    : `<p class="empty">${t('noComments')}</p>`;
  const risks = (p.risks || []).slice().sort((a, b) => b.p * b.i - a.p * a.i);
  // один отчёт на погодженні на проект: пока PMO не решил, кнопки нового отчёта нет
  const pendRep = rs.filter(r => r.approval === AP_PEND)[0];
  const actions = edit
    ? `<div class="actbar">${pendRep ? '' : `<button class="btn primary" data-act="newrep" data-id="${p.id}">${iconPlus}${t('addReport')}</button>`}
       <button class="btn" data-act="editproj" data-id="${p.id}">${iconEdit}${t('editProject')}</button></div>`
    : `<p class="note lock">🔒 ${isArch(p) ? t('archivedNote') : t('noEdit')}</p>`;
  const onePend = edit && pendRep ? `<p class="note">${esc(t('onePending').replace('{date}', fmt(pendRep.d)))}</p>` : '';
  const lastR = rs[rs.length - 1];
  const apNotes = rs.filter(r => r.approval === AP_PEND).reverse().map(r => `<div class="apnote">${esc(t('pendingApproval').replace('{date}', fmt(r.d)))}${isPMO() ? `<button class="link" data-act="repopen" data-id="${p.id}" data-rid="${esc(r.id)}">${t('apTitle')} →</button>` : ''}</div>`).join('')
    + (lastR && lastR.approval === AP_RET ? `<div class="apnote ret">${esc(t('returnedNote').replace('{date}', fmt(lastR.d)).replace('{comment}', lastR.apNote || '—'))}
       <button class="link" data-act="repopen" data-id="${p.id}" data-rid="${esc(lastR.id)}">${t('openReport')} →</button>
       ${edit ? `<div><button class="btn" data-act="newfromret" data-id="${p.id}" data-rid="${esc(lastR.id)}">${iconPlus}${t('newFromReturned')}</button></div>` : ''}</div>` : '');
  openPanel(`<div class="ph"><div><div class="k">${esc(p.code)} · ${t('listLabel')} «${t('navProjects')}»</div><h2>${esc(p.title)}</h2></div>${closeBtn()}</div>
    <div class="badges">${typeHtml(p.type)}${ragHtml(p.rag)}${statusPill(p.status)}<span class="badge">${esc(tv(p.prio))}</span></div>
    ${(p.links || []).length ? `<div class="lnk-sec"><div class="k">${fl('links')}</div>${linksHtml(p)}</div>` : ''}
    ${actions}${onePend}${isPMO() && !isArch(p) ? `<div class="actbar"><button class="btn" data-act="assign" data-id="${p.id}">${t('assignBtn')}</button></div>` : ''}
    ${apNotes ? `<div style="margin-top:14px">${apNotes}</div>` : ''}
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    <div class="sec"><h3>${t('secPeople')}</h3>
      <div class="pmcard">${avatar(p.pm, 'lg')}<span class="pn"><b>${esc(p.pm)}</b><small>${esc(roleOf(p.pm))} · ${esc(email(p.pm))}</small></span><span class="role">${t('pmRole')}</span></div>
      <div class="people2 one"><div><div class="k">${fl('owner')}</div>${person(p.owner, roleOf(p.owner))}</div></div></div>
    <div class="sec"><h3>${fl('team')}</h3>${(p.team || []).length
      ? `<div class="tablewrap"><table class="team"><thead><tr><th>${fl('tmPerson')}</th><th>${fl('tmRole')}</th><th>${fl('tmTopics')}</th></tr></thead><tbody>${p.team.map(m => `<tr><td>${person(m.n, roleOf(m.n))}</td><td class="wrap">${esc(m.role)}</td><td class="wrap">${m.topics ? esc(m.topics) : '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">${t('noTeam')}</p>`}</div>
    <div class="sec"><h3>${t('secDates')}</h3><div class="group">
      ${kv('start', fmt(D(p.start)))}${kv('golive', fmt(D(p.golive)))}${kv('plan', planHtml(p))}${kv('fc', p.fc ? fmt(D(p.fc)) + dev : '')}${p.ae ? kv('ae', fmt(D(p.ae))) : ''}${p.archivedAt ? kv('archived', fmt(D(p.archivedAt))) : ''}</div></div>
    <div class="sec"><h3>${t('secMoney')}</h3><div class="group">
      ${kv('progress', barHtml(p.progress))}${kv('last', freshHtml(p))}${kv('budget', money(p.budget))}${kv('actual', money(p.actual) + ' · ' + useHtml(p))}${kv('dept', esc(p.dept))}</div></div>
    <div class="sec"><h3>${t('secChanges')}</h3>${changesHtml(p, showCh)}</div>
    <div class="sec"><h3>${fl('comments')}</h3>${cmBlock}
      ${isArch(p) ? `<p class="note lock" style="margin-top:12px">🔒 ${t('archNoComments')}</p>` : `<form id="cmform" class="frow" style="margin-top:12px" novalidate>
        <label class="t" for="cm-t">${t('addComment')}</label><textarea id="cm-t" placeholder="${t('cmtPh')}"></textarea>
        <p class="err" id="cm-err" hidden></p><div class="actions" style="margin-top:10px"><button type="submit" class="btn">${t('addComment')}</button></div></form>`}</div>
    <div class="sec"><h3>${t('secHistory')}</h3>${matrix}</div>
    <div class="sec"><h3>${t('secReports')} (${rs.length})</h3>${repList || `<p class="empty">${t('noReportsYet')}</p>`}</div>
    <div class="sec"><div class="sec-h"><h3>${t('secRisks')} (${risks.length})</h3>${edit ? `<button class="more" data-act="newrisk" data-id="${p.id}">${iconPlus} ${t('addRisk')}</button>` : ''}</div>
      ${risks.length ? `<div class="rlist">${risks.map(k => `<button class="rrow" data-act="riskopen" data-id="${p.id}" data-rid="${k.id}">${scoreHtml(k.p * k.i)}<span class="rt">${esc(k.title)}</span><span class="muted">${esc(tv(k.type))} · ${esc(tv(k.status))}</span></button>`).join('')}</div>` : `<p class="empty">${t('emptyRisks')}</p>`}</div>
    <div class="sec"><h3>${t('accessTitle')}</h3><div class="access"><div class="muted" style="font-size:13px">${t('accessDesc')}</div><ol>${accessList(p)}</ol></div></div>`, keep);
  const cmf = document.getElementById('cmform');   // в архиве формы комментария нет
  if (cmf) cmf.addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('cm-t').value.trim();
    if (!v){ const er = document.getElementById('cm-err'); er.textContent = t('errCmt'); er.hidden = false; return; }
    p.comments = (p.comments || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, txt:v}]);
    rerenderMain(); projectPanel(id, state.panel.showCm, true, state.panel.showCh); persist(p); toast(t('cmtSaved'));
  });
  if (showCm && !keep){ const s = panel.querySelector('#cmform'); if (s && s.parentElement.scrollIntoView) s.parentElement.scrollIntoView({block:'start'}); }
}

/* ================= Forms ================= */
const opt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label || tv(v))}</option>`;
const peopleSelect = (id, cur, req) => `<select id="${id}">${req ? '' : `<option value="">${t('notSet')}</option>`}${Object.keys(ORG).map(n => opt(n, cur, `${n} — ${roleOf(n)} · ${email(n)}`)).join('')}</select>`;
const segPick = (name, values, cur, colors) => `<div class="opts">${values.map((v, i) => `<input type="radio" id="${name}${i}" name="${name}" value="${esc(v)}"${v === cur ? ' checked' : ''}><label for="${name}${i}">${colors ? `<span class="dot sm" style="background:${RC[v]}"></span>` : ''}${esc(tv(v))}</label>`).join('')}</div>`;
const ragPick = (name, label, req, cur) => `<fieldset class="ragpick"><legend>${label}${req ? ' *' : ''}</legend>${segPick(name, RAGS, cur, true)}</fieldset>`;
const formHead = (title, sub) => `<div class="ph"><div><div class="k">${sub}</div><h2>${title}</h2></div>${closeBtn()}</div>`;
const fErr = form => msg => { const e = form.querySelector('.err'); e.textContent = msg; e.hidden = false; e.scrollIntoView && e.scrollIntoView({block:'nearest'}); };
const radioVal = (form, n) => (form.querySelector(`input[name="${n}"]:checked`) || {}).value || '';

const rmBtn = () => `<button type="button" class="btn rm" data-ed="rm" aria-label="${t('rmRow')}" title="${t('rmRow')}">×</button>`;
const tmRow = m => `<div class="ed-row tm-row"><select class="tm-n" aria-label="${fl('tmPerson')}"><option value="">${t('notSet')}</option>${Object.keys(ORG).map(n => opt(n, m.n, `${n} — ${roleOf(n)}`)).join('')}</select>`
  + `<input type="text" class="tm-r" aria-label="${fl('tmRole')}" placeholder="${fl('tmRole')} *" value="${esc(m.role || '')}">`
  + `<input type="text" class="tm-t" aria-label="${fl('tmTopics')}" placeholder="${fl('tmTopics')}" value="${esc(m.topics || '')}">${rmBtn()}</div>`;
const lnRow = l => `<div class="ed-row ln-row"><input type="text" class="ln-t" aria-label="${fl('linkTitle')}" placeholder="${fl('linkTitle')}" value="${esc(l.t || '')}">`
  + `<input type="text" inputmode="url" class="ln-u" aria-label="${fl('linkUrl')}" placeholder="https://" value="${esc(l.u || '')}">${rmBtn()}</div>`;
function projectForm(p){
  const isNew = !p; p = p || {pm:'', type:'Звичайний', status:'Ініціація', prio:'2 — Середній', dept:'ІТ', start:iso(TODAY)};
  state.panel = {kind:'form'};
  openPanel(`${formHead(isNew ? t('newProject') : t('editProject') + ': ' + esc(p.title), `${t('listLabel')} «${t('navProjects')}»`)}
  <form id="pform" novalidate>
    <h3 class="fsec">${t('fGeneral')}</h3>
    <div class="frow"><label class="t" for="p-title">${fl('title')} *</label><input type="text" id="p-title" value="${esc(p.title || '')}"></div>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-code">${fl('code')}</label><input type="text" id="p-code" value="${esc(p.code || '')}" placeholder="${t('codeAuto')}" readonly disabled></div>
      <div><label class="t" for="p-dept">${fl('dept')}</label><select id="p-dept">${DEPTS.map(d => opt(d, p.dept)).join('')}</select></div>
    </div>
    ${isNew ? `<fieldset class="ragpick"><legend>${fl('type')} *</legend>${segPick('p-type', TYPES, p.type)}</fieldset>` : ''}
    <h3 class="fsec">${t('fPeople')}</h3>
    ${isNew ? `<div class="frow"><label class="t" for="p-pm">${fl('pm')} * <span class="muted">· ${t('m365')}</span></label>${peopleSelect('p-pm', p.pm, true)}</div>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-owner">${fl('owner')}</label>${peopleSelect('p-owner', p.owner)}</div>
    </div>` : `<div class="fgrid2 frow">
      <div><label class="t">${fl('pm')}</label><div class="fixedval" id="p-pm-fixed">${esc(p.pm || '—')}</div><input type="hidden" id="p-pm" value="${esc(p.pm || '')}"></div>
      <div><label class="t">${fl('owner')}</label><div class="fixedval">${esc(p.owner || '—')}</div><input type="hidden" id="p-owner" value="${esc(p.owner || '')}"></div>
    </div><p class="hint" style="margin-top:-6px">${t('pmOnlyPmo')}</p>`}
    <div class="frow"><span class="t lbl-t">${fl('team')} <span class="muted">· ${t('m365')}</span></span>
      <div class="ed-rows" id="p-team">${((p.team || []).length ? p.team : [{}]).map(tmRow).join('')}</div>
      <button type="button" class="btn add" data-ed="addtm">${t('addMember')}</button></div>
    <div class="frow"><span class="t lbl-t">${fl('links')}</span>
      <div class="ed-rows" id="p-links">${(p.links || []).map(lnRow).join('')}</div>
      <button type="button" class="btn add" data-ed="addln">${t('addLink')}</button></div>
    ${isNew ? '' : `<p class="note">${t('accessRecalc')}</p>`}
    ${isNew ? `<h3 class="fsec">${t('fDates')}</h3>
    <div class="fgrid frow">
      <div><label class="t" for="p-start">${fl('start')}</label><input type="date" id="p-start" value="${p.start || ''}"></div>
      <div><label class="t" for="p-golive">${fl('golive')}</label><input type="date" id="p-golive" value="${p.golive || ''}"></div>
      <div><label class="t" for="p-plan">${fl('plan')}</label><input type="date" id="p-plan" value="${p.plan || ''}"></div>
    </div>
    <div class="fgrid2 frow"><div><label class="t" for="p-status">${fl('status')}</label><select id="p-status">${REPORT_STATUSES.map(s => opt(s, p.status)).join('')}</select></div><div></div></div>` : ''}
    <h3 class="fsec">${t('secMoney')}</h3>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-prio">${fl('prio')}</label><select id="p-prio">${PRIOS.map(s => opt(s, p.prio)).join('')}</select></div>
      <div><label class="t" for="p-budget">${fl('budget')}, $</label><input type="text" id="p-budget" inputmode="numeric" autocomplete="off" onfocus="this.value=this.value.replace(/\\s/g,'');if(this.value==='0')this.value=''" oninput="const m=/^(.*?)[.,](\\d{1,2})$/.exec(this.value.replace(/\\s/g,''));this.value=m?String(Math.round(+(m[1].replace(/[^0-9]/g,'')||0)+(+m[2].padEnd(2,'0'))/100)):this.value.replace(/[^0-9]/g,'')" onblur="this.value=this.value.replace(/[^0-9]/g,'').replace(/^0+(?=\\d)/,'').replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ')" value="${grp(p.budget || 0)}"></div>
    </div>
    <div class="frow"><label class="t" for="p-desc">${fl('desc')}</label><textarea id="p-desc">${esc(p.desc || '')}</textarea></div>
    <p class="err" hidden></p>
    <div class="actions"><button type="submit" class="btn primary">${t('save')}</button><button type="button" class="btn" data-act="${isNew ? 'close' : 'backp'}" data-id="${p.id || ''}">${t('cancel')}</button></div>
  </form>`);
  const form = document.getElementById('pform'), err = fErr(form), g = id => form.querySelector('#' + id);
  form.addEventListener('click', e => {
    const b = e.target.closest('[data-ed]');
    if (!b) return;
    if (b.dataset.ed === 'addtm'){ g('p-team').insertAdjacentHTML('beforeend', tmRow({})); g('p-team').lastElementChild.querySelector('select').focus(); }
    else if (b.dataset.ed === 'addln'){ g('p-links').insertAdjacentHTML('beforeend', lnRow({})); g('p-links').lastElementChild.querySelector('input').focus(); }
    else if (b.dataset.ed === 'rm') b.closest('.ed-row').remove();
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const vals = {title:g('p-title').value.trim(), code:g('p-code').value.trim(), dept:g('p-dept').value,
      pm:g('p-pm').value, owner:g('p-owner').value, prio:g('p-prio').value, budget:Math.round(+g('p-budget').value.replace(/\s/g, '') || 0), desc:g('p-desc').value.trim()};
    if (!vals.title) return err(t('errTitle'));
    // #27: название уникально (без учёта регистра и пробелов); прежнее название при правке не мешает
    const tk = x => String(x || '').trim().replace(/\s+/g, ' ').toLowerCase();
    if (tk(vals.title) !== tk(isNew ? '' : p.title) && PROJ.some(x => (isNew || x.id !== p.id) && tk(x.title) === tk(vals.title))) return err(t('errTitleTaken'));
    if (!vals.pm) return err(t('errPM'));
    // #54: даты нового проекта не раньше старта
    if (isNew && g('p-start').value && ['p-golive','p-plan'].some(id => g(id).value && g(id).value < g('p-start').value)) return err(t('errDatesOrder'));
    const team = [], links = [];
    for (const r of form.querySelectorAll('#p-team .tm-row')){
      const n = r.querySelector('.tm-n').value, role = r.querySelector('.tm-r').value.trim(), topics = r.querySelector('.tm-t').value.trim();
      if (!n) continue;                               // пустая строка или строка без участника
      if (!role) return err(t('errRole'));
      if (!team.some(m => m.n === n)) team.push({n, role, topics});   // повтор участника — остаётся первая строка
    }
    for (const r of form.querySelectorAll('#p-links .ln-row')){
      const lt = r.querySelector('.ln-t').value.trim(), u = r.querySelector('.ln-u').value.trim();
      if (!lt && !u) continue;
      if (!/^https:\/\//i.test(u)) return err(t('errUrl'));
      links.push({t:lt || 'Посилання', u});
    }
    vals.team = team; vals.links = links;
    if (isNew){
      const id = Math.max(0, ...PROJ.map(x => x.id)) + 1;
      const np = Object.assign({id, type:radioVal(form, 'p-type') || 'Звичайний', status:g('p-status').value, progress:0,
        start:g('p-start').value, golive:g('p-golive').value, plan:g('p-plan').value, fc:'', actual:0, rag:'', lastUpdate:'', lastReport:'',
        reports:[], comments:[], risks:[], changes:[{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'create', reason:'', diffs:[]}]}, vals);
      syncStakeholders(np);
      if (!np.code) np.code = 'PRJ-' + String(id).padStart(3, '0');
      PROJ.push(np);
      rerenderMain();
      if (canSee(np)) projectPanel(id, false); else closePanel();
      persist(np); toast(t('savedProject'));
    } else {
      const LST = {team:teamStr, links:linksStr};
      const same = k => LST[k] ? JSON.stringify(p[k] || []) === JSON.stringify(vals[k]) : String(p[k] ?? '') === String(vals[k] ?? '');
      const diffs = Object.keys(vals).filter(k => !same(k)).map(k => LST[k] ? {f:k, from:LST[k](p[k]), to:LST[k](vals[k])} : {f:k, from:p[k] ?? '', to:vals[k]});
      if (!diffs.length){ projectPanel(p.id, false); return; }
      Object.assign(p, vals);
      syncStakeholders(p);
      p.changes = (p.changes || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'edit', reason:'', diffs:diffs.filter(d => d.f !== 'desc')}]);
      rerenderMain();
      if (canSee(p)) projectPanel(p.id, false); else closePanel();
      persist(p); toast(t('savedEdit'));
    }
  });
}

// #43: смена PM / власника после создания — только PMO; в приложении — запись «Призначення», синхронизация переносит
function assignForm(p){
  if (!p || !isPMO() || isArch(p)) return;
  state.panel = {kind:'form'};
  openPanel(`${formHead(t('assignTitle'), `${esc(p.code)} · ${t('listLabel')} «${t('navProjects')}»`)}
  <p class="note">${t('assignHint')}</p>
  <form id="aform" novalidate>
    <div class="fgrid2 frow"><div><label class="t">${fl('pm')}</label><div class="fixedval">${esc(p.pm || '—')}</div></div>
      <div><label class="t" for="a-pm">${t('assignNewPm')}</label>${peopleSelect('a-pm', '')}</div></div>
    <div class="fgrid2 frow"><div><label class="t">${fl('owner')}</label><div class="fixedval">${esc(p.owner || '—')}</div></div>
      <div><label class="t" for="a-own">${t('assignNewOwner')}</label>${peopleSelect('a-own', '')}</div></div>
    <div class="frow"><label class="t" for="a-note">${t('assignNote')} *</label><textarea id="a-note"></textarea></div>
    <p class="err" hidden></p>
    <div class="actions"><button type="submit" class="btn primary">${t('save')}</button><button type="button" class="btn" data-act="backp" data-id="${p.id}">${t('cancel')}</button></div>
  </form>`);
  const form = document.getElementById('aform'), err = fErr(form), g = id => form.querySelector('#' + id);
  form.addEventListener('submit', e => {
    e.preventDefault();
    // те же правила, что у синхронизации (tests/cases/assignments.json): что-то меняется, комментарий есть
    const pm = g('a-pm').value, own = g('a-own').value, note = g('a-note').value.trim();
    const diffs = [];
    if (pm && pm !== p.pm) diffs.push({f:'pm', from:p.pm || '—', to:pm});
    if (own && own !== p.owner) diffs.push({f:'owner', from:p.owner || '—', to:own});
    if (!diffs.length) return err(t('errAssignSame'));
    if (!note) return err(t('errAssignNote'));
    if (pm) p.pm = pm;
    if (own) p.owner = own;
    p.changes = (p.changes || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'assign', reason:note, diffs}]);
    rerenderMain(); projectPanel(p.id, false); persist(p); toast(t('savedAssign'));
  });
}

// показники картки, які змінює звіт (поля, яких у звіті немає, не змінюються)
function reportVals(p, r){
  const vals = {};
  if (r.status) vals.status = ['Завершено','Скасовано'].includes(r.status) ? 'Архівний' : r.status;
  ['type','start','golive','plan','fc'].forEach(k => { if (r[k] != null) vals[k] = r[k]; });
  if (r.progress != null) vals.progress = r.progress;
  if (!p.lastUpdate || D(r.date) >= D(p.lastUpdate)) vals.rag = calcRag(r);
  return vals;
}
// застосувати погоджений звіт до картки — так само, як раніше при збереженні звіту
function applyReport(p, r, when){
  const complete = ['Завершено','Скасовано'].includes(r.status), vals = reportVals(p, r), newer = 'rag' in vals;
  const diffs = Object.keys(vals).filter(k => String(p[k] ?? '') !== String(vals[k] ?? '')).map(k => ({f:k, from:p[k] ?? '', to:vals[k]}));
  Object.assign(p, vals);
  if (r.cost != null) p.actual = r.cost;
  if (newer) Object.assign(p, {lastUpdate:r.date, lastReport:r.title});
  if (complete){ p.archivedAt = r.date; if (r.ae) p.ae = r.ae; }
  if (diffs.length) p.changes = (p.changes || []).concat([{id:uid(), date:when || new Date().toISOString(), who:r.author, kind:'report', reason: r.keyReason ? r.keyReason + ' · ' + r.title : r.title, diffs}]);
  return complete;
}
const DIMS = [['sched','rSched'],['budget','rBudget'],['res','rRes']];
// рішення PMO щодо звіту; повертає текст помилки або ''
function decideReport(p, r, decision, dims, note){
  if (!r || r.approval !== AP_PEND || !isPMO()) return '';
  const changed = DIMS.filter(([k]) => dims[k] && dims[k] !== r[k]);
  if ((changed.length || decision === AP_RET) && !note) return t('errApNote');
  const now = new Date();
  const diffs = changed.length ? changed.map(([k, l]) => ({f:l, from:r[k], to:dims[k]})) : [{f:'apStatus', from:AP_PEND, to:decision}];
  changed.forEach(([k]) => { r[k] = dims[k]; });
  r.rag = calcRag(r);
  Object.assign(r, {approval:decision, apBy:VIEWER, apAt:now.toISOString(), apNote:note});
  p.changes = (p.changes || []).concat([{id:uid(), date:now.toISOString(), who:VIEWER, kind:'approval', reason:note, diffs}]);
  if (decision === AP_OK) applyReport(p, r, new Date(now.getTime() + 1).toISOString());
  return '';
}

/* ================= Report view ================= */
function reportView(pid, rid, keep){
  const p = pById(pid); if (!p) return;
  const r = (p.reports || []).find(x => String(x.id) === String(rid)); if (!r) return projectPanel(pid, false);
  state.panel = {kind:'report', id:p.id, rid:String(r.id)};
  const d = D(r.date), pend = r.approval === AP_PEND, applied = isApproved(r);
  const IND = [['status','status'],['type','type'],['progress','progress'],['start','start'],['golive','golive'],['plan','plan'],['fc','fc'],['ae','ae'],['cost','rCost']];
  const show = (k, v) => v === '' || v == null ? '<span class="muted">—</span>' : k === 'progress' ? v + '%' : k === 'cost' ? money(+v)
    : ['start','golive','plan','fc','ae'].includes(k) ? fmt(D(v)) : esc(tv(v === 'Завершено' ? 'Архівний' : v));
  const cardK = k => k === 'cost' ? 'actual' : k;
  const ind = IND.filter(([k]) => r[k] != null && !(k === 'ae' && !r[k])).map(([k, l]) => {
    const cur = p[cardK(k)], nv = k === 'status' && ['Завершено','Скасовано'].includes(r[k]) ? 'Архівний' : r[k];
    const ch = !applied && String(cur ?? '') !== String(nv ?? '');
    return `<div class="kv"><span class="k">${fl(l)}</span><span class="v">${ch ? `<span class="dv"><s>${show(k, cur)}</s><span class="arr">→</span>${show(k, r[k])}</span>` : show(k, r[k])}</span></div>`;
  }).join('');
  const txt = (l, v) => v && v !== '—' ? `<p><span class="lbl">${l}:</span> ${esc(v)}</p>` : '';
  const decided = !pend && r.apBy ? `<div class="sec"><h3>${t('apDecided')}</h3><div class="apdone">
      <div class="rep-h">${apBadge(r.approval)}<span class="muted">${t('apBy')}:</span>${person(r.apBy, roleOf(r.apBy))}<span class="muted">${r.apAt ? fmtDT(D(r.apAt)) : ''}</span></div>
      ${r.apNote ? `<p><span class="muted">${fl('apNote')}:</span> ${esc(r.apNote)}</p>` : ''}</div></div>` : '';
  const apForm = pend && isPMO() ? `<div class="sec"><h3>${t('apTitle')}</h3><div class="apbox"><form id="apform" novalidate>
      <p class="note" style="margin:0 0 12px">${t('apHint')}</p>
      <div class="dims">${DIMS.map(([k, l]) => ragPick('ap-' + k, fl(l), true, r[k])).join('')}</div>
      <div class="ragcalc"><span class="k">${t('ragCalc')}</span><span id="ap-ragv">${ragLabel(calcRag(r))}</span></div>
      <div class="frow"><label class="t" for="ap-note">${fl('apNote')}</label><textarea id="ap-note"></textarea></div>
      <p class="err" hidden></p>
      <div class="actions"><button type="submit" class="btn primary" id="ap-ok">${t('approve')}</button><button type="button" class="btn" id="ap-ret">${t('returnRep')}</button></div>
    </form></div></div>` : '';
  openPanel(`<div class="ph"><div><div class="k">${esc(p.code)} · ${t('listLabel')} «${t('navReports')}»</div><h2>${esc(r.title)}</h2></div>${closeBtn()}</div>
    <div class="rv-meta"><button class="link" data-act="openp" data-id="${p.id}">${esc(p.title)}</button><span>${fl('rDate')}: <b>${fmt(d)}</b></span>${r.period ? `<span>${fl('rPeriod')}: <b>${esc(tv(r.period))}</b></span>` : ''}${apBadge(r.approval)}</div>
    ${apForm}
    <div class="sec"><div class="group">${kv('rag', ragHtml(r.rag))}${DIMS.map(([k, l]) => kv(l, ragHtml(r[k]))).join('')}</div></div>
    ${ind ? `<div class="sec"><h3>${t('repIndicators')}</h3><div class="group">${ind}${r.keyReason ? `<div class="kv"><span class="k">${t('keyReason')}</span><span class="v">${esc(r.keyReason)}</span></div>` : ''}</div></div>` : ''}
    <div class="sec"><div class="rep rv-text">
      <div class="rep-h">${person(r.author, fl('rAuthor'))}${r.decision ? `<span class="flag">${t('needDecision')}</span>` : ''}</div>
      ${txt(fl('rDone'), r.done)}${txt(fl('rNext'), r.next)}${txt(fl('rIssues'), r.issues)}${r.decision ? txt(fl('rDecText'), r.decisionText || '—') : ''}</div></div>
    ${decided}`, keep);
  const form = document.getElementById('apform');
  if (!form) return;
  const err = fErr(form), dimsNow = () => Object.fromEntries(DIMS.map(([k]) => [k, radioVal(form, 'ap-' + k)]));
  const sync = () => { const dm = dimsNow(), ch = DIMS.some(([k]) => dm[k] !== r[k]);
    form.querySelector('#ap-ok').textContent = ch ? t('approveChanged') : t('approve'); form.querySelector('#ap-ragv').innerHTML = ragLabel(calcRag(dm)); };
  form.addEventListener('change', sync);
  const decide = decision => {
    const msg = decideReport(p, r, decision, dimsNow(), form.querySelector('#ap-note').value.trim());
    if (msg){ form.querySelector('#ap-note').focus(); return err(msg); }
    rerenderMain(); reportView(p.id, r.id, true); persist(p); toast(t('savedApproval'));
  };
  form.addEventListener('submit', e => { e.preventDefault(); decide(AP_OK); });
  form.querySelector('#ap-ret').addEventListener('click', () => decide(AP_RET));
}

/* ================= Theme, toast, events ================= */
let THEME = null;
try { THEME = localStorage.getItem('pmo-theme'); } catch(e) {}
if (THEME !== 'light' && THEME !== 'dark') THEME = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
function applyTheme(){ document.documentElement.setAttribute('data-theme', THEME); }
applyTheme();
const toastEl = document.getElementById('toast'); let tt;
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 4200); }

document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  if (POP && !e.target.closest('#pop') && !e.target.closest('[data-act=tfilter],[data-act=tcols],#me')) closePop();
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act, id = el.dataset.id ? +el.dataset.id : null;
  // вкладка в шапке — всегда её вид по умолчанию и без фильтров колонок (#23, #24); показатели главной (goview) ставят свой вид
  if (a === 'nav'){ state.page = el.dataset.page; Object.assign(state, {pv:'all', rv:'all', kv:'open', av:'all'}); Object.keys(TS).forEach(k => { TS[k].filters = {}; }); TW = {}; closePop(); closePanel(); render(); window.scrollTo(0, 0); }
  else if (a === 'wreset'){ const k = el.dataset.key; if (TS[k]) { TS[k].w = {}; tSave(k); } closePop(); rerenderMain(); }
  else if (a === 'lang'){ LI = +el.dataset.i; render(); }
  else if (a === 'theme'){ THEME = el.dataset.t; try { localStorage.setItem('pmo-theme', THEME); } catch(e) {} applyTheme(); renderChrome(); }
  else if (a === 'goview'){ state.page = el.dataset.page; state[{projects:'pv', reports:'rv', risks:'kv', archive:'av'}[state.page]] = el.dataset.view; render(); window.scrollTo(0, 0); }
  else if (a === 'mode'){ state[el.dataset.key] = el.dataset.mode; rerenderMain(); }
  else if (a === 'openp') projectPanel(id, false);
  else if (a === 'comments') projectPanel(id, true);
  else if (a === 'togglecm') projectPanel(state.panel.id, !state.panel.showCm, true, state.panel.showCh);
  else if (a === 'togglech') projectPanel(state.panel.id, state.panel.showCm, true, !state.panel.showCh);
  else if (a === 'newrep') reportForm(id);
  else if (a === 'repopen') reportView(id, el.dataset.rid);
  else if (a === 'rmcell'){ state.rmCell = state.rmCell === el.dataset.k ? null : el.dataset.k; rerenderMain(); }
  else if (a === 'newfromret'){ const p = pById(id), r = p && (p.reports || []).find(x => String(x.id) === el.dataset.rid); reportForm(id, r); }
  else if (a === 'newrisk') riskForm(id, null);
  else if (a === 'riskopen') riskForm(id, el.dataset.rid, el.dataset.src === 'list');
  else if (a === 'newproj') projectForm(null);
  else if (a === 'editproj') projectForm(pById(id));
  else if (a === 'notif') notifPanel(false);
  else if (a === 'notifback') notifPanel(!!(NOTIF_RET && NOTIF_RET.onlyNew));
  // «Позначити все прочитаним» — «прочитано до» = сейчас (в приложении — номер последнего показанного события)
  else if (a === 'notifreadall') { NOTIF_READ[VIEWER] = new Date().toISOString(); notifPanel(!!el.dataset.new); renderChrome(); }
  else if (a === 'assign') assignForm(pById(id));
  else if (a === 'backp') { if (id) projectPanel(id, false); else closePanel(); }
  else if (a === 'close') closePanel();
  else if (a === 'seed'){ el.disabled = true; el.textContent = t('seeding'); seed().catch(err => { console.error(err); toast(t('saveErr')); }); }
  else if (a === 'reset') resetDemo();
  else if (a === 'tsort'){ const st = tState(el.dataset.key), c = el.dataset.col;
    st.sort = !st.sort || st.sort.id !== c ? {id:c, dir:'asc'} : st.sort.dir === 'asc' ? {id:c, dir:'desc'} : null; tSave(el.dataset.key); rerenderMain(); }
  else if (a === 'tfilter'){ if (POP && POP.kind === 'filter' && POP.col === el.dataset.col) closePop(); else openPop(el, 'filter', el.dataset.key, el.dataset.col); }
  else if (a === 'tcols'){ if (POP && POP.kind === 'cols') closePop(); else openPop(el, 'cols', el.dataset.key); }
  else if (a === 'fclear'){ const st = tState(el.dataset.key); delete st.filters[el.dataset.col]; tSave(el.dataset.key); rerenderMain(); if (POP && POP.kind === 'filter') renderPop(); }
  else if (a === 'cmove'){ const st = tState(POP.key), i = st.cols.indexOf(el.dataset.col), j = i + (+el.dataset.dir);
    if (i > 0 && j > 0 && j < st.cols.length){ [st.cols[i], st.cols[j]] = [st.cols[j], st.cols[i]]; tSave(POP.key); rerenderMain(); renderPop(); } }
  else if (a === 'creset'){ TS[POP.key] = {cols:TDEFAULTS[POP.key].slice(), sort:null, filters:{}}; tSave(POP.key); rerenderMain(); renderPop(); }
  else if (a === 'me'){ if (POP && POP.kind === 'user') closePop(); else openPop(el, 'user'); }
  else if (a === 'asuser'){ VIEWER = el.dataset.n; closePop(); render(); }
  else if (a === 'grp'){ el.classList.toggle('collapsed'); const h = el.classList.contains('collapsed'); document.querySelectorAll(`[data-gk="${el.dataset.g}"]`).forEach(r => r.hidden = h); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'view'){ state[e.target.dataset.key] = e.target.value; rerenderMain(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && POP){ closePop(); return; }
  if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
render();
initData();
})();
</script>
