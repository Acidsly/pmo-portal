const OVERVIEW_HTML = "<div class=\"cover\">\n  <div>\n    <div class=\"logo\">PPM<\/div>\n    <h1>PPM — Управління портфелем проєктів<\/h1>\n    <p class=\"lead\">Огляд системи: навіщо вона, з чого складається і як нею користуються PM, керівники та PMO.<\/p>\n    <img class=\"hero-img\" loading=\"lazy\" src=\"{{BASE}}/img/01-home.png\" alt=\"Головна сторінка порталу\">\n  <\/div>\n  <div class=\"foot\">Жовтень 2026 · застосунок 1.7 · тестове середовище <b>smarthrua.sharepoint.com/sites/pmo-test<\/b><br>\n  На скриншотах — тестові дані; ПІБ, фото, пошта й суми бюджетів приховані.<\/div>\n<\/div>\n<section>\n  <h2>Навіщо<\/h2>\n  <p>PPM (Project Portfolio Management, управління портфелем проєктів) — єдине місце, де компанія веде всі проєкти: хто відповідає, у якому вони стані, що змінилося і де потрібне рішення керівництва. Замість таблиць, листів і нарад «що там з проєктом» — одна картка проєкту й регулярний статус-звіт PM.<\/p>\n  <div class=\"cards\">\n    <div class=\"card\"><b>Один стан портфеля<\/b>Головна: ключові показники, звіти на погодженні (для PMO), проблемні проєкти й проєкти без свіжого звіту, запити на рішення, карта ризиків, зсуви термінів, найближчі запуски, портфель за напрямами.<\/div>\n    <div class=\"card\"><b>Зміни — лише через погоджений звіт<\/b>Фаза, стан, % виконання, дати й витрати змінюються тільки статус-звітом PM, який погодив PMO; причина обов'язкова, усе потрапляє в історію. Зміну ключового поля в обхід звіту система повертає назад і записує в історію.<\/div>\n    <div class=\"card\"><b>Прозорість для керівництва<\/b>Керівник бачить проєкти своїх підлеглих автоматично — за оргструктурою Microsoft 365, без ручного налаштування доступу.<\/div>\n    <div class=\"card\"><b>Контроль ризиків<\/b>Оцінка «ймовірність × вплив», стратегія реагування, заходи й план дій у разі настання, власник і термін.<\/div>\n    <div class=\"card\"><b>Запити на рішення<\/b>PM позначає у звіті «Потрібне рішення керівництва» — запит одразу видно на головній і в окремому поданні.<\/div>\n    <div class=\"card\"><b>Сповіщення<\/b>Дзвіночок угорі показує, скільки нових подій у ваших проєктах: звіти, погодження, ризики, коментарі, додавання до команди; PMO — подання звітів і переходи в архів; автору — розгляд його відгуку; усім — новий випуск порталу. Відкрита подія стає прочитаною.<\/div>\n    <div class=\"card\"><b>Там, де всі працюють<\/b>У браузері на комп'ютері, на телефоні й планшеті, згодом — у Microsoft Teams. Три мови: українська, англійська, російська.<\/div>\n  <\/div>\n  <h2 style=\"margin-top:14pt\">Хто що бачить і що може<\/h2>\n  <table>\n    <tr><th style=\"width:26%\">Роль<\/th><th style=\"width:34%\">Бачить<\/th><th>Може<\/th><\/tr>\n    <tr><td><b>PM проєкту<\/b><\/td><td>свій проєкт<\/td><td>редагувати картку (команда, посилання), здавати статус-звіти, вести ризики, коментувати<\/td><\/tr>\n    <tr><td><b>Керівники PM<\/b> (за оргструктурою)<\/td><td>проєкти підлеглих<\/td><td>переглядати й коментувати<\/td><\/tr>\n    <tr><td><b>Власник, команда проєкту<\/b> та їхні керівники<\/td><td>проєкти, де роль мають вони або їхні підлеглі<\/td><td>переглядати й коментувати<\/td><\/tr>\n    <tr><td><b>PMO<\/b><\/td><td>усі проєкти<\/td><td>створювати нові проєкти й призначати PM; <b>погоджувати або повертати статус-звіти<\/b> (змінює лише оцінки, з коментарем); решту — переглядати й коментувати<\/td><\/tr>\n    <tr><td><b>Інші співробітники<\/b><\/td><td>порожній портал<\/td><td>—<\/td><\/tr>\n  <\/table>\n  <p class=\"small muted\">Завершений або скасований проєкт переходить в архів: лише перегляд для всіх, без нових коментарів. Керівника бачать за полем «Керівник» у Microsoft 365: CEO бачить усе, бо CIO — його підлеглий; фінансовий директор — лише проєкти, де роль має він або його підлеглі.<\/p>\n<\/section>\n<section>\n  <h2>З чого складається<\/h2>\n  <p>Система побудована повністю на Microsoft 365 компанії: дані зберігаються в SharePoint, доступ і оргструктура — з Microsoft Entra ID. Зовнішніх сервісів і баз немає.<\/p>\n  <div class=\"arch\">\n    <div class=\"box alt\"><h4>Користувачі<\/h4><ul><li>браузер на комп'ютері<\/li><li>телефон і планшет (iOS, Android)<\/li><li>Microsoft Teams — наступний етап<\/li><\/ul><\/div>\n    <div class=\"box\"><h4>Застосунок порталу<\/h4><ul><li>головна сторінка сайту SharePoint на весь екран<\/li><li>головна, проєкти, статус-звіти, ризики, архів, картка й форми<\/li><li>працює від імені користувача — показує лише дозволене<\/li><\/ul><\/div>\n    <div class=\"box\"><h4>Списки SharePoint<\/h4><ul><li>Проєкти, Команда проєкту<\/li><li>Статус-звіти, Погодження звітів<\/li><li>Ризики та проблеми<\/li><li>Коментарі<\/li><li>Зміни показників (журнал)<\/li><li>Прочитане (сповіщення)<\/li><li>Еталон показників (службовий)<\/li><\/ul><\/div>\n  <\/div>\n  <div class=\"flow\">Користувач ⟶ застосунок ⟶ списки SharePoint ⟵ синхронізація за розкладом ⟵ оргструктура Microsoft Entra ID<\/div>\n  <table>\n    <tr><th style=\"width:26%\">Компонент<\/th><th>Що робить<\/th><\/tr>\n    <tr><td><b>Застосунок (SharePoint Framework)<\/b><\/td><td>Інтерфейс порталу: сторінки, картка проєкту, форми статус-звіту, ризику, проєкту й коментаря. Перед кожним збереженням перевіряє свіжі дані (змінився PM, проєкт в архіві, уже є звіт на погодженні, запис змінив інший користувач) і пояснює, чому збереження не відбулося. Збережене видно одразу; відкрита сторінка сама оновлює дані при поверненні на вкладку і кожні 5 хвилин.<\/td><\/tr>\n    <tr><td><b>Списки SharePoint<\/b><\/td><td>Усі дані порталу. Звичайні списки лишаються для адміністраторів, вивантаження в Excel і Power BI.<\/td><\/tr>\n    <tr><td><b>Синхронізація<\/b><\/td><td>Кожні 15 хвилин: застосовує лише звіти, погоджені рішенням PMO, і переносить їх у картку; повертає звіти на погодженні при зміні PM або переході в архів; повертає ключові поля, змінені в обхід звіту; веде журнал змін, відправляє завершені й скасовані проєкти в архів, видає права за оргструктурою, оновлює «Доступ до картки». Раз на тиждень — повний перерахунок прав. Працює в Azure Automation (з 04.10.2026); також веде рядки «Прочитане» для сповіщень.<\/td><\/tr>\n    <tr><td><b>Microsoft Entra ID<\/b><\/td><td>Облікові записи, керівники, посади — джерело прав за ієрархією.<\/td><\/tr>\n    <tr><td><b>Відгуки<\/b> (лише тест)<\/td><td>Сторінка «Відгуки» з кнопкою «Залишити відгук» (текст, скриншоти, пристрій): усі бачать усі зауваження, статус розгляду й відповідь розробників.<\/td><\/tr>\n  <\/table>\n  <h3>Ключові правила<\/h3>\n  <ul>\n    <li><b>Загальний стан звіту<\/b> — найгірша з трьох оцінок (терміни, бюджет, ресурси): хоча б одна червона → червоний; хоча б одна жовта → жовтий; усі зелені → зелений. Стан проєкту — за останнім звітом.<\/li>\n    <li><b>Ключові показники<\/b> (фаза, стан, тип, %, дати, витрати) змінюються лише статус-звітом; зміна фази, типу чи дат вимагає причини.<\/li>\n    <li><b>Погодження PMO:<\/b> у картку потрапляє лише звіт, погоджений рішенням PMO; по проєкту — лише один звіт на погодженні; при зміні PM або переході в архів звіт на погодженні повертається автоматично з коментарем. PMO може змінити лише оцінки або повернути звіт — в обох випадках з коментарем.<\/li>\n    <li><b>«Завершено» або «Скасовано»<\/b> у погодженому звіті → проєкт у «Архів», лише перегляд; що проєкт скасовано, видно у звіті.<\/li>\n    <li><b>Оцінка ризику<\/b> = ймовірність × вплив (1–25): 15–25 високий, 8–14 середній, 1–7 низький.<\/li>\n    <li><b>Свіжість звіту:<\/b> до 8 днів — зелений, 9–14 — жовтий, понад 14 — червоний (підказка — при наведенні на крапку).<\/li>\n    <li><b>Історія:<\/b> кожна зміна — «було → стало», хто, коли і чому.<\/li>\n    <li><b>Введення:<\/b> суми — у доларах США ($) без перерахунку; дати — дд.мм.рррр (крапки ставляться самі) або календар; дата подання звіту — день збереження, період — з останнього погодженого звіту; % виконання — від 0 до 100; назва проєкту — унікальна.<\/li>\n  <\/ul>\n<\/section>\n<section>\n  <h2>Головна<\/h2>\n  <p>Стан портфеля за видимими користувачу проєктами (без архіву). Угорі — <b>смуга показників<\/b>: активні проєкти, частка зі свіжим звітом, звіти на погодженні (для PMO), високі ризики, прострочені проєкти; кожен показник відкриває відфільтрований список. Для PMO показник «Очікують погодження» відкриває «Статус-звіти → Відображати: Очікують погодження» — чергу звітів.<\/p>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/01-home.png\" alt=\"\"><figcaption>Показники, портфель за станом і динаміка за погодженими звітами: кожен проєкт від дати створення, сірий — ще без погодженого звіту, число — в кожній частині; стовпець «сьогодні» збігається з кільцем.<\/figcaption><\/figure>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/02-home-analytics.png\" alt=\"\"><figcaption>Карта ризиків 5 × 5 (клік по клітинці — її ризики), портфель за напрямами (у кожному кольорі — число проєктів), три найбільші зсуви термінів, запуски в найближчі 7 днів; блоки однакової висоти.<\/figcaption><\/figure>\n  <p>Нижче — таблиці: <b>«Проблемні проєкти»<\/b> (жовті й червоні: стан, PM, останній звіт і його дата), <b>«Немає свіжого статус-звіту»<\/b> (звіту немає або він старший за 14 днів), <b>«Потребують рішення керівництва»<\/b> (звіти з позначкою: проєкт, дата, яке рішення потрібне, автор) і <b>«Відкриті ризики»<\/b> (шість найвищих). Під датою звіту — погодження найновішого звіту: «Погоджено», «На погодженні · дата» або «Повернуто · дата». «Показати все» відкриває повний список.<\/p>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/01b-home-blocks.png\" alt=\"\"><figcaption>Нижня частина головної: проблемні проєкти, проєкти без свіжого звіту (зокрема ті, де звіт ще на погодженні), запити на рішення керівництва й відкриті ризики.<\/figcaption><\/figure>\n<\/section>\n<section>\n  <h2>Проєкти<\/h2>\n  <p>Плитки для швидкого огляду або таблиця з сортуванням, фільтрами за значеннями й вибором колонок. «Відображати»: Усі проєкти, Стратегічні, Проблемні, Мої проєкти (усі), Я PM, Немає свіжого звіту, Прострочені. Ширину колонок можна змінити, перетягнувши межу заголовка, — вона запам'ятовується; довгий список прокручується у своєму вікні: заголовки колонок закріплені, горизонтальна смуга прокрутки завжди внизу видимої частини; на телефоні статус-звіти й ризики показуються картками; суми — з пробілами між розрядами. Нові записи — угорі. Колонка «Звіт» — дата останнього погодженого звіту з кольоровою крапкою свіжості (підказка при наведенні), під нею — погодження найновішого звіту (дата — окремим рядком; підказка «Подано … · автор»); фільтр колонки — за свіжістю й за погодженням («На погодженні», «Повернуто», «Звіти не подавались»). Колонка «Фаза проєкту» — етап життєвого циклу. Меню — значки розділів кольором розділу; у кожному бічному вікні — кольорова мітка, що відкрито (Проєкт, Статус-звіт, Ризик, Проблема, Призначення, Сповіщення, Відгук, Довідка). Фільтри й «Відображати» скидаються при переході на іншу вкладку; ширина колонок на комп'ютері від фільтрів не змінюється.<\/p>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/03-projects-tiles.png\" alt=\"\"><figcaption>Плитки: номер (PRJ-### — присвоюється автоматично, унікальний), стан, фаза (кольорова мітка) і % виконання, останній апдейт зі світлофором свіжості, PM.<\/figcaption><\/figure>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/04-projects-list.png\" alt=\"\"><figcaption>Таблиця: фаза — кольорова мітка, стан — кружечок, «Звіт» — дата, крапка свіжості й мітка погодження; воронка — фільтр, шестерня — колонки, клік по заголовку — сортування.<\/figcaption><\/figure>\n<\/section>\n<section>\n  <h2>Картка проєкту<\/h2>\n  <p>Усе про проєкт в одній панелі: посилання (Loop, документи), учасники й <b>команда проєкту<\/b> — хто, яка роль, з яких питань звертатися; терміни з відхиленням прогнозу, бюджет і виконання, історія змін, коментарі, історія станів, статус-звіти (три останні, «Показати всі звіти (N)» — усі), ризики та «Доступ до картки». «Мета та опис» — до 10 рядків, далі «Показати повністю». Посиланням на картку можна поділитися; посилання з картки відкриваються в новій вкладці. Суми — у доларах США. Поки звіт на погодженні, нового звіту подати не можна: «Звіт від … на погодженні PMO — новий можна подати після рішення». Новий проєкт кілька хвилин «готується», а новопризначений PM бачить «права редагування з'являться протягом 15 хвилин».<\/p>\n  <div class=\"two grid4\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/08-card-top.png\" alt=\"\"><figcaption>Шапка картки, поки звіт на погодженні: позначка «на погодженні PMO», кнопки нового звіту немає; тип, стан, фаза, пріоритет, посилання, учасники.<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/09-card-history.png\" alt=\"\"><figcaption>Бюджет і виконання та історія змін: хто, коли, що змінив і причина.<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/10-card-reports.png\" alt=\"\"><figcaption>Історія станів за останніми звітами та статус-звіти: три останні, далі «Показати всі звіти (N)».<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/11-card-access.png\" alt=\"\"><figcaption>«Доступ до картки»: PM — редагування, керівники, власник і команда — перегляд і коментарі.<\/figcaption><\/figure>\n  <\/div>\n<\/section>\n<section>\n  <h2>Сповіщення<\/h2>\n  <p>Дзвіночок угорі показує <b>число нових подій<\/b> ваших проєктів і похитується, поки вони є. Що бачить кожен — за роллю: PM, власник і команда — створення, «Призначення», рішення PMO щодо звітів, оновлення показників, коментарі; ризики — PM і власник ризику завжди, власник і команда — лише високі; PMO — подання звітів на погодження, переходи проєктів в архів, нові високі ризики (від 15) і всі проблеми, а також зміна їх статусу. Окремо — лише для вас: «Вас додано до команди» / «Змінено вашу роль у команді» (з вашою роллю), «Відгук розглянуто» (новий статус чи відповідь на ваш відгук); усім — «Новий випуск порталу» з переходом до «Що змінилося». Свої дії не показуються, керівники PM сповіщень не отримують. Відкрита подія стає прочитаною (угорі — «← Сповіщення», повернення до списку), «Позначити все прочитаним» — усі одразу. Листи й стрічка активності Microsoft Teams — наступний етап.<\/p>\n  <figure class=\"half\"><img loading=\"lazy\" src=\"{{BASE}}/img/24-notifications.png\" alt=\"\"><figcaption>«Сповіщення»: нові події вгорі (блакитні, «Нове»), «Нових: N», «Лише нові» й «Позначити все прочитаним».<\/figcaption><\/figure>\n<\/section>\n<section>\n  <h2>Статус-звіт<\/h2>\n  <p>PM оцінює терміни, бюджет і ресурси — загальний стан рахується сам. Ключові показники вже заповнені поточними значеннями; змінюється лише те, що змінилося. <b>Дата подання<\/b> — день збереження (не вводиться), <b>період<\/b> рахується сам — з останнього погодженого звіту по дату подання («з … по …»). Фаза й тип записуються в кожен звіт. Якщо змінено фазу, тип або дату, з'являється обов'язкова «Причина зміни показників». Дати — дд.мм.рррр або календар; дати запуску й завершення не раніше дати старту; фактичне завершення — не раніше старту й не пізніше дати подання (портал одразу пояснює, з якою датою порівняв); при «Потрібне рішення керівництва» опис рішення обов'язковий; «Проблеми та ризики за період» — коротко, що заважало (реєстр ризиків і проблем — окремо, у картці); % — ціле число від 0 до 100 (для «Завершено» — 100 автоматично); витрати — у $. Якщо щось не заповнено, портал підсвічує всі такі поля одразу. Із картки звіт подається саме для цього проєкту; проєкти, де звіт уже на погодженні, у загальній формі недоступні.<\/p>\n  <div class=\"two\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/12-report-form.png\" alt=\"\"><figcaption>Оцінки й розрахунок загального стану.<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/13-report-keys.png\" alt=\"\"><figcaption>Ключові показники: змінено дату — потрібна причина.<\/figcaption><\/figure>\n  <\/div>\n  <h3>Що відбувається після збереження<\/h3>\n  <ol>\n    <li><b>Одразу:<\/b> звіт іде <b>на погодження PMO<\/b>; у картці — позначка «Статус-звіт … на погодженні PMO»; картка поки не змінюється, а новий звіт по проєкту не подається, доки PMO не вирішить. Надісланий звіт змінити не можна.<\/li>\n    <li><b>PMO погоджує<\/b> — картка одразу показує новий стан, % виконання, дати й «Останній апдейт»; <b>протягом 15 хвилин<\/b> синхронізація записує в журнал кожну зміну: було → стало, автор, причина.<\/li>\n    <li><b>PMO повертає<\/b> — картка не змінюється, PM бачить коментар і здає новий звіт кнопкою «Новий звіт на основі повернутого».<\/li>\n    <li><b>Запит на рішення<\/b> (позначка «Потрібне рішення керівництва») — одразу в блоці на головній і в поданні «Потребують рішення».<\/li>\n    <li><b>«Завершено» або «Скасовано»<\/b> — після погодження проєкт отримує цю фазу і дату завершення / скасування, переходить в «Архів»; лише перегляд, без коментарів.<\/li>\n    <li><b>Змінився PM або проєкт пішов в архів<\/b> до рішення PMO — звіт повертається автоматично з коментарем.<\/li>\n  <\/ol>\n  <div class=\"note\">Звіт може здати лише чинний PM проєкту — портал перевіряє це перед збереженням, а синхронізація не застосує звіт іншої людини. Звіт, автор якого вже не PM, PMO може лише повернути.<\/div>\n<\/section>\n<section>\n  <h2>Погодження статус-звітів<\/h2>\n  <p>Кожен статус-звіт погоджує PMO. Звіти, що чекають, — у показнику «Очікують погодження» на головній і у «Статус-звіти» → «Відображати: Очікують погодження».<\/p>\n  <div class=\"two\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/21-report-approval.png\" alt=\"\"><figcaption>Звіт на погодженні: PMO змінив оцінку бюджету — кнопка стала «Погодити зі зміною оцінок», коментар обов'язковий.<\/figcaption><\/figure>\n    <div><h3 style=\"margin-top:0\">Що може PMO<\/h3>\n      <ul>\n        <li><b>Погодити<\/b> — звіт потрапляє в картку з оцінками PM.<\/li>\n        <li><b>Погодити зі зміною оцінок<\/b> — змінити терміни, бюджет чи ресурси; у картку потрапляє оцінка PMO. Коментар обов'язковий.<\/li>\n        <li><b>Повернути на доопрацювання<\/b> — картка не змінюється, PM бачить коментар. Коментар обов'язковий.<\/li>\n      <\/ul>\n      <p>PMO змінює лише оцінки — тексти, дати й фаза звіту лишаються як у PM. Рішення PMO — окремий запис, тож це забезпечують права SharePoint, а не лише інтерфейс. Рішення потрапляє в історію змін проєкту: «Погодження звіту», було → стало, коментар.<\/p>\n      <p>Вирішений звіт повторно не погоджується; помилку виправляє наступний звіт PM. Якщо звіт уже вирішив інший PMO — рішення не збережеться, з'явиться пояснення.<\/p><\/div>\n  <\/div>\n  <h3>Як змінити фазу проєкту<\/h3>\n  <ol>\n    <li>PM у картці — «Додати статус-звіт» (якщо немає звіту на погодженні) → «Ключові показники» → нову «Фазу проєкту».<\/li>\n    <li>Заповнює «Причина зміни показників», оцінки й резюме → «Зберегти». Звіт іде на погодження.<\/li>\n    <li>PMO погоджує — фаза в картці змінюється, в історії з'являються «Погодження звіту» і «Оновлено статус-звітом».<\/li>\n    <li>«Завершено — перенести в архів» або «Скасовано — перенести в архів» — після погодження проєкт отримує фазу «Завершено» або «Скасовано», дату завершення / скасування і переходить в «Архів».<\/li>\n  <\/ol>\n  <p class=\"small muted\">Окремої кнопки «Змінити фазу» немає свідомо: будь-яка зміна фази має причину, погодження і слід в історії.<\/p>\n<\/section>\n<section>\n  <h2>Помічник ШІ (пілот)<\/h2>\n  <p>Учасники пілоту мають у формі статус-звіту помічника ШІ на основі <b>Microsoft Copilot Studio<\/b> (модель GPT-5 chat, середовище в Європі). Він економить час на підготовці звіту й ловить неузгодженості до того, як звіт побачить PMO. Помічник лише підказує: звіт, оцінки й рішення лишаються за PM і PMO.<\/p>\n  <div class=\"two\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/26-ai-switch.png\" alt=\"\"><figcaption>Перемикач «Помічник ШІ» в меню аватара: першого разу — згода на обробку даних, далі — без питань. Вимкнено — форма без ШІ.<\/figcaption><\/figure>\n    <div><h3 style=\"margin-top:0\">Що робить<\/h3>\n      <ul>\n        <li><b>«Заповнити з ШІ»<\/b> — чернетка резюме, «Зроблено», «План», «Проблеми та ризики» за даними проєкту: минулим планом, змінами показників, реєстром ризиків. Порожні поля заповнюються одразу, заповнені — лише з дозволу PM; вставку можна скасувати.<\/li>\n        <li><b>«Що не забути»<\/b> — пункти минулого плану без результату, прострочені заходи, високі ризики, запит рішення; <b>пропоновані оцінки<\/b> з причиною — оцінка змінюється лише кнопкою «Прийняти».<\/li>\n        <li><b>«Перевірити з ШІ»<\/b> замість «Зберегти» — суперечності між звітом і даними проєкту; кожен пункт називає поле, яке виправити.<\/li>\n      <\/ul><\/div>\n  <\/div>\n  <h3>Перевірка: портал рахує, ШІ читає зміст<\/h3>\n  <p>Дати, суми й відсотки <b>порівнює сам портал<\/b> — без помилок і без витрат на ШІ: зелені «Терміни» при прогнозі пізніше плану чи прострочених заходах, зелений «Бюджет» при витратах понад бюджет, «Потрібне рішення» без опису, зменшений % виконання. <b>ШІ перевіряє зміст<\/b>: чи згадані з діями високі ризики й проблеми, чи відображено пункти минулого плану й запит рішення, чи не суперечить резюме оцінкам, чи пояснено зміну фази й дат, чи враховано коментар PMO до повернутого звіту. Під пунктом про запис реєстру — «Показати запис» і «Додати згадку» (рядок із заходами з реєстру).<\/p>\n  <div class=\"two\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/27-ai-draft.png\" alt=\"\"><figcaption>Чернетку вставлено: підказки «Що не забути» й пропоновані оцінки з кнопкою «Прийняти».<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/28-ai-check.png\" alt=\"\"><figcaption>«Суперечності (аналіз ШІ)»: пункт порталу й пункт ШІ, картка запису реєстру; після перевірки — «Зберегти».<\/figcaption><\/figure>\n  <\/div>\n  <ul>\n    <li>Результат перевірки зберігається у звіті — PMO бачить його під час погодження («Перевірено ШІ: дата»); на рішення він не впливає. Погоджуватися з ШІ не обов'язково.<\/li>\n    <li>ШІ не відповів — «Зберегти без перевірки»: здача звіту від ШІ не залежить, PMO бачить причину; на тестовому сайті збій сам записується у «Відгуки» з технічними даними.<\/li>\n    <li>Якість відповідей перевіряє набір із 39 випадків після кожної зміни інструкцій ШІ (зокрема спроби підмінити інструкції через текст звіту); поріг — 14 з 15 на кожну дію.<\/li>\n  <\/ul>\n<\/section>\n<section>\n  <h2>Ризики та проблеми<\/h2>\n  <p>Реєстр ризиків і проблем усіх видимих проєктів з оцінкою, <b>стратегією реагування<\/b> (Уникнення, Зниження (пом'якшення), Передача, Прийняття), власником, статусом і терміном (для нового запису — не раніше сьогодні, при зміні — не раніше дати реєстрації; прострочений позначається «Термін минув»). У ризику — «Заходи для зниження ризику» і «План дій у разі настання»: разом зі стратегією вони <b>обов'язкові<\/b> за будь-якої оцінки (у проблеми — опис і заходи). Збережений запис змінюється лише статусом, щоб історія реєстру лишалась точною; нова версія — <b>«Копіювати ризик»<\/b> (новий запис з усіма полями, вихідний закривається). Ризики не погоджуються: PMO бачить нові високі ризики й проблеми в сповіщеннях, зворотний зв'язок — коментарем у картці. Форма ризику рахує оцінку одразу й пояснює кожен бал шкали. Ризики проєктів в архіві — «Відображати: Ризики архівних проєктів» (лише перегляд).<\/p>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/06-risks.png\" alt=\"\"><figcaption>«Відображати: Високі ризики» — відкриті з оцінкою від 15; колонка «Стратегія реагування»; статус — кольорова мітка (Відкрито, В роботі, Закрито).<\/figcaption><\/figure>\n  <div class=\"two\"><figure><img loading=\"lazy\" src=\"{{BASE}}/img/14-risk-form.png\" alt=\"\"><figcaption>Новий ризик: оцінка 3 × 3 = 9 «Середній», стратегія реагування, заходи для зниження ризику і план дій у разі настання.<\/figcaption><\/figure>\n  <div><h3 style=\"margin-top:0\">Як рахується оцінка<\/h3><p>Ймовірність і вплив — від 1 до 5, кожен бал має опис (наприклад, 4 — «ймовірно, 60–90%», 5 — «критичний: зрив цілей проєкту»).<\/p><p><b>Оцінка = ймовірність × вплив.<\/b> 15–25 — високий (червоний), 8–14 — середній (жовтий), 1–7 — низький (зелений).<\/p><p>Прострочений термін відкритого ризику виділяється червоним; закриті ризики зникають з подання «Відкриті».<\/p><\/div><\/div>\n<\/section>\n<section>\n  <h2>Статус-звіти й архів<\/h2>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/05-reports.png\" alt=\"\"><figcaption>Черга PMO — «Відображати: Очікують погодження»: оцінки, резюме (відкриває звіт), автор, погодження, «Потрібне рішення». Інші подання — «Усі звіти», «Потребують рішення».<\/figcaption><\/figure>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/07-archive.png\" alt=\"\"><figcaption>Архів: проєкти з фазою «Завершено» або «Скасовано» і датою завершення / скасування, «Відображати: Завершені / Скасовані», лише перегляд, без коментарів; ризики — у «Ризики архівних проєктів»; навігація як у «Проєкти» — список або плитки, «Відображати», CSV.<\/figcaption><\/figure>\n<\/section>\n<section>\n  <h2>Команда, посилання, довідка і відгуки<\/h2>\n  <div class=\"two\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/15-project-form.png\" alt=\"\"><figcaption>Форма проєкту: команда (учасник, роль — обов'язково, з яких питань звертатися) і посилання (назва, адреса https://). Новий проєкт створює PMO.<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/16-help.png\" alt=\"\"><figcaption>«Довідка» — інструкція в самому порталі, кнопка «?», три мови; угорі — версія порталу й «Що змінилося» (нове в кожному випуску, номери реалізованих відгуків); наприкінці — «Детальний огляд системи» (цей документ) і «Завантажити PDF».<\/figcaption><\/figure>\n  <\/div>\n  <div class=\"two\"><figure><img loading=\"lazy\" src=\"{{BASE}}/img/17-feedback.png\" alt=\"\"><figcaption>«Залишити відгук»: зауваження зі скриншотами (вставка з буфера або з галереї телефона); пристрій додається сам.<\/figcaption><\/figure>\n  <div><h3 style=\"margin-top:0\">Зворотний зв'язок під час тестування<\/h3><p>Учасник відкриває вкладку «Відгуки» → «Залишити відгук» і пише, на якому екрані помітив проблему. До 5 скриншотів; на комп'ютері — вставка з буфера (Ctrl+V / Cmd+V). Зауваження, що прийшли листом, розробники заносять туди ж.<\/p><p>Сторінка <b>«Відгуки»<\/b> — зв'язок розробників рішення з учасниками: усі бачать усі зауваження, автора, статус розгляду (Новий, Прийнято, Зроблено, Прокоментовано, Відхилено) і відповідь. Скриншоти бачать лише автор і розробники; статус і відповідь ставлять розробники.<\/p><\/div><\/div>\n  <div class=\"two\"><figure><img loading=\"lazy\" src=\"{{BASE}}/img/25-releases.png\" alt=\"\"><figcaption>«Що змінилося»: поточний випуск — нове, змінене й що перевірити повторно; номер відгуку — посилання на нього; нижче — попередні випуски.<\/figcaption><\/figure>\n  <div><h3 style=\"margin-top:0\">Версія й випуски<\/h3><p>Угорі «Довідки» видно номер версії порталу й дату випуску. Кожен випуск має опис у «Що змінилося», а дзвіночок 14 днів повідомляє всім про новий випуск. Автор відгуку отримує сповіщення «Відгук розглянуто», щойно змінюються статус або відповідь.<\/p><\/div><\/div>\n  <figure><img loading=\"lazy\" src=\"{{BASE}}/img/23-feedback-page.png\" alt=\"\"><figcaption>Сторінка «Відгуки»: № (у вікні відгуку — стрілки ‹ › до попереднього й наступного), дата, автор, зауваження, статус розгляду, відповідь, кількість скриншотів, екран.<\/figcaption><\/figure>\n<\/section>\n<section>\n  <h2>Телефон і планшет<\/h2>\n  <p>Портал відкривається в браузері телефона й планшета без окремого застосунку: сторінки підлаштовуються під ширину, картка й форми — на весь екран, кнопка «Зберегти» завжди видна; меню — лише значки, кнопки дій — по центру й однакової ширини.<\/p>\n  <div class=\"phones\">\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/18-phone-home.png\" alt=\"\"><figcaption>Головна.<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/19-phone-card.png\" alt=\"\"><figcaption>Картка проєкту.<\/figcaption><\/figure>\n    <figure><img loading=\"lazy\" src=\"{{BASE}}/img/20-phone-report.png\" alt=\"\"><figcaption>Статус-звіт.<\/figcaption><\/figure>\n  <\/div>\n  <h2 style=\"margin-top:16pt\">Безпека та дані<\/h2>\n  <ul>\n    <li>Дані — лише в SharePoint Online компанії; зовнішніх баз немає. Єдиний зовнішній сервіс — <b>помічник ШІ<\/b> (пілот): Microsoft Copilot Studio в тенанті компанії (Європа; модель може обробляти дані за її межами), доступ — лише групі пілоту; у ШІ йдуть дані тільки проєкту форми — без e-mail і команди, текст очищено від службових позначок; згода — при ввімкненні.<\/li>\n    <li>Застосунок працює від імені користувача: кожен бачить лише те, до чого має доступ.<\/li>\n    <li>Права на кожен проєкт і його записи (папки проєктів) видає синхронізація за оргструктурою; змінювати може лише PM; записати щось у чужий проєкт неможливо; ключові поля захищені еталоном; архів — лише перегляд.<\/li>\n    <li>Синхронізація має доступ тільки до сайту порталу (Sites.Selected) і лише читає оргструктуру з Microsoft Entra ID (User.Read.All). В Azure Automation — керована ідентичність, без паролів і сертифікатів у скриптах.<\/li>\n  <\/ul>\n<\/section>\n<section>\n  <h2>Стан і наступні кроки<\/h2>\n  <table>\n    <tr><th style=\"width:40%\">Етап<\/th><th>Стан<\/th><\/tr>\n    <tr><td>Списки, права, синхронізація<\/td><td>готово, тестовий сайт<\/td><\/tr>\n    <tr><td>Застосунок: головна, проєкти, картка, форми, телефон<\/td><td>готово, тестовий сайт<\/td><\/tr>\n    <tr><td>Раунд 2 і відгуки фокус-групи: погодження звітів, команда й посилання, стратегія ризику, аналітика, «Відгуки», захист від одночасних змін, долари, поле дати<\/td><td>готово, тестовий сайт<\/td><\/tr>\n    <tr><td>Раунди 3–4: форма звіту й ризику, «Призначення» PM / власника, сповіщення в порталі, архів за фазами, дата подання й період, фільтр за погодженням, новий вигляд меню й вікон<\/td><td>готово, тестовий сайт (1.7.2.1)<\/td><\/tr>\n    <tr><td>Раунд 5: сповіщення про команду, розгляд відгуку й новий випуск, «Що змінилося» й версія, закріплені заголовки таблиць, строки ризиків, три останні звіти в картці<\/td><td>готово, тестовий сайт (1.7.2.10)<\/td><\/tr>\n    <tr><td>Рішення PMO щодо ризиків: обов'язкові стратегія, заходи й план дій, лише статус у збереженому записі, «Копіювати ризик», сповіщення PMO про високі ризики й проблеми<\/td><td>готово, тестовий сайт (1.7.3.0)<\/td><\/tr>\n    <tr><td>Помічник ШІ у статус-звіті: «Заповнити з ШІ», «Перевірити з ШІ» (портал порівнює числа, ШІ — зміст), перемикач і згода, автоматичні відгуки про збої<\/td><td>пілот, тестовий сайт (1.7.4.0)<\/td><\/tr>\n    <tr><td>Тестування з фокус-групою (PM, PMO)<\/td><td>триває<\/td><\/tr>\n    <tr><td>Синхронізація в хмарі (Azure Automation)<\/td><td>працює (Germany West Central) з 04.10.2026<\/td><\/tr>\n    <tr><td>Сповіщення листом і в стрічці активності Microsoft Teams<\/td><td>наступний етап<\/td><\/tr>\n    <tr><td>Робочий сайт, Microsoft Teams, запуск на всю компанію<\/td><td>після тестування з фокус-групою<\/td><\/tr>\n    <tr><td>Помічник ШІ на робочому сайті: журнал викликів ШІ (збої, тривалість, облік кредитів)<\/td><td>після пілоту<\/td><\/tr>\n  <\/table>\n  <h2 style=\"margin-top:14pt\">Документи<\/h2>\n  <table>\n    <tr><th style=\"width:40%\">Документ<\/th><th>Для кого<\/th><\/tr>\n    <tr><td>Інструкція користувача (UA / EN / RU) — також «Довідка» в порталі<\/td><td>усі користувачі<\/td><\/tr>\n    <tr><td>Цей огляд — у порталі («Довідка» → «Детальний огляд системи») і PDF<\/td><td>усі користувачі, керівництво<\/td><\/tr>\n    <tr><td>Плани тестування — PM і PMO, пілот помічника ШІ<\/td><td>учасники фокус-групи<\/td><\/tr>\n    <tr><td>Технічне завдання<\/td><td>PMO, ІТ<\/td><\/tr>\n    <tr><td>Розгортання й адміністрування<\/td><td>ІТ, адміністратори SharePoint<\/td><\/tr>\n    <tr><td>Архітектура рішення й модель даних<\/td><td>ІТ, розробники<\/td><\/tr>\n  <\/table>\n  <p class=\"small muted\">Усі документи ведуться в репозиторії проєкту разом із кодом, тож оновлюються разом зі змінами системи.<\/p>\n<\/section>";

function dynamics(){
  const pts = [];
  for (let k = 6; k >= 0; k--){
    const tt = daysAgo(k * 14), c = {'Зелений':0,'Жовтий':0,'Червоний':0,'':0};
    // кожен проєкт, що вже існував на дату зрізу (і ще не в архіві): стан останнього погодженого звіту; немає звіту — сірий
    visAll().forEach(p => {
      const cr = (p.changes || []).find(x => x.kind === 'create'); if (cr && iso(new Date(cr.date)) > iso(tt)) return;
      // завершённые и отменённые — до даты архивации (иначе фактической, иначе последнего отчёта); даты нет — в архиве всегда (как кольцо)
      const on = D(p.archivedAt) || D(p.ae) || lastUpd(p); if (isArch(p) && (!on || tt >= on)) return;
      const rs = repsOf(p).filter(r => r.d <= tt && isApproved(r)); c[rs.length ? rs[rs.length - 1].rag : '']++; });
    pts.push({tt, c});
  }
  const W = 500, H = 230, L = 30, B = 30, TP = 12;
  const max = Math.max(1, ...pts.map(p => p.c['Зелений'] + p.c['Жовтий'] + p.c['Червоний'] + p.c['']));
  // у каждого сегмента видно число: сегмент не ниже MIN, масштаб подбирается так, чтобы самый высокий столбец поместился
  const KS = RAGS.concat(['']), PH = H - B - TP, MIN = 18, seg = (v, u) => v ? Math.max(v * u, MIN) : 0;
  let u = PH / max;
  for (let n = 0; n < 5; n++) { const top = Math.max(...pts.map(p => KS.reduce((a, k) => a + seg(p.c[k], u), 0))); if (top <= PH) break; u *= PH / top; }
  const slot = (W - L - 8) / pts.length, bw = slot * 0.5, y = v => H - B - v * u;
  let g = '';
  [0, Math.ceil(max / 2), max].forEach(v => { g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-2)">${v}</text>`; });
  pts.forEach((p, i) => { const x = L + i * slot + (slot - bw) / 2; let base = H - B;
    KS.forEach(k => { const v = p.c[k]; if (!v) return; const h = seg(v, u), y1 = base - h; base = y1;
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(h - 2, 1)}" rx="5" fill="${k ? RC[k] : 'var(--na)'}"><title>${fmt(p.tt)}: ${k ? tv(k) : t('notRated')} — ${v}</title></rect>`;
      g += `<text x="${x + bw / 2}" y="${y1 + h / 2 + 3}" text-anchor="middle" font-size="11" font-weight="600" fill="${k ? '#fff' : 'var(--text)'}">${v}</text>`; });
    g += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--text-2)">${i === pts.length - 1 ? t('today') : fmtShort(p.tt)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('wpDyn')}">${g}</svg><p class="hint">${t('dynHint')}</p>`;
}

// пересчёт — при смене колонок, переходе на вкладку и изменении окна. На телефоне и планшете (< 900 px) — как раньше.
let TW = {};
function tLockOpen(key, cols){
  const w = TW[key];
  if (!w || w.cols !== cols.join(',') || innerWidth < 900) return '<table>';
  const user = (TS[key] && TS[key].w) || {}, ws = cols.map((c, i) => user[c] || w.w[i]);
  return `<table class="locked" style="table-layout:fixed;width:${ws.reduce((a, b) => a + b, 0)}px"><colgroup>${ws.map(x => `<col style="width:${x}px">`).join('')}</colgroup>`;
}
// закреплённые ширины (lockWidths приложения): каждая вверх — слово не рвётся посреди; лишнее отдаёт самая широкая — таблица не шире замера
function lockWidths(m, total){
  const w = m.map(x => Math.ceil(x)), sum = m.reduce((a, b) => a + b, 0), extra = w.reduce((a, b) => a + b, 0) - Math.floor(total > 0 ? Math.min(total, sum) : sum);
  if (extra > 0 && w.length){ const i = w.indexOf(Math.max(...w)); w[i] = Math.max(1, w[i] - extra); }
  return w;
}

function tLockMeasure(){
  if (innerWidth < 900) return;
  document.querySelectorAll('.dt[data-tkey]').forEach(el => {
    const key = el.dataset.tkey, cols = (TS[key] ? TS[key].cols : []).join(',');
    if (TW[key] && TW[key].cols === cols) return;
    const tb = el.querySelector('table'), w = lockWidths([...el.querySelectorAll('thead th')].map(th => th.getBoundingClientRect().width), tb ? tb.getBoundingClientRect().width : 0);

  });
}

document.addEventListener('pointerdown', e => {

function notifFor(kind, author, diffs, p, risk){
  const me = VIEWER;
  if (!me || author === me) return false;
  if (isArch(p) && kind !== 'archived') return false;

  if (kind === 'risk'){

    const sc = risk ? risk.p * risk.i : +(((diffs || []).filter(d => d.f === 'kScore').pop() || {}).to || 0);

}
function notifItems(){
  const since = Date.now() - 14 * DAY, read = notifRead(), out = [];
  for (const p of visAll()){
    for (const c of p.changes || []){
      if (new Date(c.date).getTime() < since) continue;
      let kind = notifKind(c);
      if (kind === 'cardEdit'){ const tn = teamNotice(c.diffs, VIEWER); if (tn) kind = tn; else if ((c.diffs || []).length && !shownDiffs(c.diffs).length && !c.reason) continue; }
      const risk = c.ref && c.ref.type === 'risk' ? (p.risks || []).find(k => String(k.id) === String(c.ref.id)) : null;
      const k = `${p.id}:j:${c.date}:${c.kind}`;
      if (notifFor(kind, c.who, c.diffs, p, risk)) out.push({p, c, kind, k, date:c.date, who:c.who, unread:c.date > read && !notifSeen().has(k)});
    }
    for (const m of p.comments || []){
      if (new Date(m.date).getTime() < since || !notifFor('comment', m.who, [], p, null)) continue;
      const k = `${p.id}:c:${m.date}:${m.who}:${m.txt}`;
      out.push({p, m, kind:'comment', k, date:m.date, who:m.who, unread:m.date > read && !notifSeen().has(k)});
    }
  }
  // «Відгук розглянуто» — мои отзывы, разобранные за окно; «Новий випуск порталу» — текущий выпуск моложе окна (как extraItems приложения)
  const sinceIso = new Date(since).toISOString();
  for (const f of FEEDBACK){
    if (f.author !== VIEWER || !f.decidedAt || f.decidedAt < sinceIso || f.status === 'Новий') continue;
    const k = `f${f.id}@${f.decidedAt}`;
    out.push({fb:f, kind:'feedback', k, date:f.decidedAt, who:'', unread:f.decidedAt > read && !notifSeen().has(k)});
  }

    if (d >= sinceIso) out.push({rel, kind:'release', k, date:d, who:'', unread:d > read && !notifSeen().has(k)}); }
  return out.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
}

const segPick = (name, values, cur, colors) => `<div class="opts">${values.map((v, i) => `<input type="radio" id="${name}${i}" name="${name}" value="${esc(v)}"${v === cur ? ' checked' : ''}><label for="${name}${i}">${colors ? `<span class="dot sm" style="background:${RC[v]}"></span>` : ''}${esc(tv(v))}</label>`).join('')}</div>`;
const ragPick = (name, label, req, cur) => `<fieldset class="ragpick"><legend>${label}${req ? ' *' : ''}</legend>${segPick(name, RAGS, cur, true)}</fieldset>`;
const formHead = (title, sub, kind) => `<div class="ph"><div><div class="k">${kind ? entTag(kind) : ''}<span>${sub}</span></div><h2>${title}</h2></div>${closeBtn()}</div>`;
const fErr = form => msg => { const e = form.querySelector('.err'); e.textContent = msg; e.hidden = false; e.scrollIntoView && e.scrollIntoView({block:'nearest'}); };
const radioVal = (form, n) => (form.querySelector(`input[name="${n}"]:checked`) || {}).value || '';

const rmBtn = () => `<button type="button" class="btn rm" data-ed="rm" aria-label="${t('rmRow')}" title="${t('rmRow')}">×</button>`;
const tmRow = m => `<div class="ed-row tm-row"><select class="tm-n" aria-label="${fl('tmPerson')}"><option value="">${t('notSet')}</option>${Object.keys(ORG).map(n => opt(n, m.n, `${n} — ${roleOf(n)}`)).join('')}</select>`
  + `<input type="text" class="tm-r" aria-label="${fl('tmRole')}" placeholder="${fl('tmRole')} *" value="${esc(m.role || '')}">`
  + `<input type="text" class="tm-t" aria-label="${fl('tmTopics')}" placeholder="${fl('tmTopics')}" value="${esc(m.topics || '')}">${rmBtn()}</div>`;
const lnRow = l => `<div class="ed-row ln-row"><input type="text" class="ln-t" aria-label="${fl('linkTitle')}" placeholder="${fl('linkTitle')}" value="${esc(l.t || '')}">`
  + `<input type="text" inputmode="url" class="ln-u" aria-label="${fl('linkUrl')}" placeholder="https://" value="${esc(l.u || '')}">${rmBtn()}</div>`;
function projectForm(p){
  const isNew = !p; p = p || {pm:'', type:'Звичайний', status:'Ініціація', prio:'2 — Середній', dept:'ІТ', start:iso(TODAY)};
  state.panel = {kind:'form'};
  openPanel(`${formHead(isNew ? t('newProject') : esc(p.title), `${isNew ? '' : esc(p.code) + ' · '}${t('listLabel')} «${t('navProjects')}»`, 'project')}
  <form id="pform" novalidate>
    <h3 class="fsec">${t('fGeneral')}</h3>
    <div class="frow"><label class="t" for="p-title">${fl('title')} *</label><input type="text" id="p-title" value="${esc(p.title || '')}"></div>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-code">${fl('code')}</label><input type="text" id="p-code" value="${esc(p.code || '')}" placeholder="${t('codeAuto')}" readonly disabled></div>
      <div><label class="t" for="p-dept">${fl('dept')}</label><select id="p-dept">${DEPTS.map(d => opt(d, p.dept)).join('')}</select></div>
    </div>
    ${isNew ? `<fieldset class="ragpick"><legend>${fl('type')}</legend>${segPick('p-type', TYPES, p.type)}</fieldset>` : ''}
    <div class="frow"><label class="t" for="p-prio">${fl('prio')}</label><select id="p-prio">${PRIOS.map(s => opt(s, p.prio)).join('')}</select><p class="hint">${t('prioHint')}</p></div>
    <div class="frow"><label class="t" for="p-parent">${fl('parent')}</label><select id="p-parent"><option value="0">${t('notSet')}</option>${parentChoices(visAll().map(x => ({id:x.id, parentId:x.parent || 0, code:x.code})), isNew ? 0 : p.id).sort((a, b) => a.code.localeCompare(b.code, 'uk', {numeric:true})).map(x => `<option value="${x.id}"${x.id === (p.parent || 0) ? ' selected' : ''}>${esc(pLabel(x.id))}</option>`).join('')}</select><p class="hint">${t('parentHint')}</p></div>
    <h3 class="fsec">${t('fPeople')}</h3>
    ${isNew ? `<div class="frow"><label class="t" for="p-pm">${fl('pm')} *</label>${peopleSelect('p-pm', p.pm, true)}</div>
    <div class="frow"><label class="t" for="p-owner">${fl('owner')}</label>${peopleSelect('p-owner', p.owner)}</div>`
    : `<div class="frow"><label class="t">${fl('pm')}</label><div class="fixedval" id="p-pm-fixed">${esc(p.pm || '—')}</div><input type="hidden" id="p-pm" value="${esc(p.pm || '')}"></div>
    <div class="frow"><label class="t">${fl('owner')}</label><div class="fixedval">${esc(p.owner || '—')}</div><input type="hidden" id="p-owner" value="${esc(p.owner || '')}"></div>
    <p class="hint" style="margin-top:-6px">${t('pmOnlyPmo')}</p>`}
    <div class="frow"><span class="t lbl-t">${fl('team')}</span>
      <div class="ed-rows" id="p-team">${((p.team || []).length ? p.team : [{}]).map(tmRow).join('')}</div>
      <button type="button" class="btn add" data-ed="addtm">${t('addMember')}</button></div>
    <div class="frow"><span class="t lbl-t">${fl('links')}</span>
      <div class="ed-rows" id="p-links">${(p.links || []).map(lnRow).join('')}</div>
      <button type="button" class="btn add" data-ed="addln">${t('addLink')}</button></div>
    ${isNew ? '' : `<p class="note">${t('accessRecalc')}</p>`}
    ${isNew ? `<h3 class="fsec">${t('fDates')}</h3>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-start">${fl('start')}</label><input type="date" id="p-start" value="${p.start || ''}"></div>
      <div><label class="t" for="p-golive">${fl('golive')}</label><input type="date" id="p-golive" value="${p.golive || ''}"></div>
      <div><label class="t" for="p-plan">${fl('plan')}</label><input type="date" id="p-plan" value="${p.plan || ''}"></div>
      <div><label class="t" for="p-status">${fl('status')}</label><select id="p-status">${REPORT_STATUSES.map(s => opt(s, p.status)).join('')}</select></div>
    </div>` : ''}
    <h3 class="fsec">${t('secMoney')}</h3>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-budget">${fl('budget')}, $</label><input type="text" id="p-budget" inputmode="numeric" autocomplete="off" onfocus="this.value=this.value.replace(/\\s/g,'');if(this.value==='0')this.value=''" oninput="const m=/^(.*?)[.,](\\d{1,2})$/.exec(this.value.replace(/\\s/g,''));this.value=m?String(Math.round(+(m[1].replace(/[^0-9]/g,'')||0)+(+m[2].padEnd(2,'0'))/100)):this.value.replace(/[^0-9]/g,'')" onblur="this.value=this.value.replace(/[^0-9]/g,'').replace(/^0+(?=\\d)/,'').replace(/\\B(?=(\\d{3})+(?!\\d))/g,' ')" value="${grp(p.budget || 0)}"></div>
    </div>
    <div class="frow"><label class="t" for="p-desc">${fl('desc')}${isNew ? '' : ' *'}</label><textarea id="p-desc">${esc(p.desc || '')}</textarea>${isNew ? '' : `<p class="hint">${t('descHint')}</p>`}<p class="ferr" id="e-desc" hidden></p></div>
    <p class="err" hidden></p>
    <div class="actions"><button type="submit" class="btn primary">${t('save')}</button><button type="button" class="btn" data-act="${isNew ? 'close' : 'backp'}" data-id="${p.id || ''}">${t('cancel')}</button></div>
  </form>`);
  const form = document.getElementById('pform'), err = fErr(form), g = id => form.querySelector('#' + id);
  // описание введено — ошибка у поля уходит (как портал)
  g('p-desc').addEventListener('input', () => { if (g('p-desc').value.trim()){ g('e-desc').hidden = true; g('p-desc').removeAttribute('aria-invalid'); } });
  form.addEventListener('click', e => {
    const b = e.target.closest('[data-ed]');
    if (!b) return;
    if (b.dataset.ed === 'addtm'){ g('p-team').insertAdjacentHTML('beforeend', tmRow({})); }
    else if (b.dataset.ed === 'addln'){ g('p-links').insertAdjacentHTML('beforeend', lnRow({})); }
    else if (b.dataset.ed === 'rm') b.closest('.ed-row').remove();
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const vals = {title:g('p-title').value.trim(), code:g('p-code').value.trim(), dept:g('p-dept').value,
      pm:g('p-pm').value, owner:g('p-owner').value, prio:g('p-prio').value, parent:+g('p-parent').value || 0, budget:Math.round(+g('p-budget').value.replace(/\s/g, '') || 0), desc:g('p-desc').value.trim()};
    if (!vals.title) return err(t('errTitle'));
    if (!vals.pm) return err(t('errPM'));
    // #96: при правке карточки (PM) «Мета та опис» обязательно; новый проект PMO заводит без него
    const de = g('e-desc'); de.hidden = true; g('p-desc').removeAttribute('aria-invalid');
    if (!isNew && !vals.desc){ de.textContent = t('errDesc'); de.hidden = false; g('p-desc').setAttribute('aria-invalid', 'true'); g('p-desc').focus(); return err(t('errDesc')); }
    // #27: название уникально (без учёта регистра и пробелов); прежнее название при правке не мешает
    const tk = x => String(x || '').trim().replace(/\s+/g, ' ').toLowerCase();
    if (tk(vals.title) !== tk(isNew ? '' : p.title) && PROJ.some(x => (isNew || x.id !== p.id) && tk(x.title) === tk(vals.title))) return err(t('errTitleTaken'));
    // #54: даты нового проекта не раньше старта
    if (isNew && g('p-start').value && ['p-golive','p-plan'].some(id => g(id).value && g(id).value < g('p-start').value)) return err(t('errDatesOrder'));
    const team = [], links = [];
    for (const r of form.querySelectorAll('#p-team .tm-row')){
      const n = r.querySelector('.tm-n').value, role = r.querySelector('.tm-r').value.trim(), topics = r.querySelector('.tm-t').value.trim();
      if (!n) continue;                               // пустая строка или строка без участника
      if (!role) return err(t('errRole'));
      if (!team.some(m => m.n === n)) team.push({n, role, topics});   // повтор участника — остаётся первая строка
    }
    for (const r of form.querySelectorAll('#p-links .ln-row')){
      const lt = r.querySelector('.ln-t').value.trim(), u = r.querySelector('.ln-u').value.trim();
      if (!lt && !u) continue;
      if (!/^https:\/\/\S+$/i.test(u)) return err(t('errUrl'));   // как портал: после https:// — адрес
      links.push({t:lt || 'Посилання', u});
    }
    vals.team = team; vals.links = links;
    if (isNew){
      const id = Math.max(0, ...PROJ.map(x => x.id)) + 1;
      const np = Object.assign({id, type:radioVal(form, 'p-type') || 'Звичайний', status:g('p-status').value, progress:0,
        start:g('p-start').value, golive:g('p-golive').value, plan:g('p-plan').value, fc:'', actual:0, rag:'', lastUpdate:'', lastReport:'',
        reports:[], comments:[], risks:[], changes:[{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'create', reason:'', diffs:[]}]}, vals);
      syncStakeholders(np);
      if (!np.code) np.code = 'PRJ-' + String(id).padStart(3, '0');
      PROJ.push(np);
      rerenderMain();
      if (canSee(np)) projectPanel(id, false); else closePanel();
      persist(np); toast(t('savedProject'));
    } else {
      const LST = {team:teamStr, links:linksStr, parent:pLabel};
      const same = k => k === 'team' || k === 'links' ? JSON.stringify(p[k] || []) === JSON.stringify(vals[k]) : String(p[k] || (k === 'parent' ? 0 : '')) === String(vals[k] ?? '');   // родитель — по номеру
      const diffs = Object.keys(vals).filter(k => !same(k)).map(k => LST[k] ? {f:k, from:LST[k](p[k]), to:LST[k](vals[k])} : {f:k, from:p[k] ?? '', to:vals[k]});
      if (!diffs.length){ projectPanel(p.id, false); return; }
      const tRows = list => (list || []).map(m => ({email:m.n, role:m.role}));
      diffs.push(...teamMarks(tRows(p.team), tRows(vals.team)));
      Object.assign(p, vals);
      syncStakeholders(p);
      p.changes = (p.changes || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'edit', reason:'', diffs:diffs.filter(d => d.f !== 'desc')}]);
      rerenderMain();
      if (canSee(p)) projectPanel(p.id, false); else closePanel();
      persist(p); toast(t('savedEdit'));
    }
  });
}

// #43: смена PM / власника после создания — только PMO; в приложении — запись «Призначення», синхронизация переносит
function assignForm(p){
  if (!p || !canApprove() || isArch(p)) return;
  state.panel = {kind:'form'};
  openPanel(`${formHead(t('assignTitle'), `${esc(p.code)} · ${t('listLabel')} «${t('navProjects')}»`, 'assign')}
  <p class="note">${t('assignHint')}</p>
  <form id="aform" novalidate>
    <div class="frow"><label class="t">${fl('pm')}</label><div class="fixedval">${esc(p.pm || '—')}</div></div>
    <div class="frow"><label class="t" for="a-pm">${t('assignNewPm')}</label>${peopleSelect('a-pm', '')}</div>
    <div class="frow"><label class="t">${fl('owner')}</label><div class="fixedval">${esc(p.owner || '—')}</div></div>
    <div class="frow"><label class="t" for="a-own">${t('assignNewOwner')}</label>${peopleSelect('a-own', '')}</div>
    <div class="frow"><label class="t" for="a-note">${t('assignNote')} *</label><textarea id="a-note"></textarea></div>
    <p class="err" hidden></p>
    <div class="actions"><button type="submit" class="btn primary">${t('save')}</button><button type="button" class="btn" data-act="backp" data-id="${p.id}">${t('cancel')}</button></div>
  </form>`);
  const form = document.getElementById('aform'), err = fErr(form), g = id => form.querySelector('#' + id);
  form.addEventListener('submit', e => {
    e.preventDefault();
    // те же правила, что у синхронизации (tests/cases/assignments.json): что-то меняется, комментарий есть
    const pm = g('a-pm').value, own = g('a-own').value, note = g('a-note').value.trim();
    const diffs = [];
    if (pm && pm !== p.pm) diffs.push({f:'pm', from:p.pm || '—', to:pm});
    if (own && own !== p.owner) diffs.push({f:'owner', from:p.owner || '—', to:own});
    if (!diffs.length) return err(t('errAssignSame'));
    if (!note) return err(t('errAssignNote'));
    if (pm) p.pm = pm;
    if (own) p.owner = own;
    p.changes = (p.changes || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'assign', reason:note, diffs}]);
    rerenderMain(); projectPanel(p.id, false); persist(p); toast(t('savedAssign'));
  });
}

function riskForm(pid, rid, fromList, copyRid){
  const pool = visP().filter(p => isActive(p) && canEditP(p)).sort(byOrder);
  let p = pid ? pById(pid) : pool[0];
  if (!p) return;
  const k = rid ? (p.risks || []).find(x => x.id === rid) : null;
  const edit = canEditP(p) && !isArch(p);
  // #92: «Копіювати ризик» — новая запись со всеми полями исходной (riskCopy, векторы tests/cases/risk-form.json)
  const src = copyRid ? (p.risks || []).find(x => String(x.id) === String(copyRid)) : null;
  const cur = k || (src ? riskCopy(src, iso(TODAY)) : {type:'Ризик', p:3, i:3, owner:p.pm, status:'Відкрито', due:'', title:'', mitigation:'', strategy:'', contingency:''});
  state.panel = {kind:'form'};
  const dis = edit ? '' : ' disabled';
  const scale = (name, val, pre) => `<div class="opts scale">${[1,2,3,4,5].map(n => `<input type="radio" id="${name}${n}" name="${name}" value="${n}"${+val === n ? ' checked' : ''}${dis}><label for="${name}${n}">${n}</label>`).join('')}</div><p class="scale-d" id="${name}-d">${t(pre + val)}</p>`;
  // #47 / #55: заголовок новой записи — по типу (меняется при выборе типа)
  const newTitle = ty => ty === 'Проблема' ? t('newIssueT') : t('newRiskT');
  openPanel(`${formHead(k ? t('riskCard') : newTitle(cur.type), `${t('listLabel')} «${t('navRisks')}»`, cur.type === 'Проблема' ? 'issue' : 'risk')}
  ${edit ? '' : `<p class="note lock">🔒 ${t('readOnly')}</p>`}
  ${edit && k ? `<p class="note" id="k-only">${t('riskOnlyStatus')}</p>` : ''}${src ? `<p class="note" id="k-copy">${t('riskCopyNote').replace('{t}', esc(src.title))}</p>` : ''}
  <form id="kform" novalidate>
    <div class="frow"><label class="t" for="k-p">${fl('rProj')} *</label>
      ${k || (pid && !fromList) ? `<div class="fixed">${esc(p.title)}</div>` : `<select id="k-p">${pool.map(x => `<option value="${x.id}"${x.id === p.id ? ' selected' : ''}>${esc(x.title)}</option>`).join('')}</select>`}</div>
    <fieldset class="ragpick"><legend>${fl('kType')}</legend>${segPick('k-type', ['Ризик','Проблема'], cur.type)}</fieldset>
    <div class="frow"><label class="t" for="k-title">${fl('kDesc')} *</label><textarea id="k-title"${dis}>${esc(cur.title)}</textarea><p class="ferr" id="k-title-e" hidden></p></div>
    <div class="scorecalc">
      <div class="frow"><span class="lbl-t">${t('cProb')}</span>${scale('k-pr', cur.p, 'p')}</div>
      <div class="frow"><span class="lbl-t">${t('cImp')}</span>${scale('k-im', cur.i, 'i')}</div>
      <div class="scorebox"><span class="k">${fl('kScore')}</span><span id="k-score"></span></div>
      <p class="note" style="margin:8px 0 0">${t('riskHow')}</p>
    </div>
    <div class="fgrid2 frow">
      <div><label class="t" for="k-owner">${fl('kOwner')}</label>${peopleSelect('k-owner', cur.owner, true)}</div>
      <div><label class="t" for="k-status">${fl('kStatus')}</label><select id="k-status"${dis}>${['Відкрито','В роботі','Закрито'].map(v => opt(v, cur.status)).join('')}</select></div>
      <div><label class="t" for="k-due">${fl('kDue')}</label><input type="date" id="k-due" value="${cur.due || ''}"${dis}><p class="ferr" id="k-due-e" hidden></p></div>
    </div>
    <fieldset class="ragpick"><legend id="k-str-l">${fl('kStrategy')}</legend>${segPick('k-str', ['Уникнення', "Зниження (пом'якшення)", 'Передача', 'Прийняття'], cur.strategy)}<p class="ferr" id="k-str-e" hidden></p></fieldset>
    <div class="frow"><label class="t" for="k-mit">${t('kMit')}</label><textarea id="k-mit"${dis}>${esc(cur.mitigation || '')}</textarea><p class="ferr" id="k-mit-e" hidden></p></div>
    <div class="frow"><label class="t" for="k-cont">${fl('kContingency')}</label><textarea id="k-cont"${dis}>${esc(cur.contingency || '')}</textarea><p class="ferr" id="k-cont-e" hidden></p></div>
    ${!k && edit ? `<p class="note" id="k-noap">${t('riskNoApproval')}</p>` : ''}
    <p class="err" hidden></p>
    <div class="actions">${edit ? `<button type="submit" class="btn primary">${t('save')}</button>` : ''}${edit && k ? `<button type="button" class="btn" id="k-copy-btn" data-act="riskcopy" data-id="${p.id}" data-rid="${esc(k.id)}">${t(k.type === 'Проблема' ? 'issueCopyBtn' : 'riskCopyBtn')}</button>` : ''}<button type="button" class="btn" data-act="${pid && !fromList ? 'backp' : 'close'}" data-id="${pid || ''}">${edit ? t('cancel') : t('close')}</button></div>
  </form>`);
  const form = document.getElementById('kform'), err = fErr(form), g = id => form.querySelector('#' + id);
  if (!edit){ form.querySelectorAll('input,select,textarea').forEach(x => x.disabled = true); }
  // #92: в сохранённой записи — только «Статус»
  else if (k) form.querySelectorAll('input,select,textarea').forEach(x => { if (x.id !== 'k-status') x.disabled = true; });
  // #91: обязательные поля по типу — звёздочки у подписей (новая запись и копия)
  const REQ_EL = {strategy:['#k-str-l', 'k-str-e'], mitigation:['label[for="k-mit"]', 'k-mit-e'], contingency:['label[for="k-cont"]', 'k-cont-e'], title:['label[for="k-title"]', 'k-title-e']};
  const stars = () => { if (k) return; const ty = radioVal(form, 'k-type') || 'Ризик', req = riskRequired(ty);
    ['strategy','mitigation','contingency'].forEach(f => { const l = form.querySelector(REQ_EL[f][0]); l.textContent = l.textContent.replace(/ \*$/, '') + (req.includes(f) ? ' *' : ''); }); };
  stars(); form.addEventListener('change', e => { if (e.target.name === 'k-type') stars(); });
  const sync = () => { const pr = +radioVal(form, 'k-pr') || 1, im = +radioVal(form, 'k-im') || 1, sc = pr * im;
    g('k-score').innerHTML = `${scoreHtml(sc)} <b>${t('sc' + scoreBucket(sc))}</b> <span class="muted">= ${pr} × ${im}</span>`;
    g('k-pr-d').textContent = t('p' + pr); g('k-im-d').textContent = t('i' + im); };
  // #88: срок — новый не раньше сегодняшнего дня, существующий не раньше даты регистрации; прежний не проверяется; просроченный открытый — пометка
  const dueMsg = () => { const v = g('k-due').value, today = iso(TODAY), min = riskDueMin(v, k ? k.due || '' : '', k ? k.created || '1970-01-01' : '', today);
    return min ? t('errRiskDue').replace('{date}', fmt(D(min))) : ''; };
  const dueShow = () => { const m = dueMsg(), v = g('k-due').value, e = g('k-due-e');
    const late = edit && !m && v && v < iso(TODAY) && g('k-status').value !== 'Закрито'; e.textContent = m || (late ? t('riskOverdue') : ''); e.hidden = !e.textContent;

// показники картки, які змінює звіт (поля, яких у звіті немає, не змінюються)
function reportVals(p, r){
  const vals = {};
  if (r.status) vals.status = r.status;   // «Завершено» / «Скасовано» — тот же статус (архив)
  ['type','start','golive','plan','fc'].forEach(k => { if (r[k] != null) vals[k] = r[k]; });
  if (r.progress != null) vals.progress = r.progress;
  if (!p.lastUpdate || D(r.date) >= D(p.lastUpdate)) vals.rag = calcRag(r);
  return vals;
}
// застосувати погоджений звіт до картки — так само, як раніше при збереженні звіту
function applyReport(p, r, when){
  const complete = ['Завершено','Скасовано'].includes(r.status), vals = reportVals(p, r), newer = 'rag' in vals;
  const diffs = Object.keys(vals).filter(k => String(p[k] ?? '') !== String(vals[k] ?? '')).map(k => ({f:k, from:p[k] ?? '', to:vals[k]}));
  Object.assign(p, vals);
  if (r.cost != null) p.actual = r.cost;
  if (newer) Object.assign(p, {lastUpdate:r.date, lastReport:r.title});
  if (complete){ p.archivedAt = r.date; if (r.ae) p.ae = r.ae; }
  if (diffs.length) p.changes = (p.changes || []).concat([{id:uid(), date:when || new Date().toISOString(), who:r.author, kind:'report', reason: r.keyReason ? r.keyReason + ' · ' + r.title : r.title, diffs}]);
  return complete;
}
const DIMS = [['sched','rSched'],['budget','rBudget'],['res','rRes']];
// рішення PMO щодо звіту; повертає текст помилки або ''
function decideReport(p, r, decision, dims, note){
  if (!r || (r.approval || AP_PEND) !== AP_PEND || !canApprove()) return '';
  const changed = decision === AP_OK ? DIMS.filter(([k]) => dims[k] && dims[k] !== r[k]) : [];
  if ((changed.length || decision === AP_RET) && !note) return t('errApNote');
  const now = new Date();
  const diffs = changed.length ? changed.map(([k, l]) => ({f:l, from:r[k], to:dims[k]})) : [{f:'apStatus', from:AP_PEND, to:decision}];
  changed.forEach(([k]) => { r[k] = dims[k]; });
  r.rag = calcRag(r);
  Object.assign(r, {approval:decision, apBy:VIEWER, apAt:now.toISOString(), apNote:note});
  p.changes = (p.changes || []).concat([{id:uid(), date:now.toISOString(), who:VIEWER, kind:'approval', reason:note, diffs}]);
  if (decision === AP_OK) applyReport(p, r, new Date(now.getTime() + 1).toISOString());
  return '';
}

// #95: подряд идущие технические выпуски — один свёрнутый блок (те же правила, что logic/releases.ts приложения)
const REL_TECH = [/^технічне оновлення без змін у роботі порталу\.?$/i, /^technical update with no changes to how the portal works\.?$/i,
  /^техническое обновление без изменений в работе портала\.?$/i];
const relPlain = h => h.replace(/<p><b>[^<]*<\/b><\/p>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const isTechRelease = r => (r.html.match(/<li>/g) || []).length === 1 && REL_TECH.some(x => x.test(relPlain(r.html)));
function relDateRange(newest, oldest){
  if (newest === oldest) return newest;
  const [d1, m1, y1] = oldest.split('.'), [d2, m2, y2] = newest.split('.');
  return m1 === m2 && y1 === y2 ? `${d1}–${d2}.${m2}.${y2}` : `${oldest}–${newest}`;
}
function groupReleases(list){
  const out = [];
  for (const r of list){
    const last = out[out.length - 1];
    if (!isTechRelease(r)) { out.push({kind:'rel', r}); continue; }
    if (last && last.kind === 'tech') last.list.push(r); else out.push({kind:'tech', list:[r], vers:'', dates:''});
  }
  for (const x of out) if (x.kind === 'tech'){
    const n = x.list[0], o = x.list[x.list.length - 1];
    x.vers = x.list.length > 1 ? `${o.ver}–${n.ver}` : n.ver;
    x.dates = relDateRange(n.date, o.date);
  }
  return out;
}
