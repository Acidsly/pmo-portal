<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPM — Портфель проєктів</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%230a84ff%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%235e5ce6%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2741%27%20text-anchor%3D%27middle%27%20font-family%3D%27Segoe%20UI%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2724%27%20font-weight%3D%27700%27%20fill%3D%27%23fff%27%20letter-spacing%3D%27-1%27%3EPPM%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap&amp;subset=cyrillic" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --theme:#007aff; --theme-2:#0062cc; --theme-soft:rgba(0,122,255,.12);
  --bg-page:#f5f5f7; --bg:#ffffff; --bg-alt:#f2f2f7; --bg-hover:rgba(0,0,0,.04);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(0,0,0,.08);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#aeaeb2;
  --line:rgba(0,0,0,.08); --track:#e5e5ea;
  --g:#34c759; --y:#ff9f0a; --r:#ff3b30; --na:#c7c7cc;
  --strat-bg:rgba(175,82,222,.12); --strat:#8e44c9;
  --pick-off:transparent; --pick-hover:rgba(0,0,0,.05);
  /* цвет раздела меню (значки Lucide), он же — метка сущности бокового окна */
  --nv-home:#2563eb; --nv-projects:#7c3aed; --nv-reports:#0f766e; --nv-risks:#b45309; --nv-archive:#64748b; --nv-feedback:#be185d; --nv-ai:#6d28d9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-hi:0 2px 6px rgba(0,0,0,.06),0 18px 40px rgba(0,0,0,.10);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --theme:#0a84ff; --theme-2:#409cff; --theme-soft:rgba(10,132,255,.2);
    --bg-page:#000000; --bg:#1c1c1e; --bg-alt:#2c2c2e; --bg-hover:rgba(255,255,255,.06);
    --glass:rgba(22,22,24,.72); --glass-line:rgba(255,255,255,.1);
    --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
    --line:rgba(255,255,255,.1); --track:#3a3a3c;
    --g:#30d158; --y:#ffd60a; --r:#ff453a; --na:#48484a;
    --strat-bg:rgba(191,90,242,.2); --strat:#da8fff;
    --pick-off:rgba(255,255,255,.07); --pick-hover:rgba(255,255,255,.13);
    --nv-home:#60a5fa; --nv-projects:#a78bfa; --nv-reports:#2dd4bf; --nv-risks:#fbbf24; --nv-archive:#94a3b8; --nv-feedback:#f472b6; --nv-ai:#c4b5fd;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --shadow-hi:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --theme:#0a84ff; --theme-2:#409cff; --theme-soft:rgba(10,132,255,.2);
  --bg-page:#000000; --bg:#1c1c1e; --bg-alt:#2c2c2e; --bg-hover:rgba(255,255,255,.06);
  --glass:rgba(22,22,24,.72); --glass-line:rgba(255,255,255,.1);
  --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
  --line:rgba(255,255,255,.1); --track:#3a3a3c;
  --g:#30d158; --y:#ffd60a; --r:#ff453a; --na:#48484a;
  --strat-bg:rgba(191,90,242,.2); --strat:#da8fff;
  --pick-off:rgba(255,255,255,.07); --pick-hover:rgba(255,255,255,.13);
  --nv-home:#60a5fa; --nv-projects:#a78bfa; --nv-reports:#2dd4bf; --nv-risks:#fbbf24; --nv-archive:#94a3b8; --nv-feedback:#f472b6; --nv-ai:#c4b5fd;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --shadow-hi:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.47;color:var(--text);background:var(--bg-page);-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--theme-soft);outline-offset:2px;border-radius:10px}
.muted{color:var(--text-2)}

/* Frosted header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line)}
.top-in{max-width:1440px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
/* шапка: название — своей строкой сверху; ниже — меню и кнопки в одну строку (на телефоне меню — отдельной строкой) */
.brand{display:flex;align-items:center;gap:12px;flex:1 0 100%}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#0a84ff,#5e5ce6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:-.02em;flex:none}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--text-2)}
.nav{display:flex;gap:2px;background:var(--bg-alt);padding:3px;border-radius:12px;overflow-x:auto;max-width:100%;flex:0 1 auto;min-width:0}
.nav button{border:0;background:none;padding:4px 14px 4px 5px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:background-color .2s,color .2s;display:inline-flex;align-items:center;gap:8px}
/* значок раздела: цветной контур на мягкой подложке; на телефоне — только значки (название — в подсказке) */
.nav .ni{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--nc);background:color-mix(in srgb,var(--nc) 14%,transparent)}
.nav .ni svg{width:16px;height:16px}
.nav [data-page=home]{--nc:var(--nv-home)}.nav [data-page=projects]{--nc:var(--nv-projects)}.nav [data-page=reports]{--nc:var(--nv-reports)}
.nav [data-page=risks]{--nc:var(--nv-risks)}.nav [data-page=archive]{--nc:var(--nv-archive)}.nav [data-page=feedback]{--nc:var(--nv-feedback)}
/* уже 1280 px меню и кнопки в одну строку не помещаются — меню своей строкой (с подписями; на телефоне — только значки) */
/* меню своей строкой — разделы делят ширину поровну, без пустого места справа */
@media (max-width:1279px){.nav{order:3;flex:1 0 100%}.nav button{flex:1 1 auto;justify-content:center}}
@media (max-width:720px){.nav button{flex:1;justify-content:center;padding:5px}.nav .nl{display:none}.nav .ni{width:30px;height:30px}}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;flex:none}
.seg{display:inline-flex;background:var(--bg-alt);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.viewas{display:inline-flex;align-items:center;gap:8px;background:var(--bg-alt);border-radius:10px;padding:3px 4px 3px 10px;font-size:13px;color:var(--text-2)}
.viewas select{border:0;background:var(--bg);border-radius:8px;padding:5px 8px;font-weight:600;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12);max-width:200px}
@media (max-width:1100px){.top-in{gap:12px}}

main{max-width:1440px;margin:0 auto;padding:40px 32px 96px}
@media (max-width:720px){main,.top-in{padding-left:16px;padding-right:16px} main{padding-top:24px}}
.hero{margin-bottom:28px}
.page-title{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0}
.page-sub{color:var(--text-2);font-size:17px;margin:8px 0 0}
@media (max-width:720px){.page-title{font-size:30px}}
.msgbar{display:flex;gap:10px;align-items:flex-start;background:var(--theme-soft);color:var(--text);border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:28px;max-width:900px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:24px}
.stack{margin-bottom:24px}
@media (max-width:920px){.grid2{grid-template-columns:minmax(0,1fr)}}
.wp{background:var(--bg);border-radius:var(--radius);padding:24px 26px;min-width:0;box-shadow:var(--shadow)}
.wp-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.wp-h h2{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
.wp-h > span{display:inline-flex;align-items:center;gap:12px}
.more{background:none;border:0;color:var(--theme);cursor:pointer;padding:0;font-size:14px;font-weight:500;white-space:nowrap}
.more:hover{text-decoration:underline}
.hint{font-size:13px;color:var(--text-2);margin:12px 4px 0;max-width:820px}

/* Lists */
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--text-2);padding:8px 14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:220px}
tbody tr.row td{transition:background-color .15s}
tbody tr.row:hover td{background:var(--bg-hover)}
tr.grp td{font-weight:600;cursor:pointer;user-select:none;padding-top:20px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--line)}
tr.grp .chev{display:inline-block;width:18px;transition:transform .2s}
tr.grp.collapsed .chev{transform:rotate(-90deg)}
.link{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;color:var(--text)}
.link:hover{color:var(--theme)}
.empty{color:var(--text-2);padding:20px 0;margin:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

.rag{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.sm{width:8px;height:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--text);white-space:nowrap}
.pill .dot{background:var(--c)}
/* #85: метка и дата — один блок, дата своей строкой и не переносится внутри */
.rep-ap{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:4px;font-size:12px}.rep-ap .muted{white-space:nowrap}
.rep-ap .pill{font-size:11.5px;padding:1px 8px 1px 6px}
.tile-upd .ul .rep-ap{display:inline-flex;flex-direction:row;align-items:center;gap:6px;margin:0 0 0 6px}
.pill.st{padding:3px 10px;background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
.prog{display:inline-flex;align-items:center;gap:10px;min-width:130px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;min-width:70px}
.prog .track i{display:block;height:100%;border-radius:3px}
.prog b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.late{color:var(--r);font-weight:600;white-space:nowrap}
.grid2 th.fit,.grid2 td.fit{width:1%;padding-left:8px;padding-right:8px}.grid2 td.fit{white-space:nowrap}
.warn{color:var(--y);font-weight:600}
.over{color:var(--r);font-weight:600}
.chip{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:12px}
.flag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--theme-soft);color:var(--theme);font-size:12px;font-weight:600}
.strat{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--strat-bg);color:var(--strat);font-weight:600;font-size:12px}
.loop{color:var(--theme);font-weight:600;text-decoration:none;font-size:14px}
.loop:hover{text-decoration:underline}

.person{display:inline-flex;gap:10px;align-items:center;min-width:0}
.pav{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;letter-spacing:.02em}
.pav.lg{width:40px;height:40px;font-size:14px}
.pn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pn b{font-weight:600}
.pn small{color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis}

.cmdbar{display:flex;align-items:center;gap:8px;padding:0 0 16px;flex-wrap:wrap}
.cmd{background:var(--bg-alt);border:0;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;border-radius:10px;white-space:nowrap;font-size:14px;font-weight:500}
.cmd:hover{background:var(--track)}
.cmd.primary{background:var(--theme);color:#fff}
.cmd.primary:hover{background:var(--theme-2)}
.spacer{flex:1}
.viewsel{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
.viewsel select{border:0;background:var(--bg-alt);border-radius:10px;padding:8px 12px;min-width:200px;font-size:14px;font-weight:500}
.listcard{background:var(--bg);border-radius:var(--radius);padding:22px 24px 12px;box-shadow:var(--shadow)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tile{background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;min-width:0}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.listcard .tiles{padding:4px 0 12px}
.wp .tiles .tile{box-shadow:0 0 0 1px var(--line)}
.wp .tiles .tile:hover{box-shadow:var(--shadow-hi)}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tile-top .code{font-size:12px;color:var(--text-2);font-weight:500;letter-spacing:.02em;margin-right:auto}
.tile-t{font-size:19px;font-weight:600;line-height:1.28;letter-spacing:-.015em;margin:-4px 0 0}
.tile-pm{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg-alt)}
.tile-prog .pl{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:8px}
.tile-prog .pl b{color:var(--text);font-variant-numeric:tabular-nums}
.tile-prog .track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.tile-prog .track i{display:block;height:100%;border-radius:4px}
.tile-upd{border-top:1px solid var(--line);padding-top:14px;flex:1}
.tile-upd .ul{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tile-upd .tx{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile-f{display:flex;justify-content:flex-end;min-height:20px}

/* Charts */
.donut-wrap{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.legend li{display:flex;align-items:center;gap:10px;font-size:14px}
.legend b{font-variant-numeric:tabular-nums;min-width:20px;display:inline-block;font-size:17px}
svg text{font-family:inherit}
.chart{width:100%;height:auto;max-width:560px;display:block}

/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
#scrim.open{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);box-shadow:var(--shadow-hi);border-radius:28px 0 0 28px;transform:translateX(104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;z-index:20;padding:calc(24px + env(safe-area-inset-top,0px)) 32px calc(40px + env(safe-area-inset-bottom,0px))}
@media (max-width:680px){#panel{border-radius:0;padding-left:20px;padding-right:20px}}
#panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.ph h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;line-height:1.15}
.x{background:var(--bg-alt);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--text-2)}
.x:hover{background:var(--track)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg-alt);font-size:12px;font-weight:600;color:var(--text-2)}
.btn{border:0;background:var(--bg-alt);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{background:var(--track)}
.btn.primary{background:var(--theme);color:#fff}
.btn.primary:hover{background:var(--theme-2)}
.sec{margin-top:28px}
.sec h3{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px;letter-spacing:.01em}
.group{background:var(--bg-alt);border-radius:16px;padding:4px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text-2);font-size:14px}
.kv .v{text-align:right;font-weight:500}
.k{font-size:12px;color:var(--text-2)}
/* метка сущности бокового окна: что открыто — проект, отчёт, риск… (одинаково, откуда бы ни открыли) */
.ph .k{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}
.ent svg{width:13px;height:13px;flex:none}
.pmcard{display:flex;gap:14px;align-items:center;background:var(--bg-alt);border-radius:16px;padding:14px 16px}
.pmcard .pn b{font-size:16px}
.pmcard .role{margin-left:auto;font-size:12px;font-weight:600;color:var(--theme);background:var(--theme-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.people2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.people2 > div{background:var(--bg-alt);border-radius:16px;padding:12px 14px}
.people2.one{grid-template-columns:minmax(0,1fr)}

<script>(function(){
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DAY = 864e5;
const D = s => s ? new Date(String(s).length === 10 ? s + 'T00:00:00' : s) : null;
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const daysAgo = n => new Date(TODAY.getTime() - n * DAY);
const age = d => Math.round((TODAY - d) / DAY);
const fmt = d => d ? d.toLocaleDateString('uk-UA') : '';
const fmtDT = d => d ? d.toLocaleDateString('uk-UA') + ' ' + d.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'}) : '';
const fmtShort = d => d.toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit'});
const money = n => Math.round(n || 0).toLocaleString('uk-UA') + ' $';   // все суммы — в долларах США (#30)
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* <generated:help> — tools/guide.mjs, не править вручную */
const GUIDE = ["<h3>Що це<\/h3>\n<p>Портал, де компанія веде всі проєкти в одному місці:<\/p>\n<ul>\n<li>у кожного проєкту є <b>картка<\/b>: команда, посилання, терміни, бюджет, стан, історія змін, коментарі, статус-звіти й ризики;<\/li>\n<li>PM регулярно здає <b>статус-звіт<\/b> — лише через нього змінюються ключові показники проєкту (фаза, стан, % виконання, дати, витрати);<\/li>\n<li><b>PMO погоджує<\/b> кожен статус-звіт: у картку звіт потрапляє лише після погодження;<\/li>\n<li><b>ризики та проблеми<\/b> проєкту оцінюються як «ймовірність × вплив», для кожного обирається стратегія реагування;<\/li>\n<li><b>головна<\/b> показує стан портфеля: ключові показники, карту ризиків, зсуви термінів, найближчі запуски, портфель за напрямами.<\/li>\n<\/ul>\n<p>Кожен бачить лише ті проєкти, де він сам або його підлеглі мають роль.<\/p>\n<h3>Як відкрити<\/h3>\n<ul>\n<li><b>Комп'ютер:<\/b> відкрийте в браузері <code>https://smarthrua.sharepoint.com/sites/pmo-test<\/code> і увійдіть робочим обліковим записом Microsoft 365.<\/li>\n<li><b>Телефон і планшет (iPhone, iPad, Android):<\/b> та сама адреса в Safari або Chrome. Щоб відкривати, як застосунок: у Safari — «Поділитися» → «На екран „Додому“», у Chrome — меню ⋮ → «Додати на головний екран».<\/li>\n<li><b>Застосунок SharePoint на телефоні<\/b> може показувати портал не повністю — тоді відкривайте в браузері. Меню SharePoint над порталом приховане: усе робиться у вкладках порталу.<\/li>\n<\/ul>\n<p>Вкладки меню — зі значками; у кожного розділу свій колір. На телефоні лишаються тільки значки (назва — у підказці).<\/p>\n<p>Ця інструкція завжди під кнопкою <b>?<\/b> угорі порталу.<\/p>\n<h3>Хто що бачить і що може<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Хто<\/th><th>Бачить<\/th><th>Може<\/th><\/tr><\/thead><tbody><tr><td>PM проєкту<\/td><td>свій проєкт<\/td><td>редагувати картку (команда, посилання), здавати статус-звіти, вести ризики, коментувати<\/td><\/tr><tr><td>Керівники PM (за оргструктурою)<\/td><td>проєкти підлеглих<\/td><td>переглядати й коментувати<\/td><\/tr><tr><td>Власник, команда проєкту та їхні керівники<\/td><td>проєкти, де роль мають вони або їхні підлеглі<\/td><td>переглядати й коментувати<\/td><\/tr><tr><td>PMO<\/td><td>усі проєкти<\/td><td>створювати нові проєкти, погоджувати або повертати статус-звіти, переглядати й коментувати<\/td><\/tr><tr><td>Інші співробітники<\/td><td>порожній портал<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Проєкт в архіві — лише перегляд для всіх. Якщо портал для вас порожній, отже, у вас немає ролі в жодному проєкті.<\/p>\n<h3>Головна<\/h3>\n<ul>\n<li><b>Смуга показників<\/b> угорі: активні проєкти; частка проєктів зі свіжим звітом (не старшим за 14 днів); для PMO — звіти, що очікують погодження; високі ризики (відкриті, оцінка від 15); прострочені проєкти (план минув, а проєкт відкритий). Натисніть показник — відкриється відфільтрований список.<\/li>\n<li><b>Портфель за станом<\/b> — кільце: скільки активних проєктів зелених, жовтих, червоних і ще не оцінених; <b>Динаміка стану портфеля<\/b> — як змінювався стан за останні 12 тижнів: кожен проєкт на дату зрізу за останнім погодженим звітом, сірий — ще без погодженого звіту; сьогоднішній стовпець збігається з кільцем.<\/li>\n<li><b>Карта ризиків<\/b> 5 × 5: рядки — ймовірність, стовпці — вплив, у клітинці — кількість відкритих ризиків. Натисніть клітинку — під картою з'являться її ризики.<\/li>\n<li><b>Портфель за напрямами<\/b> — активні проєкти кожного напряму з розбивкою за станом; число в кольоровій частині смуги — скільки проєктів у цьому стані.<\/li>\n<li><b>Найбільші зсуви термінів<\/b> — три проєкти, де прогноз завершення пізніший за план: на скільки днів і скільки разів переносили план. <b>Запуски в найближчі 7 днів<\/b> — дата запуску, стан, PM.<\/li>\n<li>Нижче — <b>Проблемні проєкти<\/b>, <b>Немає свіжого статус-звіту<\/b>, <b>Потребують рішення керівництва<\/b>, <b>Відкриті ризики<\/b>; «Показати все» — повний список.<\/li>\n<\/ul>\n<p>Усе рахується лише за проєктами, які бачите ви (без архіву).<\/p>\n<h3>Проєкти<\/h3>\n<ul>\n<li><b>Плитки<\/b> або <b>Список<\/b> — перемикач угорі. На телефоні зручніші плитки.<\/li>\n<li><b>Відображати:<\/b> Усі проєкти, Стратегічні, Проблемні, Мої проєкти (усі) — де я PM, власник або в команді, <b>Я PM<\/b> — лише проєкти, де я PM, Немає свіжого звіту, Прострочені.<\/li>\n<li><b>У списку:<\/b> натисніть заголовок колонки, щоб відсортувати; воронка ▽ — фільтр за значеннями; шестерня ⚙ — вибір і порядок колонок (↑ / ↓); на комп'ютері ширину колонки змінюють, перетягнувши межу заголовка, — вона запам'ятовується для кожного списку, «Скинути ширини колонок» у меню шестерні; <b>CSV<\/b> — вивантажити таблицю як на екрані (файл відкривається в Excel). Нові записи — угорі. На телефоні статус-звіти й ризики показуються картками (сортування й фільтри, задані на комп'ютері, діють і там).<\/li>\n<li><b>Довгий список<\/b> прокручується у своєму вікні: заголовки колонок лишаються вгорі, горизонтальна смуга прокрутки — завжди внизу видимої частини таблиці, тож праві колонки перших рядків видно без прокручування сторінки донизу. На телефоні — як і раніше, без окремого вікна.<\/li>\n<li><b>Фільтри<\/b> воронки й «Відображати» діють, поки ви на сторінці: при переході на іншу вкладку скидаються до типових (вибір колонок і сортування запам'ятовуються). Ширина колонок від фільтрів не змінюється.<\/li>\n<li><b>Колонка «Звіт»<\/b> — дата останнього погодженого звіту, під нею — погодження найновішого звіту (для «На погодженні» й «Повернуто» — ще й дата звіту окремим рядком). Наведіть мишу на мітку — коли й ким поданий звіт. Фільтр колонки (⏷): за свіжістю та за погодженням — «Погоджено», «На погодженні», «Повернуто», «Звіти не подавались».<\/li>\n<li><b>Фаза проєкту<\/b> (етап життєвого циклу) — кольорова мітка: Ініціація — фіолетова, Планування — синя, Реалізація — зелена, Призупинено — помаранчева, Завершено — зелена, Скасовано — сіра. Кружечок поруч — стан проєкту (зелений, жовтий, червоний, сірий — не оцінено).<\/li>\n<li><b>Кольори:<\/b> червона дата завершення — термін минув, а проєкт відкритий. Крапка в колонці «Звіт» — свіжість останнього погодженого звіту: зелена — до 8 днів, жовта — 9–14, червона — понад 14, сіра — погоджених звітів ще немає (наведіть на крапку — підказка, скільки днів звіту). Під датою — <b>погодження найновішого звіту<\/b>: «Погоджено», «На погодженні» або «Повернуто» (для двох останніх — дата звіту).<\/li>\n<\/ul>\n<h3>Картка проєкту<\/h3>\n<p>Натисніть проєкт — справа відкриється картка (на телефоні — на весь екран). Угорі кожного бічного вікна — <b>кольорова мітка<\/b>, що відкрито: Проєкт, Статус-звіт, Ризик, Проблема, Призначення, Сповіщення, Відгук, Довідка — однаково, звідки б ви його не відкрили.<\/p>\n<ul>\n<li>угорі — тип, стан, фаза, пріоритет і <b>Посилання<\/b> (Loop, документи тощо); кнопки <b>Додати статус-звіт<\/b> і <b>Редагувати проєкт<\/b> (лише для PM);<\/li>\n<li><b>Батьківський проєкт<\/b> і <b>Дочірні проєкти<\/b> — зв'язок між проєктами (вкладеність будь-яка); натисніть назву, щоб відкрити проєкт. Зв'язок прав не дає: дочірні видно, лише якщо у вас є доступ до них; батьківський без доступу — назва без посилання. У «Проєктах» є колонка <b>Батьківський проєкт<\/b> (⚙ — вибір колонок).<\/li>\n<li><b>Мета та опис<\/b> — до 10 рядків (переноси рядків зберігаються); довший текст — <b>Показати повністю<\/b> / <b>Згорнути<\/b>.<\/li>\n<li>позначки погодження: «Статус-звіт … на погодженні PMO» або «Звіт … повернуто на доопрацювання» з коментарем PMO;<\/li>\n<li><b>Учасники<\/b>: PM, власник і <b>Команда проєкту<\/b> — таблиця: учасник, роль, з яких питань звертатися;<\/li>\n<li><b>Терміни<\/b> (з відхиленням прогнозу), <b>Бюджет і виконання<\/b> (суми — у доларах США);<\/li>\n<li><b>Історія змін<\/b> — хто, коли і що змінив: «було → стало», причина (зокрема рішення PMO — «Погодження звіту»); також <b>подання звітів<\/b> («Подання звіту», зокрема «Новий звіт на основі повернутого») і <b>ризики та проблеми<\/b> («Додано», зміни полів, «Закрито») — з посиланням «Відкрити звіт» / «Відкрити ризик». Ці події з'являються після синхронізації (~15 хвилин);<\/li>\n<li><b>Коментарі<\/b> — стрічка і поле «Додати коментар»;<\/li>\n<li><b>Історія станів<\/b> — оцінки за останніми звітами;<\/li>\n<li><b>Статус-звіти<\/b> — три останні, з позначкою погодження; <b>Показати всі звіти (N)<\/b> — усі, <b>Згорнути<\/b> — знову три; натисніть дату або резюме, щоб відкрити звіт; <b>Ризики та проблеми<\/b>;<\/li>\n<li><b>Доступ до картки<\/b> — хто бачить проєкт і з яким правом.<\/li>\n<\/ul>\n<p>Посиланням на картку можна поділитися: адреса в браузері веде саме на неї.<\/p>\n<h3>Статус-звіт (для PM)<\/h3>\n<ol>\n<li>У картці — <b>Додати статус-звіт<\/b> (або вкладка «Статус-звіти» → «Новий статус-звіт»). По проєкту може бути <b>лише один звіт на погодженні<\/b>: поки PMO не вирішив, кнопки немає — у картці напис «Звіт від … на погодженні PMO». Із картки форма відкривається для цього проєкту — змінити проєкт у ній не можна. У загальній формі проєкти зі звітом на погодженні недоступні для вибору (позначка «звіт від … на погодженні»).<\/li>\n<li><b>Дата подання<\/b> — день, коли ви зберігаєте звіт, вибирати не треба. <b>Період<\/b> рахується сам: з дати останнього погодженого звіту проєкту (якщо його немає — з дати старту) по дату подання, наприклад «з 06.10.2026 по 08.10.2026».<\/li>\n<li>Оцініть <b>терміни, бюджет і ресурси<\/b>: зелений, жовтий, червоний. <b>Загальний стан<\/b> рахується сам — найгірша з трьох оцінок.<\/li>\n<li><b>Ключові показники<\/b> вже заповнені поточними значеннями. Змініть лише те, що змінилося: фазу, % виконання (ціле число від 0 до 100), тип, дати, фактичні витрати (суми показуються з пробілами між розрядами: 1 450 000). Дати запуску, завершення (план) і прогнозу не можуть бути раніше дати старту. Для статусу «Завершено — перенести в архів» % виконання стає 100 і не змінюється. Дати вводьте як дд.мм.рррр (крапки ставляться самі) або оберіть у календарі — кнопка праворуч у полі. Для «Завершено» чи «Скасовано» — <b>дата завершення (факт)<\/b>: не раніше дати старту й не пізніше дати подання (портал пояснить біля поля, з якою датою порівняв); майбутнє завершення вказуйте як прогноз, дострокове — можна.<\/li>\n<li>Якщо змінили фазу, тип або дату — заповніть поле <b>Причина зміни показників<\/b> (обов'язково, потрапить в історію).<\/li>\n<li><b>Резюме одним рядком<\/b> (обов'язково), що зроблено, план, <b>проблеми та ризики за період<\/b> — коротко, що заважало (реєстр ризиків і проблем проєкту — окремо, у картці, блок «Ризики та проблеми»). <b>Потрібне рішення керівництва<\/b> — позначайте, якщо для подальшої роботи потрібне рішення поза повноваженнями PM: наприклад, погодження додаткового бюджету, зміна пріоритетів або вирішення конфлікту ресурсів. Тоді поле <b>Яке рішення потрібне<\/b> обов'язкове: зазначте, яке саме рішення потрібне й які наслідки його відсутності. Звичайне погодження статус-звіту PMO цієї позначки не потребує.<\/li>\n<li><b>Зберегти.<\/b> Якщо щось не заповнено або введено з помилкою, портал підсвітить усі такі поля одразу й пояснить біля поля, що не так. Звіт іде <b>на погодження PMO<\/b>; картка оновиться після погодження. Надісланий звіт змінити не можна.<\/li>\n<li>Якщо PMO <b>повернув<\/b> звіт — у картці і в самому звіті видно коментар PMO. Натисніть <b>Новий звіт на основі повернутого<\/b>: форма заповниться даними повернутого звіту, виправте й збережіть.<\/li>\n<li>Звіт <b>повертається автоматично<\/b>, якщо до рішення PMO змінився PM проєкту (новий PM подає актуальний звіт) або проєкт перейшов в архів — причина видно в коментарі.<\/li>\n<\/ol>\n<p>Варіанти фази <b>«Завершено — перенести в архів»<\/b> і <b>«Скасовано — перенести в архів»<\/b> відправляють проєкт в архів після погодження звіту — далі проєкт лише для перегляду. Для них обов'язкова <b>«Дата завершення (факт)»<\/b> — коли проєкт фактично завершено або скасовано: не раніше дати старту й не пізніше дати звіту.<\/p>\n<h3>Помічник ШІ (пілот)<\/h3>\n<p>Для учасників пілоту у формі статус-звіту є помічник ШІ (Microsoft Copilot Studio). Він підказує, але не вирішує: звіт і оцінки — відповідальність PM, їх погоджує PMO.<\/p>\n<ol>\n<li><b>Увімкнення.<\/b> Натисніть свій аватар праворуч угорі → перемикач <b>«Помічник ШІ»<\/b>. Першого разу портал покаже, які дані піде в ШІ, — натисніть <b>«Дозволити»<\/b> (запитуємо один раз). Вимкнули — форма звіту знову без ШІ; увімкнути можна будь-коли, без повторного дозволу. Налаштування зберігається для вас, а не для браузера: увімкнули на телефоні — увімкнено й на комп'ютері. На комп'ютері відкриється вікно входу Microsoft (якщо браузер його заблокував — дозвольте спливаючі вікна для сайту); на телефоні портал перейде на сторінку входу Microsoft і повернеться, увімкнення завершиться само. Не вдалося — під перемикачем видно причину. Якщо на телефоні у формі звіту з'явилося <b>«Увійти»<\/b> — увійдіть до Microsoft ще раз, поки форма порожня (введені дані не збережуться).<\/li>\n<li><b>«Заповнити з ШІ»<\/b> (угорі форми) — чернетка за даними проєкту: «Резюме», «Зроблено за період», «План на наступний період», «Проблеми та ризики за період». Порожні поля заповнюються одразу, заповнені — лише після вашого «Замінити». <b>«Скасувати вставку ШІ»<\/b> повертає тексти, поки ви їх не змінили. У панелі <b>«Підказки ШІ»<\/b> — що не забути (пункти минулого плану, прострочені заходи, високі ризики, запит рішення) і пропоновані оцінки: оцінка зміниться, лише якщо натиснете <b>«Прийняти»<\/b>. Перевірте й виправте тексти — це чернетка.<\/li>\n<li><b>«Перевірити з ШІ»<\/b> (замість «Зберегти»). Спершу звичайна перевірка полів форми; потім у полі <b>«Суперечності (аналіз ШІ)»<\/b> (лише для читання) — пункти, кожен з назвою поля, яке виправити:<\/li>\n<\/ol>\n<p>- портал сам порівнює дати й суми: зелені «Терміни», а прогноз пізніше плану або прострочені заходи; зелений «Бюджет», а витрати більші за бюджет проєкту; «Потрібне рішення керівництва» без опису; зменшений «% виконання»; - ШІ перевіряє зміст: чи згадані з діями високі ризики й проблеми з реєстру, чи відображено пункти минулого плану й запит рішення, чи не суперечить резюме оцінкам, чи пояснено зміну фази й дат, чи враховано коментар PMO до повернутого звіту. Під пунктом про запис реєстру — <b>«Показати запис»<\/b> і <b>«Додати згадку»<\/b>: рядок із заходами з реєстру додається в «Проблеми та ризики за період».<\/p>\n<ol>\n<li>Змінили звіт — кнопка знову <b>«Перевірити з ШІ»<\/b>. Не змінювали — <b>«Зберегти»<\/b>: звіт зберігається разом із результатом перевірки, навіть якщо ви з пунктами не згодні.<\/li>\n<li><b>ШІ не відповів<\/b> (немає зв'язку, вичерпано ліміт, немає доступу) — з'явиться причина й кнопка <b>«Зберегти без перевірки»<\/b>: здача звіту від ШІ не залежить, PMO побачить «Перевірку ШІ не виконано: …». Змініть звіт — можна спробувати ще раз. На тестовому сайті збій також автоматично записується у «Відгуки» (лише технічні дані, без тексту звіту) — щоб ми розібрали причину.<\/li>\n<li><b>Які дані йдуть у ШІ<\/b> — лише цей проєкт: показники, останні погоджені звіти, записи реєстру ризиків і проблем, текст форми; без e-mail і команди. Обробка — Microsoft Copilot Studio (Європа; модель може обробляти дані за її межами).<\/li>\n<\/ol>\n<h3>Погодження статус-звітів (для PMO)<\/h3>\n<ol>\n<li>Звіти, що чекають на вас, — показник «Очікують погодження» на головній і «Статус-звіти» → «Відображати: Очікують погодження».<\/li>\n<li>Відкрийте звіт: оцінки, ключові показники, які він змінює, що зроблено, план, проблеми.<\/li>\n<li>У блоці <b>Погодження звіту<\/b>:<\/li>\n<\/ol>\n<p>- <b>Погодити<\/b> — звіт потрапить у картку з оцінками PM; - змініть оцінку терміну, бюджету чи ресурсів і натисніть <b>Погодити зі зміною оцінок<\/b> — у картку потрапить ваша оцінка, коментар обов'язковий; - <b>Повернути на доопрацювання<\/b> — картка не зміниться, PM побачить ваш коментар (обов'язковий).<\/p>\n<ol>\n<li>PMO змінює лише оцінки; сам звіт (тексти, дати, фаза) не змінюється. Рішення записується в історію змін проєкту («Погодження звіту»: «було → стало», ваш коментар).<\/li>\n<\/ol>\n<p>Якщо звіт перевіряв помічник ШІ, у звіті є блок <b>«Суперечності (аналіз ШІ)»<\/b> з датою перевірки або позначкою «Збережено без перевірки ШІ» (з причиною). Це підказка для розмови з PM, а не рішення: на погодження вона не впливає.<\/p>\n<p>Вирішений звіт повторно не погоджується: якщо потрібні зміни — поверніть його, і PM здасть новий. Помилково погоджений звіт виправляється лише наступним звітом PM.<\/p>\n<p>Перед рішенням портал перевіряє актуальний стан звіту: якщо його вже вирішив інший PMO — ваше рішення не збережеться (з'явиться пояснення). Звіт, автор якого вже не PM проєкту, можна лише повернути.<\/p>\n<h3>Як змінити фазу проєкту<\/h3>\n<p>Фаза (Ініціація, Планування, Реалізація, Призупинено, Скасовано, Завершено) змінюється <b>лише статус-звітом<\/b> — у картці її не редагують.<\/p>\n<ol>\n<li><b>PM<\/b> відкриває картку проєкту → <b>Додати статус-звіт<\/b>.<\/li>\n<li>У розділі <b>Ключові показники<\/b> обирає нову <b>Фазу проєкту<\/b> (за потреби змінює й дати, % виконання).<\/li>\n<li>Заповнює <b>Причина зміни показників<\/b> — чому змінюється фаза; причина потрапить в історію.<\/li>\n<li>Оцінює терміни, бюджет, ресурси, пише резюме → <b>Зберегти<\/b>. Звіт іде на погодження.<\/li>\n<li><b>PMO<\/b> погоджує звіт — фаза в картці змінюється, в історії з'являються рядки «Погодження звіту» і «Оновлено статус-звітом» («було → стало», причина). Якщо PMO повертає звіт — фаза не змінюється, PM здає новий звіт.<\/li>\n<li><b>«Завершено — перенести в архів»<\/b> або <b>«Скасовано — перенести в архів»<\/b> — після погодження проєкт отримує фазу «Завершено» або «Скасовано», «Дату завершення / скасування», «Дату завершення (факт)» і переходить на вкладку «Архів»; далі — лише перегляд.<\/li>\n<\/ol>\n<h3>Ризики та проблеми<\/h3>\n<ul>\n<li>Додати — у картці «Додати ризик / проблему» (для PM) або на вкладці «Ризики та проблеми» → «Новий ризик / проблема».<\/li>\n<li>Спочатку оберіть <b>тип<\/b> (Ризик або Проблема) — від нього залежить заголовок форми («Новий ризик» / «Нова проблема»), потім заповніть <b>опис<\/b>.<\/li>\n<li><b>Ймовірність<\/b> і <b>вплив<\/b> — від 1 до 5; <b>оцінка<\/b> = ймовірність × вплив: 15–25 — високий (червоний), 8–14 — середній (жовтий), 1–7 — низький (зелений).<\/li>\n<li><b>Стратегія реагування:<\/b> Уникнення, Зниження (пом'якшення), Передача, Прийняття (повторне натискання обраної — скасовує вибір).<\/li>\n<li><b>Заходи для зниження ризику<\/b> — що робимо зараз; <b>План дій у разі настання<\/b> — що робимо, якщо ризик станеться.<\/li>\n<li><b>Обов'язкові поля<\/b> (позначені *): для ризику — опис, «Стратегія реагування», «Заходи для зниження ризику» і «План дій у разі настання» — за будь-якої оцінки; для проблеми — опис і заходи. Порожнє значення або лише пробіли не приймаються, пояснення — біля поля.<\/li>\n<li>Вкажіть власника ризику, статус (Відкрито — помаранчева мітка, В роботі — синя, Закрито — зелена) і <b>термін виконання заходів<\/b> — не раніше сьогоднішнього дня. Прострочений термін відкритого ризику — червоний; у формі — «Термін минув»: закрийте запис або створіть копію з новим терміном.<\/li>\n<li><b>Збережений запис<\/b> змінюється лише <b>статусом<\/b> (інші поля — тільки для перегляду), щоб історія реєстру лишалась точною. Щоб змінити стратегію, заходи, оцінку чи термін — <b>«Копіювати ризик»<\/b> («Копіювати проблему»): відкриється новий запис з усіма полями, змініть потрібне й збережіть, а вихідний запис закрийте (статус «Закрито»).<\/li>\n<li>Ризики й проблеми <b>не погоджуються<\/b>: нові високі ризики (від 15) і всі проблеми, а також зміну їх статусу PMO бачить у сповіщеннях; зворотний зв'язок PMO — коментарем у картці проєкту.<\/li>\n<li>«Відображати: Високі ризики» — відкриті ризики з оцінкою від 15; «Ризики архівних проєктів» — ризики проєктів в архіві (лише перегляд).<\/li>\n<\/ul>\n<h3>Коментарі<\/h3>\n<p>Коментувати може кожен, хто бачить проєкт: у картці — розділ «Коментарі» → «Додати коментар». У проєкті в архіві — лише перегляд, нові коментарі не додаються.<\/p>\n<h3>Сповіщення<\/h3>\n<ul>\n<li>Угорі праворуч — <b>дзвіночок<\/b>. <b>Червоне число<\/b> на ньому — скільки нових для вас подій у ваших проєктах; поки є нові, дзвіночок час від часу похитується.<\/li>\n<li>Натисніть дзвіночок — відкриється <b>«Сповіщення»<\/b>: події за 14 днів, нові вгорі й виділені («Нове»), нижче — уже переглянуті. Натискання на подію відкриває картку, статус-звіт або ризик; <b>«← Сповіщення»<\/b> вгорі повертає до списку. «Лише нові» — сховати переглянуте.<\/li>\n<li>Відкрили подію — вона стає прочитаною, число зменшується. <b>«Позначити все прочитаним»<\/b> — прочитане все показане, число зникає. Саме відкриття списку нічого не позначає.<\/li>\n<li>Що бачите — за вашою роллю в проєкті: PM, власник і команда — створення проєкту, призначення, рішення PMO щодо звітів, оновлення показників, коментарі; ризики — PM і власник ризику завжди, власник і команда — лише високі (оцінка від 15); правки картки — PM і власник; PMO — подання звітів на погодження, перехід проєктів в архів, нові високі ризики (від 15) і всі проблеми, а також зміна їх статусу. Свої дії в сповіщеннях не показуються.<\/li>\n<li><b>Вас додали до команди<\/b> проєкту або змінили вашу роль у ній — окреме сповіщення лише для вас: «Вас додано до команди» / «Змінено вашу роль у команді» з вашою роллю; натискання відкриває картку. З'являється разом із правами, протягом ~15 хвилин. Про вилучення з команди сповіщення немає — проєкт просто зникає з вашого списку.<\/li>\n<li><b>Ваш відгук розглянуто<\/b> — сповіщення «Відгук розглянуто»: номер відгуку, статус і відповідь; натискання відкриває відгук. Нова відповідь на той самий відгук — нове сповіщення.<\/li>\n<li><b>Новий випуск порталу<\/b> — сповіщення для всіх із номером версії; натискання відкриває «Що змінилося».<\/li>\n<li>Новому учасникові сповіщення з'являються протягом ~15 хвилин; події, що були до цього, новими не вважаються.<\/li>\n<\/ul>\n<h3>Новий проєкт і редагування<\/h3>\n<ul>\n<li><b>Новий проєкт<\/b> створює PMO: назва (унікальна — двох проєктів з однаковою назвою не буде) і PM обов'язкові (PM не підставляється автоматично — оберіть його); номер проєкту система призначає сама за порядком (PRJ-001, PRJ-002…) — він унікальний і вручну не змінюється.<\/li>\n<li>Протягом ~15 хвилин після створення проєкт <b>готується<\/b> (у картці — «Проєкт готується»): після цього PM може додавати звіти, ризики й учасників команди.<\/li>\n<li><b>Редагувати проєкт<\/b> може лише PM: назва, напрям, пріоритет, бюджет, опис, <b>батьківський проєкт<\/b> (будь-який проєкт, крім самого себе і своїх дочірніх; його задає й PMO при створенні), а також:<\/li>\n<\/ul>\n<p>- <b>Команда проєкту<\/b> — «+ Додати учасника»: людина, <b>роль<\/b> (обов'язково) і з яких питань звертатися; × — прибрати учасника; - <b>Посилання<\/b> — «+ Додати посилання»: назва й адреса (починається з <code>https://<\/code>); × — прибрати.<\/p>\n<ul>\n<li><b>«Мета та опис»<\/b> обов'язкове при збереженні картки PM (і в раніше створених проєктах — при наступному збереженні): коротко мета проєкту й очікуваний результат. Новий проєкт PMO може створити без опису — його допише PM.<\/li>\n<li><b>Тип і пріоритет — різні речі.<\/b> <b>Тип<\/b> («Стратегічний» / «Звичайний») — значущість проєкту для компанії; задається при створенні, далі змінюється лише статус-звітом. <b>Пріоритет<\/b> («1 — Високий» … «3 — Низький») — черговість виділення ресурсів зараз; його змінює PM у картці (поле поруч із напрямом). Стратегічний проєкт може тимчасово мати й низький пріоритет — це не помилка.<\/li>\n<li>Фаза, стан, дати й витрати — лише через статус-звіт (див. «Як змінити фазу проєкту»).<\/li>\n<li>Після зміни команди права доступу перераховуються автоматично <b>протягом ~15 хвилин<\/b>: тоді учасник бачить проєкт у своєму списку й у «Доступ до картки» і може коментувати.<\/li>\n<li><b>PM і власника<\/b> після створення змінює лише PMO: у картці — <b>«Змінити PM / власника»<\/b> (новий PM, новий власник — порожнє поле без змін, причина обов'язкова). Зміна одразу видна в картці й в «Історії змін» («Призначення»), остаточно переноситься синхронізацією протягом ~15 хвилин; поки вона не оброблена, нову зміну подати не можна. Звіт колишнього PM «на погодженні» повертається автоматично.<\/li>\n<li>Після <b>зміни PM<\/b> колишній PM одразу не може змінювати проєкт; новий PM бачить «Ви призначені PM цього проєкту: права редагування з'являться протягом 15 хвилин» — сторінка оновиться сама.<\/li>\n<\/ul>\n<h3>Архів<\/h3>\n<p>Вкладка «Архів» — проєкти з фазою <b>Завершено<\/b> або <b>Скасовано<\/b> (колонка «Фаза проєкту») з датою завершення / скасування, лише перегляд (без нових коментарів). Ризики цих проєктів — «Ризики та проблеми» → «Відображати: Ризики архівних проєктів». Навігація — як у «Проєкти»: <b>Список<\/b> або <b>Плитки<\/b>, «Відображати» (Усі проєкти, <b>Завершені<\/b>, <b>Скасовані<\/b>, Стратегічні, Мої проєкти, Я PM), CSV і вибір колонок; на плитці — дата завершення / скасування.<\/p>\n<h3>Мова і тема<\/h3>\n<p>Угорі справа: <b>UA / EN / RU<\/b> і світла ☀ / темна ☾ тема. На телефоні — у меню під вашим аватаром (шапка там в один ряд). Вибір запам'ятовується в цьому браузері. Значення (статуси, стани, типи, пріоритети, напрями, погодження) і назви у «Відображати» перекладаються разом з інтерфейсом; зміст записів — як його ввели.<\/p>\n<h3>Коли видно зміни<\/h3>\n<p>Збережене у формах видно на екрані одразу; рішення PMO по звіту — теж одразу. Права доступу (зокрема для нових учасників команди), історія змін і «Доступ до картки» оновлюються автоматично протягом ~15 хвилин.<\/p>\n<p>Перед кожним збереженням портал перевіряє актуальні дані: якщо за цей час змінився PM, проєкт перейшов в архів, по проєкту вже є звіт на погодженні або запис змінив інший користувач — збереження не відбудеться, з'явиться пояснення, а дані оновляться. Відкрита сторінка сама оновлює дані, коли ви повертаєтеся на вкладку, і кожні 5 хвилин. Щоб оновити дані одразу (наприклад, на телефоні), натисніть <b>↻ «Оновити дані»<\/b> над списком — поруч із «CSV».<\/p>\n<h3>Відгук<\/h3>\n<p>Вкладка <b>Відгуки<\/b> → <b>Залишити відгук<\/b> (або кнопка «Відгук» у «Довідці»): опишіть, що не так або що покращити, і додайте до 5 скриншотів:<\/p>\n<ul>\n<li>на комп'ютері — зробіть знімок екрана і вставте його у форму: <b>Ctrl+V<\/b> (Windows) або <b>Cmd+V<\/b> (Mac); або «Додати скриншот»;<\/li>\n<li>на телефоні й планшеті — «Додати скриншот» → галерея або камера.<\/li>\n<\/ul>\n<p>Пристрій додається сам; у тексті вкажіть, на якому екрані помітили проблему.<\/p>\n<p>Вкладка <b>Відгуки<\/b> — усі відгуки учасників: номер (#46 — так на відгук посилаються у відповідях), текст, автор, статус розгляду (Новий, Прийнято, Зроблено, Прокоментовано, Відхилено) і відповідь розробників. Скриншоти бачать лише автор і розробники. Статус і відповідь ставлять розробники рішення. У вікні відгуку стрілки <b>‹ ›<\/b> біля номера — попередній і наступний відгук у тому порядку, що в таблиці (з урахуванням фільтрів і сортування).<\/p>\n<h3>Завдання для фокус-групи<\/h3>\n<p>Виконайте, що стосується вашої ролі, і після кожного завдання залиште <b>відгук<\/b>: що було незрозуміло, незручно або не спрацювало.<\/p>\n<ol>\n<li>Відкрийте портал на комп'ютері й на телефоні. Чи зрозуміло з головної, що відбувається з портфелем? Натисніть показники і клітинку карти ризиків.<\/li>\n<li>Знайдіть свої проєкти («Відображати: Мої проєкти (усі)» або «Я PM»). Чи всі ваші проєкти на місці і чи немає зайвих?<\/li>\n<li>Відкрийте картку проєкту: команда, посилання, терміни, історія змін, доступ. Чого бракує?<\/li>\n<li><b>PM:<\/b> додайте в команду учасника з роллю і посилання на документ.<\/li>\n<li><b>PM:<\/b> здайте статус-звіт зі зміною дати завершення (з причиною) і переконайтеся, що картка чекає на погодження.<\/li>\n<li><b>PMO:<\/b> погодьте один звіт зі зміною оцінки (з коментарем), інший — поверніть на доопрацювання.<\/li>\n<li><b>PM:<\/b> за повернутим звітом здайте новий («Новий звіт на основі повернутого»).<\/li>\n<li><b>PM:<\/b> додайте ризик зі стратегією реагування, заходами і планом дій у разі настання.<\/li>\n<li><b>Усі:<\/b> додайте коментар до проєкту, де ви власник або в команді; перегляньте вкладку «Відгуки».<\/li>\n<li>Перемкніть мову й тему; надішліть відгук зі скриншотом із телефону.<\/li>\n<\/ol>\n<h3>Детальний огляд системи<\/h3>\n<p>Угорі «Довідки» — <b>версія порталу<\/b> й дата випуску та <b>Що змінилося →<\/b>: нові можливості й виправлення поточного випуску, номери реалізованих відгуків (натисніть номер — відкриється відгук), що перевірити повторно, і попередні випуски.<\/p>\n<p>Наприкінці «Довідки» — кнопка <b>Детальний огляд системи<\/b>: навіщо портал, з чого складається, усі екрани зі скриншотами, правила погодження й безпека. Огляд відкривається в порталі (українською); там же — <b>Завантажити PDF<\/b>, щоб зберегти чи роздрукувати.<\/p>","<h3>What it is<\/h3>\n<p>A portal where the company keeps all its projects in one place:<\/p>\n<ul>\n<li>every project has a <b>card<\/b>: team, links, timeline, budget, health, change history, comments, status reports and risks;<\/li>\n<li>the PM regularly submits a <b>status report<\/b> — it is the only way to change the project's key indicators (phase, health, % complete, dates, costs);<\/li>\n<li><b>the PMO approves<\/b> every status report: a report reaches the card only after approval;<\/li>\n<li>project <b>risks and issues<\/b> are scored as \"probability × impact\", and each gets a response strategy;<\/li>\n<li>the <b>home page<\/b> shows the state of the portfolio: key figures, the risk map, schedule slips, upcoming go-lives, the portfolio by department.<\/li>\n<\/ul>\n<p>Everyone sees only the projects where they or their direct reports have a role.<\/p>\n<h3>How to open<\/h3>\n<ul>\n<li><b>Computer:<\/b> open <code>https://smarthrua.sharepoint.com/sites/pmo-test<\/code> in a browser and sign in with your Microsoft 365 work account.<\/li>\n<li><b>Phone and tablet (iPhone, iPad, Android):<\/b> the same address in Safari or Chrome. To open it like an app: in Safari — Share → \"Add to Home Screen\", in Chrome — menu ⋮ → \"Add to Home screen\".<\/li>\n<li><b>The SharePoint mobile app<\/b> may not show the portal fully — use the browser in that case. The SharePoint menu above the portal is hidden: everything is done in the portal tabs.<\/li>\n<\/ul>\n<p>The menu tabs have icons, each section in its own colour. On a phone only the icons remain (the name is in the tooltip).<\/p>\n<p>This guide is always available under the <b>?<\/b> button at the top of the portal.<\/p>\n<h3>Who sees what and can do what<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Who<\/th><th>Sees<\/th><th>Can<\/th><\/tr><\/thead><tbody><tr><td>Project PM<\/td><td>own project<\/td><td>edit the card (team, links), submit status reports, manage risks, comment<\/td><\/tr><tr><td>The PM's managers (org chart)<\/td><td>projects of their reports<\/td><td>view and comment<\/td><\/tr><tr><td>Owner, project team and their managers<\/td><td>projects where they or their reports have a role<\/td><td>view and comment<\/td><\/tr><tr><td>PMO<\/td><td>all projects<\/td><td>create new projects, approve or return status reports, view and comment<\/td><\/tr><tr><td>Other employees<\/td><td>an empty portal<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p>An archived project is view-only for everyone. If the portal is empty for you, you have no role in any project.<\/p>\n<h3>Home<\/h3>\n<ul>\n<li><b>Key figures strip<\/b> at the top: active projects; the share of projects with a recent report (no older than 14 days); for the PMO — reports awaiting approval; high risks (open, score 15 and above); overdue projects (the plan date has passed but the project is open). Click a figure to open the filtered list.<\/li>\n<li><b>Portfolio by health<\/b> — a ring: how many active projects are green, yellow, red and not rated yet; <b>Portfolio health over time<\/b> — how health changed over the last 12 weeks: every project as of the snapshot date by its latest approved report, grey — no approved report yet; today's column matches the ring.<\/li>\n<li><b>Risk map<\/b> 5 × 5: rows are probability, columns are impact, each cell shows the number of open risks. Click a cell to list its risks below the map.<\/li>\n<li><b>Portfolio by department<\/b> — active projects of each department broken down by health; the number inside each coloured part of the bar is how many projects are in that state.<\/li>\n<li><b>Biggest schedule slips<\/b> — the three projects whose forecast completion is later than planned: by how many days and how many times the plan was moved. <b>Go-lives in the next 7 days<\/b> — go-live date, health, PM.<\/li>\n<li>Below — <b>Projects at risk<\/b>, <b>No recent status report<\/b>, <b>Management decisions needed<\/b>, <b>Open risks<\/b>; \"See all\" opens the full list.<\/li>\n<\/ul>\n<p>Everything is counted only over the projects you can see (excluding the archive).<\/p>\n<h3>Projects<\/h3>\n<ul>\n<li><b>Tiles<\/b> or <b>List<\/b> — the switch at the top. Tiles are handier on a phone.<\/li>\n<li><b>Show:<\/b> All projects, Strategic, At risk, My projects (all) — where I am PM, owner or on the team, <b>I am PM<\/b> — only projects where I am the PM, No recent report, Overdue.<\/li>\n<li><b>In the list:<\/b> click a column header to sort; the funnel ▽ filters by value; the gear ⚙ chooses and orders columns (↑ / ↓); on a computer, drag a column header's edge to change its width — it is remembered for each list, \"Reset column widths\" is in the gear menu; <b>CSV<\/b> exports the table as shown (the file opens in Excel). New records are on top. On a phone, status reports and risks are shown as cards (sorting and filters set on a computer apply there too).<\/li>\n<li><b>A long list<\/b> scrolls in its own window: column headers stay at the top, the horizontal scroll bar is always at the bottom of the visible part of the table, so the right-hand columns of the first rows are visible without scrolling the page down. On the phone — as before, without a separate window.<\/li>\n<li><b>Filters<\/b> (funnel and \"Show\") apply while you stay on the page: switching to another tab resets them to the defaults (column choice and sorting are remembered). Column widths do not change with filters.<\/li>\n<li><b>\"Report\" column<\/b> — the date of the last approved report, with the approval of the newest report below it (for \"Awaiting approval\" and \"Returned\" — also the report date on its own line). Hover the label to see when and by whom the report was submitted. The column filter (⏷): by freshness and by approval — \"Approved\", \"Awaiting approval\", \"Returned\", \"No reports submitted\".<\/li>\n<li><b>Project phase<\/b> (life-cycle stage) is a coloured label: Initiation — purple, Planning — blue, Execution — green, On hold — orange, Completed — green, Cancelled — grey. The dot next to it is the project health (green, yellow, red, grey — not rated).<\/li>\n<li><b>Colours:<\/b> a red completion date means the deadline has passed and the project is still open. The dot in the \"Report\" column is the freshness of the last approved report: green — up to 8 days, yellow — 9–14, red — over 14, grey — no approved reports yet (hover over the dot to see how many days old the report is). Below the date is the <b>approval of the newest report<\/b>: \"Approved\", \"Awaiting approval\" or \"Returned\" (for the last two — the report date).<\/li>\n<\/ul>\n<h3>Project card<\/h3>\n<p>Click a project and its card opens on the right (full screen on a phone). Every side panel has a <b>coloured label<\/b> at the top showing what is open: Project, Status report, Risk, Issue, Assignment, Notifications, Feedback, Help — the same wherever you opened it from.<\/p>\n<ul>\n<li>at the top — type, health, phase, priority and <b>Links<\/b> (Loop, documents, etc.); <b>Add status report<\/b> and <b>Edit project<\/b> buttons (PM only);<\/li>\n<li><b>Parent project<\/b> and <b>Child projects<\/b> — a link between projects (any nesting); click a name to open the project. The link grants no access: child projects show only if you can see them; a parent you cannot open shows its name without a link. «Projects» has a <b>Parent project<\/b> column (⚙ — column picker).<\/li>\n<li><b>Goal and description<\/b> — up to 10 lines (line breaks are kept); a longer text — <b>Show all<\/b> / <b>Collapse<\/b>.<\/li>\n<li>approval notes: \"Status report of … is awaiting PMO approval\" or \"Report of … returned for rework\" with the PMO's comment;<\/li>\n<li><b>Stakeholders<\/b>: PM, owner and <b>Project team<\/b> — a table: member, role, what to contact them about;<\/li>\n<li><b>Timeline<\/b> (with the forecast deviation), <b>Budget and progress<\/b> (amounts in US dollars);<\/li>\n<li><b>Change history<\/b> — who changed what and when: \"old → new\", the reason (including PMO decisions — \"Report approval\"); also <b>report submissions<\/b> (\"Report submitted\", including \"New report based on the returned one\") and <b>risks and issues<\/b> (\"Added\", field changes, \"Closed\") — with an \"Open report\" / \"Open risk\" link. These events appear after synchronization (~15 minutes);<\/li>\n<li><b>Comments<\/b> — the feed and \"Add comment\";<\/li>\n<li><b>Health history<\/b> — ratings from the latest reports;<\/li>\n<li><b>Status reports<\/b> — the three latest, with the approval mark; <b>Show all reports (N)<\/b> — all of them, <b>Collapse<\/b> — three again; click the date or summary to open a report; <b>Risks and issues<\/b>;<\/li>\n<li><b>Card access<\/b> — who sees the project and with what rights.<\/li>\n<\/ul>\n<p>You can share a link to the card: the browser address points exactly to it.<\/p>\n<h3>Status report (for the PM)<\/h3>\n<ol>\n<li>In the card — <b>Add status report<\/b> (or the \"Status reports\" tab → \"New status report\"). A project can have <b>only one report awaiting approval<\/b>: until the PMO decides, the button is hidden and the card says \"The report from … is awaiting PMO approval\". Opened from the card, the form is for that project — you cannot switch the project there. In the general form, projects with a report awaiting approval cannot be selected (marked \"report of … awaiting approval\").<\/li>\n<li>The <b>submission date<\/b> is the day you save the report — nothing to pick. The <b>period<\/b> is calculated automatically: from the date of the project's last approved report (if there is none — from the start date) to the submission date, e.g. \"06.10.2026 – 08.10.2026\".<\/li>\n<li>Rate <b>schedule, budget and resources<\/b>: green, yellow, red. <b>Overall health<\/b> is calculated automatically — the worst of the three.<\/li>\n<li><b>Key indicators<\/b> are prefilled with the current values. Change only what has changed: phase, % complete (a whole number from 0 to 100), type, dates, actual costs (amounts are shown with spaces between thousands: 1 450 000). Launch, planned end and forecast dates cannot be earlier than the start date. For \"Completed — move to archive\", % complete becomes 100 and cannot be changed. Enter dates as dd.mm.yyyy (dots are added automatically) or pick them in the calendar — the button on the right of the field. For \"Completed\" or \"Cancelled\" — the <b>actual completion date<\/b>: not earlier than the start date and not later than the submission date (the portal explains next to the field which date it compared with); enter a future completion as the forecast, an early one is fine.<\/li>\n<li>If you changed the phase, type or a date, fill in <b>Reason for changing indicators<\/b> (required, goes to the history).<\/li>\n<li>A <b>One-line summary<\/b> (required), what was done, the plan, <b>issues and risks for the period<\/b> — briefly, what got in the way (the project's risk and issue register is separate, in the card, «Risks and issues» block). <b>Management decision needed<\/b> — tick it if further work needs a decision beyond the PM's authority: e.g. approving an additional budget, changing priorities or resolving a resource conflict. Then <b>Decision required<\/b> is mandatory: state which decision is needed and what happens without it. A regular PMO approval of the status report does not need this tick.<\/li>\n<li><b>Save.<\/b> If something is missing or entered incorrectly, the portal highlights all such fields at once and explains next to the field what is wrong. The report goes <b>to the PMO for approval<\/b>; the card updates after approval. A submitted report cannot be changed.<\/li>\n<li>If the PMO <b>returned<\/b> the report, the PMO's comment is shown in the card and in the report itself. Click <b>New report based on the returned one<\/b>: the form is filled with the returned report's data — fix it and save.<\/li>\n<li>A report is <b>returned automatically<\/b> if the project PM changed before the PMO decision (the new PM submits a current report) or the project moved to the archive — the comment explains why.<\/li>\n<\/ol>\n<p>The <b>\"Completed — move to archive\"<\/b> and <b>\"Cancelled — move to archive\"<\/b> phase options send the project to the archive once the report is approved — after that the project is view-only. They require the <b>\"Actual completion date\"<\/b> — when the project was actually completed or cancelled: not before the start date and not after the report date.<\/p>\n<h3>AI assistant (pilot)<\/h3>\n<p>Pilot participants have an AI assistant (Microsoft Copilot Studio) in the status report form. It suggests but does not decide: the report and ratings are the PM's responsibility and are approved by the PMO.<\/p>\n<ol>\n<li><b>Turning it on.<\/b> Click your avatar at the top right → the <b>«AI assistant»<\/b> switch. The first time, the portal shows which data goes to AI — click <b>«Allow»<\/b> (we ask once). Turned off — the report form works without AI again; you can turn it back on any time without allowing again. The setting is kept for you, not for the browser: turned on on your phone — it is on on your computer too. On a computer, a Microsoft sign-in window opens (if the browser blocked it, allow pop-ups for the site); on a phone, the portal goes to the Microsoft sign-in page and comes back, and turning on finishes by itself. If it fails, the reason is shown under the switch. If <b>«Sign in»<\/b> appears in the report form on a phone, sign in to Microsoft again while the form is empty (entered data will not be kept).<\/li>\n<li><b>«Fill with AI»<\/b> (at the top of the form) drafts the report from project data: «One-line summary», «Done this period», «Plan for next period», «Issues and risks for the period». Empty fields are filled at once, filled ones only after you click «Replace». <b>«Undo AI insert»<\/b> restores the texts until you change them. The <b>«AI hints»<\/b> panel shows what not to forget (items of the previous plan, overdue actions, high risks, a decision request) and suggested ratings: a rating changes only if you click <b>«Accept»<\/b>. Review and correct the texts — it is a draft.<\/li>\n<li><b>«Check with AI»<\/b> (instead of «Save»). First the usual form checks; then the <b>«Contradictions (AI analysis)»<\/b> field (read-only) lists items, each naming the field to fix:<\/li>\n<\/ol>\n<p>- the portal compares dates and amounts itself: green «Schedule» but the forecast is later than the plan or actions are overdue; green «Budget» but the cost exceeds the project budget; «Management decision needed» without a description; a reduced «% complete»; - AI checks the content: whether high risks and issues from the register are mentioned with actions, whether the previous plan items and decision request are reflected, whether the summary contradicts the ratings, whether a phase or date change is explained, whether the PMO comment on a returned report is addressed. Under an item about a register record — <b>«Show record»<\/b> and <b>«Add a mention»<\/b>: a line with the actions from the register is added to «Issues and risks for the period».<\/p>\n<ol>\n<li>Changed the report — the button is <b>«Check with AI»<\/b> again. No changes — <b>«Save»<\/b>: the report is saved with the check result, even if you disagree with the items.<\/li>\n<li><b>AI did not respond<\/b> (no connection, limit reached, no access) — the reason and a <b>«Save without check»<\/b> button appear: submitting a report does not depend on AI, and the PMO sees «AI check not performed: …». Change the report to try again. On the test site the failure is also recorded in «Feedback» automatically (technical data only, without the report text) so that we can find the cause.<\/li>\n<li><b>What data goes to AI<\/b> — this project only: indicators, recent approved reports, risk and issue register records, the form text; no e-mails or team. Processing — Microsoft Copilot Studio (Europe; the model may process data outside it).<\/li>\n<\/ol>\n<h3>Approving status reports (for the PMO)<\/h3>\n<ol>\n<li>Reports waiting for you: the \"Awaiting approval\" figure on the home page and \"Status reports\" → \"Show: Awaiting approval\".<\/li>\n<li>Open the report: ratings, the key indicators it changes, what was done, the plan, issues.<\/li>\n<li>In the <b>Report approval<\/b> block:<\/li>\n<\/ol>\n<p>- <b>Approve<\/b> — the report reaches the card with the PM's ratings; - change the schedule, budget or resources rating and click <b>Approve with changed ratings<\/b> — your rating reaches the card; a comment is required; - <b>Return for rework<\/b> — the card does not change, the PM sees your comment (required).<\/p>\n<ol>\n<li>The PMO changes only the ratings; the report itself (texts, dates, phase) stays unchanged. The decision is recorded in the project's change history (\"Report approval\": \"old → new\", your comment).<\/li>\n<\/ol>\n<p>If the AI assistant checked the report, it has a <b>«Contradictions (AI analysis)»<\/b> block with the check date or «Saved without AI check» (with the reason). It is a hint for the conversation with the PM, not a decision: it does not affect the approval.<\/p>\n<p>A decided report cannot be approved again: if changes are needed, return it and the PM will submit a new one. A report approved by mistake can only be corrected by the PM's next report.<\/p>\n<p>Before a decision the portal checks the report's current state: if another PMO has already decided it, your decision is not saved (you see why). A report whose author is no longer the project PM can only be returned.<\/p>\n<h3>How to change the project phase<\/h3>\n<p>The phase (Initiation, Planning, Execution, On hold, Cancelled, Completed) changes <b>only through a status report<\/b> — it is not edited in the card.<\/p>\n<ol>\n<li><b>The PM<\/b> opens the project card → <b>Add status report<\/b>.<\/li>\n<li>In <b>Key indicators<\/b> chooses the new <b>Project phase<\/b> (and changes dates and % complete if needed).<\/li>\n<li>Fills in <b>Reason for changing indicators<\/b> — why the phase changes; the reason goes to the history.<\/li>\n<li>Rates schedule, budget, resources, writes the summary → <b>Save<\/b>. The report goes for approval.<\/li>\n<li><b>The PMO<\/b> approves the report — the phase in the card changes, and \"Report approval\" and \"Updated by status report\" rows appear in the history (\"old → new\", the reason). If the PMO returns the report, the phase does not change and the PM submits a new report.<\/li>\n<li><b>\"Completed — move to archive\"<\/b> or <b>\"Cancelled — move to archive\"<\/b> — after approval the project gets the \"Completed\" or \"Cancelled\" phase, the \"Completed / cancelled on\" date and the \"Actual completion date\" and moves to the \"Archive\" tab; after that it is view-only.<\/li>\n<\/ol>\n<h3>Risks and issues<\/h3>\n<ul>\n<li>Add one from the card (\"Add risk / issue\", PM only) or on the \"Risks and issues\" tab → \"New risk / issue\".<\/li>\n<li>First choose the <b>type<\/b> (Risk or Issue) — the form title follows it (\"New risk\" / \"New issue\"), then fill in the <b>description<\/b>.<\/li>\n<li><b>Probability<\/b> and <b>impact<\/b> are 1 to 5; the <b>score<\/b> = probability × impact: 15–25 — high (red), 8–14 — medium (yellow), 1–7 — low (green).<\/li>\n<li><b>Response strategy:<\/b> Avoid, Reduce (mitigate), Transfer, Accept (clicking the selected one again clears the choice).<\/li>\n<li><b>Risk reduction actions<\/b> — what we do now; <b>Contingency plan<\/b> — what we do if the risk occurs.<\/li>\n<li><b>Required fields<\/b> (marked *): for a risk — the description, \"Response strategy\", \"Risk reduction actions\" and \"Contingency plan\" — at any score; for an issue — the description and actions. Empty values or spaces only are not accepted; the explanation is shown next to the field.<\/li>\n<li>Set the risk owner, status (Open — orange label, In progress — blue, Closed — green) and the <b>Mitigation due date<\/b> — not earlier than today. An overdue open risk is shown in red; the form says \"The due date has passed\": close the record or create a copy with a new due date.<\/li>\n<li>In a <b>saved record<\/b> only the <b>status<\/b> can be changed (other fields are view-only), so the register history stays accurate. To change the strategy, actions, score or due date — <b>\"Copy risk\"<\/b> (\"Copy issue\"): a new record opens with all fields; change what you need and save, then close the original (status \"Closed\").<\/li>\n<li>Risks and issues are <b>not approved<\/b>: the PMO sees new high risks (15+) and all issues, and their status changes, in notifications; PMO feedback — as a comment in the project card.<\/li>\n<li>\"Show: High risks\" — open risks with a score of 15 and above; \"Risks of archived projects\" — risks of archived projects (view-only).<\/li>\n<\/ul>\n<h3>Comments<\/h3>\n<p>Anyone who sees the project can comment: in the card — \"Comments\" → \"Add comment\". An archived project is view-only: no new comments.<\/p>\n<h3>Notifications<\/h3>\n<ul>\n<li>At the top right there is a <b>bell<\/b>. A <b>red number<\/b> on it shows how many new events there are for you in your projects; while there are new ones, the bell sways now and then.<\/li>\n<li>Click the bell to open <b>\"Notifications\"<\/b>: events for 14 days, new ones at the top and highlighted (\"New\"), already seen ones below. Clicking an event opens the card, status report or risk; <b>\"← Notifications\"<\/b> at the top takes you back to the list. \"Only new\" hides what you have seen.<\/li>\n<li>Opening an event marks it as read and the number goes down. <b>\"Mark all as read\"<\/b> marks everything shown as read and the number disappears. Just opening the list marks nothing.<\/li>\n<li>What you see depends on your role in the project: the PM, owner and team see project creation, assignments, PMO decisions on reports, indicator updates and comments; risks — the PM and the risk owner always, the owner and team only high ones (score 15 and above); card edits — the PM and the owner; the PMO sees reports submitted for approval, projects moved to the archive, new high risks (15+) and all issues, and their status changes. Your own actions are not shown.<\/li>\n<li><b>You were added to a project team<\/b> or your role in it changed — a separate notification only for you: \"You were added to the team\" / \"Your team role was changed\" with your role; clicking it opens the card. It appears together with the access rights, within ~15 minutes. There is no notification about removal from a team — the project simply disappears from your list.<\/li>\n<li><b>Your feedback was reviewed<\/b> — the \"Feedback reviewed\" notification: the item number, status and answer; clicking it opens the item. A new answer to the same item — a new notification.<\/li>\n<li><b>New portal release<\/b> — a notification for everyone with the version number; clicking it opens \"What's new\".<\/li>\n<li>For a new participant notifications appear within ~15 minutes; earlier events are not treated as new.<\/li>\n<\/ul>\n<h3>New project and editing<\/h3>\n<ul>\n<li>A <b>New project<\/b> is created by the PMO: the name (unique — no two projects share a name) and the PM are required (the PM is not prefilled — choose one); the project number is assigned by the system in order (PRJ-001, PRJ-002…) — it is unique and cannot be changed by hand.<\/li>\n<li>For ~15 minutes after creation the project is <b>being prepared<\/b> (the card says \"The project is being prepared\"): after that the PM can add reports, risks and team members.<\/li>\n<li>Only the PM can <b>Edit project<\/b>: name, department, priority, budget, description, <b>parent project<\/b> (any project except itself and its own children; the PMO also sets it when creating), and also:<\/li>\n<\/ul>\n<p>- <b>Project team<\/b> — \"+ Add member\": a person, their <b>role<\/b> (required) and what to contact them about; × removes the member; - <b>Links<\/b> — \"+ Add link\": a name and an address (starting with <code>https://<\/code>); × removes it.<\/p>\n<ul>\n<li><b>«Goal and description»<\/b> is required when the PM saves the card (including projects created earlier — at the next save): briefly, the project goal and the expected result. The PMO can create a new project without a description — the PM adds it.<\/li>\n<li><b>Type and priority are different things.<\/b> <b>Type<\/b> («Strategic» / «Regular») is the project's importance to the company; it is set at creation and then changes only through a status report. <b>Priority<\/b> («1 — High» … «3 — Low») is the current order of resource allocation; the PM changes it in the card (the field next to the department). A strategic project may temporarily have a low priority — this is not an error.<\/li>\n<li>Phase, health, dates and costs change only through a status report (see \"How to change the project phase\").<\/li>\n<li>After the team changes, access rights are recalculated automatically <b>within ~15 minutes<\/b>: then the person sees the project in their list and in «Card access» and can comment.<\/li>\n<li>After the project is created, only the PMO changes the <b>PM and the owner<\/b>: in the card — <b>\"Change PM / owner\"<\/b> (new PM, new owner — an empty field means no change, the reason is required). The change shows in the card and in the \"Change history\" (\"Assignment\") right away and is finally applied by synchronization within ~15 minutes; until then a new change cannot be submitted. A report of the former PM that is pending approval is returned automatically.<\/li>\n<li>After a <b>PM change<\/b> the former PM can no longer change the project right away; the new PM sees \"You are assigned as PM of this project: edit access appears within 15 minutes\" — the page refreshes by itself.<\/li>\n<\/ul>\n<h3>Archive<\/h3>\n<p>The \"Archive\" tab lists projects with the <b>Completed<\/b> or <b>Cancelled<\/b> phase (the \"Project phase\" column) and their completion / cancellation date, view-only (no new comments). Their risks — \"Risks and issues\" → \"Show: Risks of archived projects\". Navigation is the same as in \"Projects\": <b>List<\/b> or <b>Tiles<\/b>, \"Show\" (All projects, <b>Completed<\/b>, <b>Cancelled<\/b>, Strategic, My projects, I am PM), CSV and column choice; tiles show the completion / cancellation date.<\/p>\n<h3>Language and theme<\/h3>\n<p>Top right: <b>UA / EN / RU<\/b> and the light ☀ / dark ☾ theme. On a phone — in the menu under your avatar (the header is a single row there). The choice is remembered in this browser. Values (statuses, health, types, priorities, departments, approval) and the names in \"Show\" are translated with the interface; record content stays as entered.<\/p>\n<h3>When changes appear<\/h3>\n<p>Anything you save in the forms appears on screen immediately; so do PMO decisions on reports. Access rights (including for new team members), the change history and \"Card access\" update automatically within ~15 minutes.<\/p>\n<p>Before every save the portal checks the current data: if meanwhile the PM changed, the project moved to the archive, the project already has a report awaiting approval or another user changed the record — nothing is saved, you see an explanation and the data refreshes. An open page refreshes its data when you return to the tab and every 5 minutes. To refresh the data right away (for example, on a phone), press <b>↻ «Refresh data»<\/b> above the list — next to «CSV».<\/p>\n<h3>Feedback<\/h3>\n<p>The <b>Feedback<\/b> tab → <b>Leave feedback<\/b> (or the \"Feedback\" button in Help): describe what is wrong or what could be better and add up to 5 screenshots:<\/p>\n<ul>\n<li>on a computer — take a screenshot and paste it into the form: <b>Ctrl+V<\/b> (Windows) or <b>Cmd+V<\/b> (Mac); or use \"Add screenshot\";<\/li>\n<li>on a phone or tablet — \"Add screenshot\" → gallery or camera.<\/li>\n<\/ul>\n<p>Your device is added automatically; in the text, say on which screen you noticed the problem.<\/p>\n<p>The <b>Feedback<\/b> tab lists all participants' feedback: the number (#46 — answers refer to feedback by it), the text, the author, the review status (New, Accepted, Done, Commented, Rejected) and the developers' answer. Screenshots are visible only to the author and the developers. The status and the answer are set by the solution's developers. In the feedback window the <b>‹ ›<\/b> arrows next to the number go to the previous and next feedback in the table's order (with its filters and sorting).<\/p>\n<h3>Tasks for the focus group<\/h3>\n<p>Do what applies to your role and after each task leave <b>feedback<\/b>: what was unclear, inconvenient or did not work.<\/p>\n<ol>\n<li>Open the portal on a computer and on a phone. Is it clear from the home page what is happening with the portfolio? Click the key figures and a risk map cell.<\/li>\n<li>Find your projects (\"Show: My projects (all)\" or \"I am PM\"). Are all your projects there, and nothing extra?<\/li>\n<li>Open a project card: team, links, timeline, change history, access. What is missing?<\/li>\n<li><b>PM:<\/b> add a team member with a role and a link to a document.<\/li>\n<li><b>PM:<\/b> submit a status report that changes the completion date (with a reason) and check that the card is waiting for approval.<\/li>\n<li><b>PMO:<\/b> approve one report with a changed rating (with a comment) and return another one for rework.<\/li>\n<li><b>PM:<\/b> submit a new report from the returned one (\"New report based on the returned one\").<\/li>\n<li><b>PM:<\/b> add a risk with a response strategy, risk reduction actions and a contingency plan.<\/li>\n<li><b>Everyone:<\/b> add a comment to a project where you are the owner or on the team; look through the \"Feedback\" tab.<\/li>\n<li>Switch the language and theme; send feedback with a screenshot from your phone.<\/li>\n<\/ol>\n<h3>Detailed system overview<\/h3>\n<p>At the top of Help — the <b>portal version<\/b> and release date and <b>What's new →<\/b>: new features and fixes of the current release, numbers of implemented feedback items (click a number to open the item), what to re-check, and earlier releases.<\/p>\n<p>At the end of Help there is a <b>Detailed system overview<\/b> button: why the portal exists, what it consists of, every screen with screenshots, approval rules and security. The overview opens in the portal (in Ukrainian); <b>Download PDF<\/b> there saves or prints it.<\/p>","<h3>Что это<\/h3>\n<p>Портал, где компания ведёт все проекты в одном месте:<\/p>\n<ul>\n<li>у каждого проекта есть <b>карточка<\/b>: команда, ссылки, сроки, бюджет, состояние, история изменений, комментарии, статус-отчёты и риски;<\/li>\n<li>PM регулярно сдаёт <b>статус-отчёт<\/b> — только через него меняются ключевые показатели проекта (фаза, состояние, % выполнения, даты, затраты);<\/li>\n<li><b>PMO согласует<\/b> каждый статус-отчёт: в карточку отчёт попадает только после согласования;<\/li>\n<li><b>риски и проблемы<\/b> проекта оцениваются как «вероятность × влияние», для каждого выбирается с
