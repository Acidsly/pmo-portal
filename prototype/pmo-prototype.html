тратегия реагирования;<\/li>\n<li><b>главная<\/b> показывает состояние портфеля: ключевые показатели, карту рисков, сдвиги сроков, ближайшие запуски, портфель по направлениям.<\/li>\n<\/ul>\n<p>Каждый видит только те проекты, где роль есть у него самого или у его подчинённых.<\/p>\n<h3>Как открыть<\/h3>\n<ul>\n<li><b>Компьютер:<\/b> откройте в браузере <code>https://smarthrua.sharepoint.com/sites/pmo-test<\/code> и войдите рабочей учётной записью Microsoft 365.<\/li>\n<li><b>Телефон и планшет (iPhone, iPad, Android):<\/b> тот же адрес в Safari или Chrome. Чтобы открывать, как приложение: в Safari — «Поделиться» → «На экран „Домой“», в Chrome — меню ⋮ → «Добавить на главный экран».<\/li>\n<li><b>Приложение SharePoint на телефоне<\/b> может показывать портал не полностью — тогда открывайте в браузере. Меню SharePoint над порталом скрыто: всё делается во вкладках портала.<\/li>\n<\/ul>\n<p>Вкладки меню — со значками, у каждого раздела свой цвет. На телефоне остаются только значки (название — в подсказке).<\/p>\n<p>Эта инструкция всегда под кнопкой <b>?<\/b> вверху портала.<\/p>\n<h3>Кто что видит и что может<\/h3>\n<div class=\"tablewrap\"><table><thead><tr><th>Кто<\/th><th>Видит<\/th><th>Может<\/th><\/tr><\/thead><tbody><tr><td>PM проекта<\/td><td>свой проект<\/td><td>редактировать карточку (команда, ссылки), сдавать статус-отчёты, вести риски, комментировать<\/td><\/tr><tr><td>Руководители PM (по оргструктуре)<\/td><td>проекты подчинённых<\/td><td>просматривать и комментировать<\/td><\/tr><tr><td>Собственник, команда проекта и их руководители<\/td><td>проекты, где роль есть у них или у их подчинённых<\/td><td>просматривать и комментировать<\/td><\/tr><tr><td>PMO<\/td><td>все проекты<\/td><td>создавать новые проекты, согласовывать или возвращать статус-отчёты, просматривать и комментировать<\/td><\/tr><tr><td>Остальные сотрудники<\/td><td>пустой портал<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Проект в архиве — только просмотр для всех. Если портал для вас пустой, значит, у вас нет роли ни в одном проекте.<\/p>\n<h3>Главная<\/h3>\n<ul>\n<li><b>Полоса показателей<\/b> вверху: активные проекты; доля проектов со свежим отчётом (не старше 14 дней); для PMO — отчёты, ожидающие согласования; высокие риски (открытые, оценка от 15); просроченные проекты (план прошёл, а проект открыт). Нажмите показатель — откроется отфильтрованный список.<\/li>\n<li><b>Портфель по состоянию<\/b> — кольцо: сколько активных проектов зелёных, жёлтых, красных и ещё не оценённых; <b>Динамика состояния портфеля<\/b> — как менялось состояние за последние 12 недель: каждый проект на дату среза по последнему согласованному отчёту, серый — согласованного отчёта ещё нет; сегодняшний столбец совпадает с кольцом.<\/li>\n<li><b>Карта рисков<\/b> 5 × 5: строки — вероятность, столбцы — влияние, в ячейке — количество открытых рисков. Нажмите ячейку — под картой появятся её риски.<\/li>\n<li><b>Портфель по направлениям<\/b> — активные проекты каждого направления с разбивкой по состоянию; число в цветной части полосы — сколько проектов в этом состоянии.<\/li>\n<li><b>Наибольшие сдвиги сроков<\/b> — три проекта, где прогноз завершения позже плана: на сколько дней и сколько раз переносили план. <b>Запуски в ближайшие 7 дней<\/b> — дата запуска, состояние, PM.<\/li>\n<li>Ниже — <b>Проблемные проекты<\/b>, <b>Нет свежего статус-отчёта<\/b>, <b>Требуют решения руководства<\/b>, <b>Открытые риски<\/b>; «Показать все» — полный список.<\/li>\n<\/ul>\n<p>Всё считается только по проектам, которые видите вы (без архива).<\/p>\n<h3>Проекты<\/h3>\n<ul>\n<li><b>Плитки<\/b> или <b>Список<\/b> — переключатель вверху. На телефоне удобнее плитки.<\/li>\n<li><b>Отображать:<\/b> Все проекты, Стратегические, Проблемные, Мои проекты (все) — где я PM, собственник или в команде, <b>Я PM<\/b> — только проекты, где я PM, Нет свежего отчёта, Просроченные.<\/li>\n<li><b>В списке:<\/b> нажмите заголовок колонки, чтобы отсортировать; воронка ▽ — фильтр по значениям; шестерёнка ⚙ — выбор и порядок колонок (↑ / ↓); на компьютере ширину колонки меняют, перетащив границу заголовка, — она запоминается для каждого списка, «Сбросить ширины колонок» в меню шестерёнки; <b>CSV<\/b> — выгрузить таблицу как на экране (файл открывается в Excel). Новые записи — сверху. На телефоне статус-отчёты и риски показываются карточками (сортировка и фильтры, заданные на компьютере, действуют и там).<\/li>\n<li><b>Длинный список<\/b> прокручивается в своём окне: заголовки колонок остаются наверху, горизонтальная полоса прокрутки — всегда внизу видимой части таблицы, так что правые колонки первых строк видно без прокрутки страницы вниз. На телефоне — как и раньше, без отдельного окна.<\/li>\n<li><b>Фильтры<\/b> воронки и «Отображать» действуют, пока вы на странице: при переходе на другую вкладку сбрасываются к стандартным (выбор колонок и сортировка запоминаются). Ширина колонок от фильтров не меняется.<\/li>\n<li><b>Колонка «Отчёт»<\/b> — дата последнего согласованного отчёта, под ней — согласование самого нового отчёта (для «На согласовании» и «Возвращено» — ещё и дата отчёта отдельной строкой). Наведите мышь на метку — когда и кем подан отчёт. Фильтр колонки (⏷): по свежести и по согласованию — «Согласовано», «На согласовании», «Возвращено», «Отчёты не подавались».<\/li>\n<li><b>Фаза проекта<\/b> (этап жизненного цикла) — цветная метка: Инициация — фиолетовая, Планирование — синяя, Реализация — зелёная, Приостановлен — оранжевая, Завершён — зелёная, Отменён — серая. Кружок рядом — состояние проекта (зелёный, жёлтый, красный, серый — не оценено).<\/li>\n<li><b>Цвета:<\/b> красная дата завершения — срок прошёл, а проект открыт. Точка в колонке «Звіт» — свежесть последнего согласованного отчёта: зелёная — до 8 дней, жёлтая — 9–14, красная — больше 14, серая — согласованных отчётов ещё нет (наведите на точку — подсказка, сколько дней отчёту). Под датой — <b>согласование самого нового отчёта<\/b>: «Согласовано», «На согласовании» или «Возвращено» (для двух последних — дата отчёта).<\/li>\n<\/ul>\n<h3>Карточка проекта<\/h3>\n<p>Нажмите проект — справа откроется карточка (на телефоне — на весь экран). Вверху каждого бокового окна — <b>цветная метка<\/b>, что открыто: Проект, Статус-отчёт, Риск, Проблема, Назначение, Уведомления, Отзыв, Справка — одинаково, откуда бы вы его ни открыли.<\/p>\n<ul>\n<li>вверху — тип, состояние, фаза, приоритет и <b>Ссылки<\/b> (Loop, документы и т. п.); кнопки <b>Добавить статус-отчёт<\/b> и <b>Редактировать проект<\/b> (только для PM);<\/li>\n<li><b>Родительский проект<\/b> и <b>Дочерние проекты<\/b> — связь между проектами (вложенность любая); нажмите название, чтобы открыть проект. Связь прав не даёт: дочерние видны, только если у вас есть доступ к ним; родительский без доступа — название без ссылки. В «Проектах» есть колонка <b>Родительский проект<\/b> (⚙ — выбор колонок).<\/li>\n<li><b>Цель и описание<\/b> — до 10 строк (переносы строк сохраняются); длинный текст — <b>Показать полностью<\/b> / <b>Свернуть<\/b>.<\/li>\n<li>отметки согласования: «Статус-отчёт … на согласовании PMO» или «Отчёт … возвращён на доработку» с комментарием PMO;<\/li>\n<li><b>Участники<\/b>: PM, собственник и <b>Команда проекта<\/b> — таблица: участник, роль, по каким вопросам обращаться;<\/li>\n<li><b>Сроки<\/b> (с отклонением прогноза), <b>Бюджет и выполнение<\/b> (суммы — в долларах США);<\/li>\n<li><b>История изменений<\/b> — кто, когда и что изменил: «было → стало», причина (в том числе решения PMO — «Согласование отчёта»); также <b>подача отчётов<\/b> («Подача отчёта», в том числе «Новый отчёт на основе возвращённого») и <b>риски и проблемы<\/b> («Добавлено», изменения полей, «Закрыто») — со ссылкой «Открыть отчёт» / «Открыть риск». Эти события появляются после синхронизации (~15 минут);<\/li>\n<li><b>Комментарии<\/b> — лента и поле «Добавить комментарий»;<\/li>\n<li><b>История состояний<\/b> — оценки по последним отчётам;<\/li>\n<li><b>Статус-отчёты<\/b> — три последних, с отметкой согласования; <b>Показать все отчёты (N)<\/b> — все, <b>Свернуть<\/b> — снова три; нажмите дату или резюме, чтобы открыть отчёт; <b>Риски и проблемы<\/b>;<\/li>\n<li><b>Доступ к карточке<\/b> — кто видит проект и с каким правом.<\/li>\n<\/ul>\n<p>Ссылкой на карточку можно поделиться: адрес в браузере ведёт именно на неё.<\/p>\n<h3>Статус-отчёт (для PM)<\/h3>\n<ol>\n<li>В карточке — <b>Добавить статус-отчёт<\/b> (или вкладка «Статус-отчёты» → «Новый статус-отчёт»). По проекту может быть <b>только один отчёт на согласовании<\/b>: пока PMO не решил, кнопки нет — в карточке надпись «Отчёт от … на согласовании PMO». Из карточки форма открывается для этого проекта — сменить проект в ней нельзя. В общей форме проекты с отчётом на согласовании недоступны для выбора (пометка «отчёт от … на согласовании»).<\/li>\n<li><b>Дата подачи<\/b> — день, когда вы сохраняете отчёт, выбирать не нужно. <b>Период<\/b> считается сам: с даты последнего согласованного отчёта проекта (если его нет — с даты старта) по дату подачи, например «с 06.10.2026 по 08.10.2026».<\/li>\n<li>Оцените <b>сроки, бюджет и ресурсы<\/b>: зелёный, жёлтый, красный. <b>Общее состояние<\/b> считается само — худшая из трёх оценок.<\/li>\n<li><b>Ключевые показатели<\/b> уже заполнены текущими значениями. Измените только то, что изменилось: фазу, % выполнения (целое число от 0 до 100), тип, даты, фактические затраты (суммы показываются с пробелами между разрядами: 1 450 000). Даты запуска, завершения (план) и прогноза не могут быть раньше даты старта. Для статуса «Завершено — перенести в архив» % выполнения становится 100 и не меняется. Даты вводите как дд.мм.гггг (точки ставятся сами) или выберите в календаре — кнопка справа в поле. Для «Завершено» или «Отменено» — <b>дата завершения (факт)<\/b>: не раньше даты старта и не позже даты подачи (портал пояснит у поля, с какой датой сравнил); будущее завершение указывайте как прогноз, досрочное — можно.<\/li>\n<li>Если изменили фазу, тип или дату — заполните поле <b>Причина изменения показателей<\/b> (обязательно, попадёт в историю).<\/li>\n<li><b>Резюме одной строкой<\/b> (обязательно), что сделано, план, <b>проблемы и риски за период<\/b> — коротко, что мешало (реестр рисков и проблем проекта — отдельно, в карточке, блок «Риски и проблемы»). <b>Требуется решение руководства<\/b> — отмечайте, если для дальнейшей работы нужно решение вне полномочий PM: например, согласование дополнительного бюджета, смена приоритетов или разрешение конфликта ресурсов. Тогда поле <b>Какое решение нужно<\/b> обязательно: укажите, какое именно решение нужно и каковы последствия его отсутствия. Обычное согласование статус-отчёта PMO этой отметки не требует.<\/li>\n<li><b>Сохранить.<\/b> Если что-то не заполнено или введено с ошибкой, портал подсветит все такие поля сразу и пояснит у поля, что не так. Отчёт уходит <b>на согласование PMO<\/b>; карточка обновится после согласования. Отправленный отчёт изменить нельзя.<\/li>\n<li>Если PMO <b>вернул<\/b> отчёт — в карточке и в самом отчёте виден комментарий PMO. Нажмите <b>Новый отчёт на основе возвращённого<\/b>: форма заполнится данными возвращённого отчёта, исправьте и сохраните.<\/li>\n<li>Отчёт <b>возвращается автоматически<\/b>, если до решения PMO сменился PM проекта (новый PM подаёт актуальный отчёт) или проект ушёл в архив — причина видна в комментарии.<\/li>\n<\/ol>\n<p>Варианты фазы <b>«Завершено — перенести в архив»<\/b> и <b>«Отменено — перенести в архив»<\/b> отправляют проект в архив после согласования отчёта — дальше проект только для просмотра. Для них обязательна <b>«Дата завершения (факт)»<\/b> — когда проект фактически завершён или отменён: не раньше даты старта и не позже даты отчёта.<\/p>\n<h3>Помощник ИИ (пилот)<\/h3>\n<p>У участников пилота в форме статус-отчёта есть помощник ИИ (Microsoft Copilot Studio). Он подсказывает, но не решает: отчёт и оценки — ответственность PM, их согласует PMO.<\/p>\n<ol>\n<li><b>Включение.<\/b> Нажмите свой аватар справа вверху → переключатель <b>«Помощник ИИ»<\/b>. В первый раз портал покажет, какие данные уйдут в ИИ, — нажмите <b>«Разрешить»<\/b> (спрашиваем один раз). Выключили — форма отчёта снова без ИИ; включить можно в любой момент, без повторного разрешения. Настройка хранится для вас, а не для браузера: включили на телефоне — включено и на компьютере. На компьютере откроется окно входа Microsoft (если браузер его заблокировал — разрешите всплывающие окна для сайта); на телефоне портал перейдёт на страницу входа Microsoft и вернётся, включение завершится само. Не удалось — под переключателем видна причина. Если на телефоне в форме отчёта появилось <b>«Войти»<\/b> — войдите в Microsoft ещё раз, пока форма пустая (введённые данные не сохранятся).<\/li>\n<li><b>«Заполнить с ИИ»<\/b> (вверху формы) — черновик по данным проекта: «Резюме одной строкой», «Сделано за период», «План на следующий период», «Проблемы и риски за период». Пустые поля заполняются сразу, заполненные — только после вашего «Заменить». <b>«Отменить вставку ИИ»<\/b> возвращает тексты, пока вы их не изменили. В панели <b>«Подсказки ИИ»<\/b> — что не забыть (пункты прошлого плана, просроченные меры, высокие риски, запрос решения) и предлагаемые оценки: оценка изменится, только если нажмёте <b>«Принять»<\/b>. Проверьте и исправьте тексты — это черновик.<\/li>\n<li><b>«Проверить с ИИ»<\/b> (вместо «Сохранить»). Сначала обычная проверка полей формы; затем в поле <b>«Противоречия (анализ ИИ)»<\/b> (только для чтения) — пункты, каждый с названием поля, которое исправить:<\/li>\n<\/ol>\n<p>- портал сам сравнивает даты и суммы: зелёные «Сроки», а прогноз позже плана или меры просрочены; зелёный «Бюджет», а затраты больше бюджета проекта; «Требуется решение руководства» без описания; уменьшенный «% выполнения»; - ИИ проверяет содержание: упомянуты ли с действиями высокие риски и проблемы из реестра, отражены ли пункты прошлого плана и запрос решения, не противоречит ли резюме оценкам, объяснена ли смена фазы и дат, учтён ли комментарий PMO к возвращённому отчёту. Под пунктом о записи реестра — <b>«Показать запись»<\/b> и <b>«Добавить упоминание»<\/b>: строка с мерами из реестра добавляется в «Проблемы и риски за период».<\/p>\n<ol>\n<li>Изменили отчёт — кнопка снова <b>«Проверить с ИИ»<\/b>. Не меняли — <b>«Сохранить»<\/b>: отчёт сохраняется вместе с результатом проверки, даже если вы с пунктами не согласны.<\/li>\n<li><b>ИИ не ответил<\/b> (нет связи, исчерпан лимит, нет доступа) — появится причина и кнопка <b>«Сохранить без проверки»<\/b>: сдача отчёта от ИИ не зависит, PMO увидит «Проверка ИИ не выполнена: …». Измените отчёт — можно попробовать ещё раз. На тестовом сайте сбой также автоматически записывается в «Отзывы» (только технические данные, без текста отчёта) — чтобы мы разобрали причину.<\/li>\n<li><b>Какие данные уходят в ИИ<\/b> — только этот проект: показатели, последние согласованные отчёты, записи реестра рисков и проблем, текст формы; без e-mail и команды. Обработка — Microsoft Copilot Studio (Европа; модель может обрабатывать данные за её пределами).<\/li>\n<\/ol>\n<h3>Согласование статус-отчётов (для PMO)<\/h3>\n<ol>\n<li>Отчёты, которые ждут вас, — показатель «Ожидают согласования» на главной и «Статус-отчёты» → «Отображать: Ожидают согласования».<\/li>\n<li>Откройте отчёт: оценки, ключевые показатели, которые он меняет, что сделано, план, проблемы.<\/li>\n<li>В блоке <b>Согласование отчёта<\/b>:<\/li>\n<\/ol>\n<p>- <b>Согласовать<\/b> — отчёт попадёт в карточку с оценками PM; - измените оценку сроков, бюджета или ресурсов и нажмите <b>Согласовать с изменением оценок<\/b> — в карточку попадёт ваша оценка, комментарий обязателен; - <b>Вернуть на доработку<\/b> — карточка не изменится, PM увидит ваш комментарий (обязательно).<\/p>\n<ol>\n<li>PMO меняет только оценки; сам отчёт (тексты, даты, фаза) не меняется. Решение записывается в историю изменений проекта («Согласование отчёта»: «было → стало», ваш комментарий).<\/li>\n<\/ol>\n<p>Если отчёт проверял помощник ИИ, в отчёте есть блок <b>«Противоречия (анализ ИИ)»<\/b> с датой проверки или пометкой «Сохранено без проверки ИИ» (с причиной). Это подсказка для разговора с PM, а не решение: на согласование она не влияет.<\/p>\n<p>Решённый отчёт повторно не согласуется: если нужны изменения — верните его, и PM сдаст новый. Ошибочно согласованный отчёт исправляется только следующим отчётом PM.<\/p>\n<p>Перед решением портал проверяет актуальное состояние отчёта: если его уже решил другой PMO — ваше решение не сохранится (появится пояснение). Отчёт, автор которого уже не PM проекта, можно только вернуть.<\/p>\n<h3>Как изменить фазу проекта<\/h3>\n<p>Фаза (Инициация, Планирование, Реализация, Приостановлен, Отменён, Завершён) меняется <b>только статус-отчётом<\/b> — в карточке её не редактируют.<\/p>\n<ol>\n<li><b>PM<\/b> открывает карточку проекта → <b>Добавить статус-отчёт<\/b>.<\/li>\n<li>В разделе <b>Ключевые показатели<\/b> выбирает новую <b>Фазу проекта<\/b> (при необходимости меняет и даты, % выполнения).<\/li>\n<li>Заполняет <b>Причина изменения показателей<\/b> — почему меняется фаза; причина попадёт в историю.<\/li>\n<li>Оценивает сроки, бюджет, ресурсы, пишет резюме → <b>Сохранить<\/b>. Отчёт уходит на согласование.<\/li>\n<li><b>PMO<\/b> согласует отчёт — фаза в карточке меняется, в истории появляются строки «Согласование отчёта» и «Обновлено статус-отчётом» («было → стало», причина). Если PMO возвращает отчёт — фаза не меняется, PM сдаёт новый отчёт.<\/li>\n<li><b>«Завершено — перенести в архив»<\/b> или <b>«Отменено — перенести в архив»<\/b> — после согласования проект получает фазу «Завершён» или «Отменён», «Дату завершения / отмены», «Дату завершения (факт)» и переходит на вкладку «Архив»; дальше — только просмотр.<\/li>\n<\/ol>\n<h3>Риски и проблемы<\/h3>\n<ul>\n<li>Добавить — в карточке «Добавить риск / проблему» (для PM) или на вкладке «Риски и проблемы» → «Новый риск / проблема».<\/li>\n<li>Сначала выберите <b>тип<\/b> (Риск или Проблема) — от него зависит заголовок формы («Новый риск» / «Новая проблема»), затем заполните <b>описание<\/b>.<\/li>\n<li><b>Вероятность<\/b> и <b>влияние<\/b> — от 1 до 5; <b>оценка<\/b> = вероятность × влияние: 15–25 — высокий (красный), 8–14 — средний (жёлтый), 1–7 — низкий (зелёный).<\/li>\n<li><b>Стратегия реагирования:<\/b> Избегание, Снижение (смягчение), Передача, Принятие (повторное нажатие на выбранную отменяет выбор).<\/li>\n<li><b>Меры по снижению риска<\/b> — что делаем сейчас; <b>План действий при наступлении<\/b> — что делаем, если риск случится.<\/li>\n<li><b>Обязательные поля<\/b> (отмечены *): для риска — описание, «Стратегия реагирования», «Меры по снижению риска» и «План действий при наступлении» — при любой оценке; для проблемы — описание и меры. Пустое значение или одни пробелы не принимаются, пояснение — у поля.<\/li>\n<li>Укажите владельца риска, статус (Открыт — оранжевая метка, В работе — синяя, Закрыт — зелёная) и <b>срок выполнения мер<\/b> — не раньше сегодняшнего дня. Просроченный срок открытого риска — красный; в форме — «Срок истёк»: закройте запись или создайте копию с новым сроком.<\/li>\n<li>В <b>сохранённой записи<\/b> меняется только <b>статус<\/b> (остальные поля — только для просмотра), чтобы история реестра оставалась точной. Чтобы изменить стратегию, меры, оценку или срок — <b>«Копировать риск»<\/b> («Копировать проблему»): откроется новая запись со всеми полями, измените нужное и сохраните, а исходную закройте (статус «Закрыт»).<\/li>\n<li>Риски и проблемы <b>не согласуются<\/b>: новые высокие риски (от 15) и все проблемы, а также смену их статуса PMO видит в уведомлениях; обратная связь PMO — комментарием в карточке проекта.<\/li>\n<li>«Отображать: Высокие риски» — открытые риски с оценкой от 15; «Риски архивных проектов» — риски проектов в архиве (только просмотр).<\/li>\n<\/ul>\n<h3>Комментарии<\/h3>\n<p>Комментировать может каждый, кто видит проект: в карточке — раздел «Комментарии» → «Добавить комментарий». Проект в архиве — только просмотр, новые комментарии не добавляются.<\/p>\n<h3>Уведомления<\/h3>\n<ul>\n<li>Вверху справа — <b>колокольчик<\/b>. <b>Красное число<\/b> на нём — сколько новых для вас событий в ваших проектах; пока есть новые, колокольчик время от времени покачивается.<\/li>\n<li>Нажмите колокольчик — откроются <b>«Уведомления»<\/b>: события за 14 дней, новые вверху и выделены («Новое»), ниже — уже просмотренные. Нажатие на событие открывает карточку, статус-отчёт или риск; <b>«← Уведомления»<\/b> вверху возвращает к списку. «Только новые» — скрыть просмотренное.<\/li>\n<li>Открыли событие — оно становится прочитанным, число уменьшается. <b>«Отметить всё прочитанным»<\/b> — прочитано всё показанное, число исчезает. Само открытие списка ничего не отмечает.<\/li>\n<li>Что видите — по вашей роли в проекте: PM, владелец и команда — создание проекта, назначения, решения PMO по отчётам, обновление показателей, комментарии; риски — PM и владелец риска всегда, владелец и команда — только высокие (оценка от 15); правки карточки — PM и владелец; PMO — подача отчётов на согласование, переход проектов в архив, новые высокие риски (от 15) и все проблемы, а также смена их статуса. Свои действия в уведомлениях не показываются.<\/li>\n<li><b>Вас добавили в команду<\/b> проекта или изменили вашу роль в ней — отдельное уведомление только для вас: «Вас добавили в команду» / «Изменена ваша роль в команде» с вашей ролью; нажатие открывает карточку. Появляется вместе с правами, в течение ~15 минут. Об исключении из команды уведомления нет — проект просто исчезает из вашего списка.<\/li>\n<li><b>Ваш отзыв рассмотрен<\/b> — уведомление «Отзыв рассмотрен»: номер отзыва, статус и ответ; нажатие открывает отзыв. Новый ответ на тот же отзыв — новое уведомление.<\/li>\n<li><b>Новый выпуск портала<\/b> — уведомление для всех с номером версии; нажатие открывает «Что изменилось».<\/li>\n<li>Новому участнику уведомления появляются в течение ~15 минут; события, которые были до этого, новыми не считаются.<\/li>\n<\/ul>\n<h3>Новый проект и редактирование<\/h3>\n<ul>\n<li><b>Новый проект<\/b> создаёт PMO: название (уникальное — двух проектов с одинаковым названием не будет) и PM обязательны (PM не подставляется автоматически — выберите его); номер проекта система назначает сама по порядку (PRJ-001, PRJ-002…) — он уникален и вручную не меняется.<\/li>\n<li>В течение ~15 минут после создания проект <b>готовится<\/b> (в карточке — «Проект готовится»): после этого PM может добавлять отчёты, риски и участников команды.<\/li>\n<li><b>Редактировать проект<\/b> может только PM: название, направление, приоритет, бюджет, описание, <b>родительский проект<\/b> (любой проект, кроме самого себя и своих дочерних; его задаёт и PMO при создании), а также:<\/li>\n<\/ul>\n<p>- <b>Команда проекта<\/b> — «+ Добавить участника»: человек, <b>роль<\/b> (обязательно) и по каким вопросам обращаться; × — убрать участника; - <b>Ссылки<\/b> — «+ Добавить ссылку»: название и адрес (начинается с <code>https://<\/code>); × — убрать.<\/p>\n<ul>\n<li><b>«Цель и описание»<\/b> обязательно при сохранении карточки PM (и в ранее созданных проектах — при следующем сохранении): кратко цель проекта и ожидаемый результат. Новый проект PMO может создать без описания — его допишет PM.<\/li>\n<li><b>Тип и приоритет — разные вещи.<\/b> <b>Тип<\/b> («Стратегический» / «Обычный») — значимость проекта для компании; задаётся при создании, дальше меняется только статус-отчётом. <b>Приоритет<\/b> («1 — Высокий» … «3 — Низкий») — очерёдность выделения ресурсов сейчас; его меняет PM в карточке (поле рядом с направлением). Стратегический проект может временно иметь и низкий приоритет — это не ошибка.<\/li>\n<li>Фаза, состояние, даты и затраты — только через статус-отчёт (см. «Как изменить фазу проекта»).<\/li>\n<li>После изменения команды права доступа пересчитываются автоматически <b>в течение ~15 минут<\/b>: тогда участник видит проект в своём списке и в «Доступ к карточке» и может комментировать.<\/li>\n<li><b>PM и владельца<\/b> после создания меняет только PMO: в карточке — <b>«Сменить PM / владельца»<\/b> (новый PM, новый владелец — пустое поле без изменений, причина обязательна). Изменение сразу видно в карточке и в «Истории изменений» («Назначение»), окончательно переносится синхронизацией в течение ~15 минут; пока оно не обработано, новое подать нельзя. Отчёт прежнего PM «на согласовании» возвращается автоматически.<\/li>\n<li>После <b>смены PM<\/b> прежний PM сразу не может менять проект; новый PM видит «Вы назначены PM этого проекта: права редактирования появятся в течение 15 минут» — страница обновится сама.<\/li>\n<\/ul>\n<h3>Архив<\/h3>\n<p>Вкладка «Архив» — проекты с фазой <b>Завершён<\/b> или <b>Отменён<\/b> (колонка «Фаза проекта») с датой завершения / отмены, только просмотр (без новых комментариев). Риски этих проектов — «Риски и проблемы» → «Отображать: Риски архивных проектов». Навигация — как в «Проекты»: <b>Список<\/b> или <b>Плитки<\/b>, «Отображать» (Все проекты, <b>Завершённые<\/b>, <b>Отменённые<\/b>, Стратегические, Мои проекты, Я PM), CSV и выбор колонок; на плитке — дата завершения / отмены.<\/p>\n<h3>Язык и тема<\/h3>\n<p>Вверху справа: <b>UA / EN / RU<\/b> и светлая ☀ / тёмная ☾ тема. На телефоне — в меню под вашим аватаром (шапка там в один ряд). Выбор запоминается в этом браузере. Значения (статусы, состояния, типы, приоритеты, направления, согласование) и названия в «Отображать» переводятся вместе с интерфейсом; содержимое записей — как его ввели.<\/p>\n<h3>Когда видны изменения<\/h3>\n<p>Сохранённое в формах видно на экране сразу; решения PMO по отчёту — тоже сразу. Права доступа (в том числе для новых участников команды), история изменений и «Доступ к карточке» обновляются автоматически в течение ~15 минут.<\/p>\n<p>Перед каждым сохранением портал проверяет актуальные данные: если за это время сменился PM, проект ушёл в архив, по проекту уже есть отчёт на согласовании или запись изменил другой пользователь — сохранение не произойдёт, появится пояснение, а данные обновятся. Открытая страница сама обновляет данные, когда вы возвращаетесь на вкладку, и каждые 5 минут. Чтобы обновить данные сразу (например, на телефоне), нажмите <b>↻ «Обновить данные»<\/b> над списком — рядом с «CSV».<\/p>\n<h3>Отзыв<\/h3>\n<p>Вкладка <b>Отзывы<\/b> → <b>Оставить отзыв<\/b> (или кнопка «Отзыв» в «Справке»): опишите, что не так или что улучшить, и добавьте до 5 скриншотов:<\/p>\n<ul>\n<li>на компьютере — сделайте снимок экрана и вставьте его в форму: <b>Ctrl+V<\/b> (Windows) или <b>Cmd+V<\/b> (Mac); или «Добавить скриншот»;<\/li>\n<li>на телефоне и планшете — «Добавить скриншот» → галерея или камера.<\/li>\n<\/ul>\n<p>Устройство добавляется само; в тексте укажите, на каком экране заметили проблему.<\/p>\n<p>Вкладка <b>Отзывы<\/b> — все отзывы участников: номер (#46 — так на отзыв ссылаются в ответах), текст, автор, статус рассмотрения (Новый, Принят, Сделано, Прокомментирован, Отклонён) и ответ разработчиков. Скриншоты видят только автор и разработчики. Статус и ответ ставят разработчики решения. В окне отзыва стрелки <b>‹ ›<\/b> у номера — предыдущий и следующий отзыв в том порядке, что в таблице (с учётом фильтров и сортировки).<\/p>\n<h3>Задания для фокус-группы<\/h3>\n<p>Выполните то, что относится к вашей роли, и после каждого задания оставьте <b>отзыв<\/b>: что было непонятно, неудобно или не сработало.<\/p>\n<ol>\n<li>Откройте портал на компьютере и на телефоне. Понятно ли с главной, что происходит с портфелем? Нажмите показатели и ячейку карты рисков.<\/li>\n<li>Найдите свои проекты («Отображать: Мои проекты (все)» или «Я PM»). Все ли ваши проекты на месте и нет ли лишних?<\/li>\n<li>Откройте карточку проекта: команда, ссылки, сроки, история изменений, доступ. Чего не хватает?<\/li>\n<li><b>PM:<\/b> добавьте в команду участника с ролью и ссылку на документ.<\/li>\n<li><b>PM:<\/b> сдайте статус-отчёт с изменением даты завершения (с причиной) и убедитесь, что карточка ждёт согласования.<\/li>\n<li><b>PMO:<\/b> согласуйте один отчёт с изменением оценки (с комментарием), другой — верните на доработку.<\/li>\n<li><b>PM:<\/b> по возвращённому отчёту сдайте новый («Новый отчёт на основе возвращённого»).<\/li>\n<li><b>PM:<\/b> добавьте риск со стратегией реагирования, мерами и планом действий при наступлении.<\/li>\n<li><b>Все:<\/b> добавьте комментарий к проекту, где вы собственник или в команде; просмотрите вкладку «Отзывы».<\/li>\n<li>Переключите язык и тему; отправьте отзыв со скриншотом с телефона.<\/li>\n<\/ol>\n<h3>Подробный обзор системы<\/h3>\n<p>Вверху «Справки» — <b>версия портала<\/b> и дата выпуска и <b>Что изменилось →<\/b>: новые возможности и исправления текущего выпуска, номера реализованных отзывов (нажмите номер — откроется отзыв), что проверить повторно, и прошлые выпуски.<\/p>\n<p>В конце «Справки» — кнопка <b>Подробный обзор системы<\/b>: зачем портал, из чего состоит, все экраны со скриншотами, правила согласования и безопасность. Обзор открывается в портале (на украинском); там же — <b>Скачать PDF<\/b>, чтобы сохранить или распечатать.<\/p>"];
const RELEASES = [[{"ver":"1.7.5.3","date":"26.10.2026","html":"<p><b>Виправлено<\/b><\/p>\n<ul>\n<li>Зовнішнього учасника (гостя організації) тепер можна додати до команди проєкту, призначити PM, власником чи відповідальним за ризик. Якщо людини ще немає в організації, портал пояснює, що її спершу має запросити адміністратор Microsoft 365.<\/li>\n<\/ul>"},{"ver":"1.7.5.2","date":"20.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.5.1","date":"20.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Назва системи: <b>PPM — Управління портфелем проєктів<\/b> (Project Portfolio Management).<\/li>\n<\/ul>"},{"ver":"1.7.5.0","date":"19.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li><b>Батьківський проєкт<\/b> у картці: зв'язок між проєктами (вкладеність будь-яка, не можна обрати сам проєкт і його дочірні). У картці — посилання на батьківський і список <b>Дочірні проєкти<\/b>; у «Проєктах» — колонка <b>Батьківський проєкт<\/b>. Зміна — в «Історії змін». Поки лише для зв'язку, далі — аналітика.<\/li>\n<\/ul>"},{"ver":"1.7.4.7","date":"18.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>На телефоні меню під аватаром відкривається одразу під ним, а не знизу екрана.<\/li>\n<\/ul>"},{"ver":"1.7.4.6","date":"18.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.4.5","date":"18.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>На телефоні: шапка в один ряд, при прокрутці лишається тільки меню розділів; мова й тема — у меню під аватаром. Вікна фільтра й колонок — знизу, кнопки «Як за замовчуванням» і «Скинути ширини» — угорі вікна (#107). Блок погодження в перегляді звіту більше не налазить на заголовок (#97). Картка звіту в списку: спершу PM, дата й стан (#99). «Відгуки» — картками (#102).<\/li>\n<\/ul>\n<p><b>Перевірте повторно<\/b><\/p>\n<ul>\n<li>На телефоні: шапка, меню під аватаром, фільтри й колонки у списках, погодження звіту, «Відгуки».<\/li>\n<\/ul>"},{"ver":"1.7.4.4","date":"17.10.2026","html":"<p><b>Виправлено<\/b><\/p>\n<ul>\n<li>«Детальний огляд системи»: таблиці переносять текст — без прокрутки вбік.<\/li>\n<\/ul>"},{"ver":"1.7.4.3","date":"17.10.2026","html":"<p><b>Виправлено<\/b><\/p>\n<ul>\n<li>«Помічник ШІ» вмикається з першого разу: вікно входу Microsoft відкривається одразу після «Дозволити»; на телефоні — вхід із переходом на сторінку Microsoft, після повернення увімкнення завершується само. Не вдалося — видно причину (вікно входу заблоковано, вхід не завершено, помилка ШІ з кодом); на тестовому сайті збій записується у «Відгуки».<\/li>\n<\/ul>\n<p><b>Змінено<\/b><\/p>\n<ul>\n<li>«Помічник ШІ» зберігається для вас, а не для браузера: увімкнули на телефоні — увімкнено й на комп'ютері.<\/li>\n<\/ul>"},{"ver":"1.7.4.2","date":"17.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li>Кнопка <b>↻ «Оновити дані»<\/b> над списками (поруч із «CSV») — свіжі дані без перезаходу на сторінку, зручно на телефоні (#103).<\/li>\n<\/ul>\n<p><b>Змінено<\/b><\/p>\n<ul>\n<li>«Що змінилося»: угорі — поточна версія; технічні оновлення підряд зібрані в один згорнутий блок; кожен випуск зі змінами розгортається натисканням на заголовок, розділи «Нове / Змінено / Виправлено» виділені (#95).<\/li>\n<li>Картка проєкту: «Мета та опис» обов'язкове при збереженні PM (і в раніше створених проєктах — при наступному збереженні) (#96).<\/li>\n<li>Картка проєкту: «Пріоритет» — у «Основне», поруч із напрямом, з підказкою, чим пріоритет відрізняється від типу; у «Довідці» — визначення (#105).<\/li>\n<li>Перегляд статус-звіту: під заголовком — відповідальний PM (#98).<\/li>\n<li>Пошук SharePoint у сірій смузі прихований: на телефоні він збільшував сторінку (#106).<\/li>\n<\/ul>\n<p><b>Виправлено<\/b><\/p>\n<ul>\n<li>Відгук надсилається з першого разу: при збої зв'язку портал повторює запит сам, повторне «Надіслати» не створює дубль; надісланий відгук одразу видно в списку (#108, #103).<\/li>\n<\/ul>"},{"ver":"1.7.4.1","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>«Детальний огляд системи» в «Довідці»: новий розділ «Помічник ШІ (пілот)», безпека даних і стан робіт — з урахуванням помічника.<\/li>\n<\/ul>"},{"ver":"1.7.4.0","date":"14.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li>Помічник ШІ для учасників пілоту: перемикач «Помічник ШІ» в меню аватара (згода — один раз, при ввімкненні); у формі статус-звіту — «Заповнити з ШІ» (чернетка, «Що не забути», пропоновані оцінки) і «Перевірити з ШІ» (суперечності між звітом і даними проєкту); поле «Суперечності (аналіз ШІ)» видно у звіті й під час погодження. Докладно — «Довідка», розділ «Помічник ШІ (пілот)».<\/li>\n<\/ul>"},{"ver":"1.7.3.13","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Позначки погодження («На погодженні», «Погоджено», «Повернуто») — знову одним рядком.<\/li>\n<\/ul>"},{"ver":"1.7.3.12","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Таблиці «Проєкти», «Статус-звіти», «Ризики» й «Архів» вміщуються у вікно без горизонтальної прокрутки: сторінка ширша (до 1440 px), довгі заголовки й позначки переносяться, фільтр колонок-оцінок — під назвою, якщо місця мало.<\/li>\n<\/ul>"},{"ver":"1.7.3.11","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.3.7","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Кнопки «Прийняти» й «Показати запис» у підказках помічника ШІ виділено рамкою.<\/li>\n<li>Ім'я в колонках «PM» і «Автор» більше не розривається посеред слова на третій рядок.<\/li>\n<\/ul>"},{"ver":"1.7.3.1","date":"14.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li>«Копіювати ризик» / «Копіювати проблему» у збереженому записі: відкривається новий запис з усіма полями — змініть потрібне й збережіть, а вихідний запис закрийте (#92).<\/li>\n<li>PMO отримує в дзвіночку нові високі ризики (від 15) і всі проблеми, а також зміну їх статусу (#87).<\/li>\n<\/ul>\n<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Ризик: «Стратегія реагування», «Заходи для зниження ризику» і «План дій у разі настання» — обов'язкові за будь-якої оцінки; проблема — опис і заходи. Обов'язкові поля позначені *, пояснення — біля поля (#91, #88).<\/li>\n<li>Збережений ризик чи проблема змінюється лише статусом; інші поля — через «Копіювати» (#92).<\/li>\n<li>У формі нового запису — як опрацьовуються ризики: не погоджуються, PMO бачить їх у сповіщеннях, зворотний зв'язок — коментарем у картці (#87).<\/li>\n<li>«Детальний огляд системи» в «Довідці»: розділи про ризики й сповіщення — за рішеннями щодо ризиків.<\/li>\n<\/ul>\n<p><b>Перевірте повторно<\/b><\/p>\n<ul>\n<li>Новий ризик без стратегії, заходів чи плану дій — помилки біля полів; нова проблема — лише опис і заходи.<\/li>\n<li>Збережений ризик: змінюється лише «Статус»; «Копіювати ризик» — новий запис з усіма полями.<\/li>\n<li>PMO: через ~15 хвилин після нового високого ризику чи проблеми від PM і зміни їх статусу — подія в дзвіночку.<\/li>\n<\/ul>"},{"ver":"1.7.2.31","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.2.30","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.2.29","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.2.28","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.2.27","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.2.26","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/li>\n<\/ul>"},{"ver":"1.7.2.25","date":"14.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Технічне оновлення без змін у роботі порталу.<\/l овтий — 9–14 днів (було «8–14»), як і рахує портал.<\/li>\n<\/ul>"},{"ver":"1.7.2.10","date":"12.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li>Сповіщення «Вас додано до команди проєкту» з вашою роллю, а також про зміну вашої ролі в команді (#84).<\/li>\n<li>Довгі таблиці прокручуються у своєму вікні: заголовки колонок закріплені, горизонтальна смуга прокрутки завжди видна внизу таблиці (#89).<\/li>\n<li>Номер версії порталу й «Що змінилося» — у «Довідці» (кнопка <b>?<\/b>) (#90); про новий випуск повідомляє дзвіночок.<\/li>\n<li>Дзвіночок: «Відгук розглянуто» — коли змінився статус або відповідь на ваш відгук.<\/li>\n<li>У картці проєкту — три останні статус-звіти й «Показати всі звіти (N)» (#82).<\/li>\n<\/ul>\n<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Колонка «Звіт»: мітка погодження й дата — один блок, дата окремим рядком; підказка «Подано … · автор» (#85).<\/li>\n<li>Поле звіту «Проблеми та ризики» → «Проблеми та ризики за період», з підказкою, де реєстр ризиків (#81).<\/li>\n<li>«Термін виконання заходів» ризику: для нового запису — не раніше сьогодні, при зміні — не раніше дати реєстрації; прострочений позначається «Термін минув» (#88).<\/li>\n<li>Меню без порожнього місця після «Відгуки»; у формі проєкту — права учасникам з'являються протягом ~15 хвилин (#83).<\/li>\n<\/ul>\n<p><b>Перевірте повторно<\/b><\/p>\n<ul>\n<li>Додайте учасника до команди проєкту — через ~15 хвилин у нього в дзвіночку «Вас додано до команди».<\/li>\n<li>Форма ризику: термін раніше сьогодні (новий запис) — помилка біля поля.<\/li>\n<li>Довгі списки: заголовки колонок і горизонтальна смуга прокрутки лишаються видимими.<\/li>\n<li>Дзвіночок: «Новий випуск порталу» відкриває «Що змінилося»; автор відгуку отримує «Відгук розглянуто» після зміни статусу чи відповіді.<\/li>\n<li>Картка проєкту: три останні звіти й «Показати всі звіти (N)»; колонка «Звіт» — підказка «Подано … · автор».<\/li>\n<\/ul>"},{"ver":"1.7.2.1","date":"08.10.2026","html":"<p><b>Змінено<\/b><\/p>\n<ul>\n<li>Дата подання звіту — день збереження, період рахується сам (#62, #69).<\/li>\n<li>Перевірки форми звіту: фактичне завершення, опис потрібного рішення (#64, #67, #68).<\/li>\n<li>«Статус» проєкту → «Фаза проєкту»; фаза й тип записуються в кожен звіт (#77, #78).<\/li>\n<li>Колонка «Звіт» — погодження найновішого звіту, фільтр за погодженням (#73); «Мета та опис» — до 10 рядків (#71); кнопки на телефоні (#72).<\/li>\n<\/ul>"},{"ver":"1.7.1","date":"08.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li>Сповіщення: дзвіночок із числом нових подій ваших проєктів, «Позначити все прочитаним».<\/li>\n<li>Архів за фазами «Завершено» / «Скасовано», представлення «Завершені» / «Скасовані».<\/li>\n<li>Значки розділів у меню, кольорова мітка в кожному бічному вікні.<\/li>\n<\/ul>"},{"ver":"1.7.0","date":"04.10.2026","html":"<p><b>Нове<\/b><\/p>\n<ul>\n<li>«Призначення»: PM і власника змінює лише PMO (#43).<\/li>\n<li>Форма ризику: спершу тип, потім опис (#47, #55); дата завершення (факт) (#54).<\/li>\n<li>Синхронізація працює в Azure Automation.<\/li>\n<\/ul>"}],[{"ver":"1.7.5.3","date":"26.10.2026","html":"<p><b>Fixed<\/b><\/p>\n<ul>\n<li>An external participant (a guest of the organization) can now be added to the project team or assigned as PM, owner or risk owner. If the person is not yet in the organization, the portal explains that the Microsoft 365 administrator must invite them first.<\/li>\n<\/ul>"},{"ver":"1.7.5.2","date":"20.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.5.1","date":"20.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>System name: <b>PPM — Project Portfolio Management<\/b>.<\/li>\n<\/ul>"},{"ver":"1.7.5.0","date":"19.10.2026","html":"<p><b>New<\/b><\/p>\n<ul>\n<li><b>Parent project<\/b> on the card: a link between projects (any nesting; the project itself and its children cannot be chosen). The card shows a link to the parent and a <b>Child projects<\/b> list; «Projects» has a <b>Parent project<\/b> column. Changes appear in «Change history». For linking only for now, analytics later.<\/li>\n<\/ul>"},{"ver":"1.7.4.7","date":"18.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>On a phone the avatar menu opens right under it, not at the bottom of the screen.<\/li>\n<\/ul>"},{"ver":"1.7.4.6","date":"18.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.4.5","date":"18.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>On a phone: a single-row header, only the section menu stays when scrolling; language and theme — in the menu under the avatar. Filter and column windows open at the bottom, with «Default» and «Reset widths» at the top of the window (#107). The approval block in the report view no longer overlaps the title (#97). A report card in the list shows the PM, date and health first (#99). «Feedback» — as cards (#102).<\/li>\n<\/ul>\n<p><b>Please re-check<\/b><\/p>\n<ul>\n<li>On a phone: the header, the avatar menu, filters and columns in lists, report approval, «Feedback».<\/li>\n<\/ul>"},{"ver":"1.7.4.4","date":"17.10.2026","html":"<p><b>Fixed<\/b><\/p>\n<ul>\n<li>«Detailed system overview»: tables wrap text — no sideways scrolling.<\/li>\n<\/ul>"},{"ver":"1.7.4.3","date":"17.10.2026","html":"<p><b>Fixed<\/b><\/p>\n<ul>\n<li>«AI assistant» turns on the first time: the Microsoft sign-in window opens right after «Allow»; on a phone, sign-in goes to the Microsoft page and back, and turning on finishes by itself. If it fails, the reason is shown (sign-in window blocked, sign-in not completed, AI error with a code); on the test site the failure is recorded in «Feedback».<\/li>\n<\/ul>\n<p><b>Changed<\/b><\/p>\n<ul>\n<li>«AI assistant» is kept for you, not for the browser: turned on on your phone — it is on on your computer too.<\/li>\n<\/ul>"},{"ver":"1.7.4.2","date":"17.10.2026","html":"<p><b>New<\/b><\/p>\n<ul>\n<li>The <b>↻ «Refresh data»<\/b> button above lists (next to «CSV») — fresh data without reopening the page, handy on a phone (#103).<\/li>\n<\/ul>\n<p><b>Changed<\/b><\/p>\n<ul>\n<li>«What's new»: the current version at the top; consecutive technical updates are collected in one collapsed block; each release with changes expands by tapping its title, the «New / Changed / Fixed» sections are highlighted (#95).<\/li>\n<li>Project card: «Goal and description» is required when the PM saves the card (including projects created earlier — at the next save) (#96).<\/li>\n<li>Project card: «Priority» is in «General», next to the department, with a hint on how priority differs from type; definitions in «Help» (#105).<\/li>\n<li>Status report view: the responsible PM under the title (#98).<\/li>\n<li>The SharePoint search in the grey bar is hidden: on a phone it zoomed the page (#106).<\/li>\n<\/ul>\n<p><b>Fixed<\/b><\/p>\n<ul>\n<li>Feedback is sent on the first try: on a connection failure the portal retries itself, pressing «Send» again does not create a duplicate; sent feedback is visible in the list right away (#108, #103).<\/li>\n<\/ul>"},{"ver":"1.7.4.1","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>«Detailed system overview» in «Help»: a new «AI assistant (pilot)» section; data security and project status now cover the assistant.<\/li>\n<\/ul>"},{"ver":"1.7.4.0","date":"14.10.2026","html":"<p><b>New<\/b><\/p>\n<ul>\n<li>AI assistant for pilot participants: the «AI assistant» switch in the avatar menu (consent once, when turning it on); in the status report form — «Fill with AI» (draft, «Don't forget», suggested ratings) and «Check with AI» (contradictions between the report and project data); the «Contradictions (AI analysis)» field is visible in the report and during approval. Details — «Help», section «AI assistant (pilot)».<\/li>\n<\/ul>"},{"ver":"1.7.3.13","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Approval badges («Awaiting approval», «Approved», «Returned») are on one line again; «Returned for rework» is now «Returned».<\/li>\n<\/ul>"},{"ver":"1.7.3.12","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>The «Projects», «Status reports», «Risks» and «Archive» tables fit the window without horizontal scrolling: the page is wider (up to 1440 px), long headers and badges wrap, the rating columns' filter goes under the title when space is short.<\/li>\n<\/ul>"},{"ver":"1.7.3.11","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.3.7","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>The «Accept» and «Show record» buttons in the AI assistant hints are now outlined.<\/li>\n<li>Names in the «PM» and «Author» columns no longer break mid-word onto a third line.<\/li>\n<\/ul>"},{"ver":"1.7.3.1","date":"14.10.2026","html":"<p><b>New<\/b><\/p>\n<ul>\n<li>\"Copy risk\" / \"Copy issue\" in a saved record: a new record opens with all fields — change what you need and save, then close the original (#92).<\/li>\n<li>The PMO gets new high risks (15+) and all issues, and their status changes, in the bell (#87).<\/li>\n<\/ul>\n<p><b>Changed<\/b><\/p>\n<ul>\n<li>Risk: \"Response strategy\", \"Risk reduction actions\" and \"Contingency plan\" are required at any score; issue — description and actions. Required fields are marked *, the explanation is next to the field (#91, #88).<\/li>\n<li>A saved risk or issue can only change its status; other fields — via \"Copy\" (#92).<\/li>\n<li>The new record form explains how risks are handled: they are not approved, the PMO sees them in notifications, feedback is a comment in the card (#87).<\/li>\n<li>\"Detailed system overview\" in Help: the risks and notifications sections follow the risk decisions.<\/li>\n<\/ul>\n<p><b>Check again<\/b><\/p>\n<ul>\n<li>A new risk without strategy, actions or contingency plan — errors next to the fields; a new issue — only description and actions.<\/li>\n<li>A saved risk: only \"Status\" can be changed; \"Copy risk\" opens a new record with all fields.<\/li>\n<li>PMO: about 15 minutes after a new high risk or issue from a PM, or its status change — an event in the bell.<\/li>\n<\/ul>"},{"ver":"1.7.2.31","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.30","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.29","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.28","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.27","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.26","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.25","date":"14.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.24","date":"13.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.23","date":"13.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.22","date":"13.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.21","date":"13.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>Technical update with no changes to how the portal works.<\/li>\n<\/ul>"},{"ver":"1.7.2.20","date":"13.10.2026","html":"<p><b ew release.<\/li>\n<li>Bell: \"Feedback reviewed\" — when the status of or answer to your feedback changes.<\/li>\n<li>The project card shows the three latest status reports and \"Show all reports (N)\" (#82).<\/li>\n<\/ul>\n<p><b>Changed<\/b><\/p>\n<ul>\n<li>\"Report\" column: the approval label and the date form one block, the date on its own line; tooltip \"Submitted … · author\" (#85).<\/li>\n<li>The report field \"Issues and risks\" → \"Issues and risks for the period\", with a hint where the risk register is (#81).<\/li>\n<li>Risk \"Mitigation due date\": for a new record — not earlier than today, when changed — not earlier than the registration date; an overdue one is marked \"The due date has passed\" (#88).<\/li>\n<li>No empty space in the menu after \"Feedback\"; the project form says team members get access within ~15 minutes (#83).<\/li>\n<\/ul>\n<p><b>Re-check<\/b><\/p>\n<ul>\n<li>Add a member to a project team — within ~15 minutes their bell shows \"You were added to the team\".<\/li>\n<li>Risk form: a due date earlier than today (new record) — an error next to the field.<\/li>\n<li>Long lists: column headers and the horizontal scroll bar stay visible.<\/li>\n<li>Bell: \"New portal release\" opens \"What's new\"; the feedback author gets \"Feedback reviewed\" after the status or answer changes.<\/li>\n<li>Project card: the three latest reports and \"Show all reports (N)\"; \"Report\" column — tooltip \"Submitted … · author\".<\/li>\n<\/ul>"},{"ver":"1.7.2.1","date":"08.10.2026","html":"<p><b>Changed<\/b><\/p>\n<ul>\n<li>The report submission date is the day it is saved, the period is calculated (#62, #69).<\/li>\n<li>Report form checks: actual completion, description of the decision needed (#64, #67, #68).<\/li>\n<li>Project \"Status\" → \"Project phase\"; phase and type are written to every report (#77, #78).<\/li>\n<li>\"Report\" column — approval of the newest report, filter by approval (#73); \"Goal and description\" — up to 10 lines (#71); buttons on the phone (#72).<\/li>\n<\/ul>"},{"ver":"1.7.1","date":"08.10.2026","html":"<p><b>New<\/b><\/p>\n<ul>\n<li>Notifications: a bell with the number of new events in your projects, \"Mark all as read\".<\/li>\n<li>Archive by phase \"Completed\" / \"Cancelled\", views \"Completed\" / \"Cancelled\".<\/li>\n<li>Section icons in the menu, a coloured label in every side window.<\/li>\n<\/ul>"},{"ver":"1.7.0","date":"04.10.2026","html":"<p><b>New<\/b><\/p>\n<ul>\n<li>\"Assignment\": only PMO changes the PM and the owner (#43).<\/li>\n<li>Risk form: type first, then description (#47, #55); actual completion date (#54).<\/li>\n<li>Sync runs in Azure Automation.<\/li>\n<\/ul>"}],[{"ver":"1.7.5.3","date":"26.10.2026","html":"<p><b>Исправлено<\/b><\/p>\n<ul>\n<li>Внешнего участника (гостя организации) теперь можно добавить в команду проекта, назначить PM, владельцем или ответственным за риск. Если человека ещё нет в организации, портал объясняет, что его сначала должен пригласить администратор Microsoft 365.<\/li>\n<\/ul>"},{"ver":"1.7.5.2","date":"20.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.5.1","date":"20.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Название системы: <b>PPM — Управление портфелем проектов<\/b> (Project Portfolio Management).<\/li>\n<\/ul>"},{"ver":"1.7.5.0","date":"19.10.2026","html":"<p><b>Новое<\/b><\/p>\n<ul>\n<li><b>Родительский проект<\/b> в карточке: связь между проектами (вложенность любая, нельзя выбрать сам проект и его дочерние). В карточке — ссылка на родительский и список <b>Дочерние проекты<\/b>; в «Проектах» — колонка <b>Родительский проект<\/b>. Изменение — в «Истории изменений». Пока только для связи, дальше — аналитика.<\/li>\n<\/ul>"},{"ver":"1.7.4.7","date":"18.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>На телефоне меню под аватаром открывается сразу под ним, а не внизу экрана.<\/li>\n<\/ul>"},{"ver":"1.7.4.6","date":"18.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.4.5","date":"18.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>На телефоне: шапка в один ряд, при прокрутке остаётся только меню разделов; язык и тема — в меню под аватаром. Окна фильтра и колонок — снизу, кнопки «Как по умолчанию» и «Сбросить ширины» — вверху окна (#107). Блок согласования в просмотре отчёта больше не наезжает на заголовок (#97). Карточка отчёта в списке: сначала PM, дата и состояние (#99). «Отзывы» — карточками (#102).<\/li>\n<\/ul>\n<p><b>Проверьте повторно<\/b><\/p>\n<ul>\n<li>На телефоне: шапка, меню под аватаром, фильтры и колонки в списках, согласование отчёта, «Отзывы».<\/li>\n<\/ul>"},{"ver":"1.7.4.4","date":"17.10.2026","html":"<p><b>Исправлено<\/b><\/p>\n<ul>\n<li>«Подробный обзор системы»: таблицы переносят текст — без прокрутки вбок.<\/li>\n<\/ul>"},{"ver":"1.7.4.3","date":"17.10.2026","html":"<p><b>Исправлено<\/b><\/p>\n<ul>\n<li>«Помощник ИИ» включается с первого раза: окно входа Microsoft открывается сразу после «Разрешить»; на телефоне — вход с переходом на страницу Microsoft, после возврата включение завершается само. Не удалось — видна причина (окно входа заблокировано, вход не завершён, ошибка ИИ с кодом); на тестовом сайте сбой записывается в «Отзывы».<\/li>\n<\/ul>\n<p><b>Изменено<\/b><\/p>\n<ul>\n<li>«Помощник ИИ» хранится для вас, а не для браузера: включили на телефоне — включено и на компьютере.<\/li>\n<\/ul>"},{"ver":"1.7.4.2","date":"17.10.2026","html":"<p><b>Новое<\/b><\/p>\n<ul>\n<li>Кнопка <b>↻ «Обновить данные»<\/b> над списками (рядом с «CSV») — свежие данные без перезахода на страницу, удобно на телефоне (#103).<\/li>\n<\/ul>\n<p><b>Изменено<\/b><\/p>\n<ul>\n<li>«Что изменилось»: вверху — текущая версия; технические обновления подряд собраны в один свёрнутый блок; каждый выпуск с изменениями раскрывается нажатием на заголовок, разделы «Новое / Изменено / Исправлено» выделены (#95).<\/li>\n<li>Карточка проекта: «Цель и описание» обязательно при сохранении PM (и в ранее созданных проектах — при следующем сохранении) (#96).<\/li>\n<li>Карточка проекта: «Приоритет» — в «Основное», рядом с направлением, с подсказкой, чем приоритет отличается от типа; в «Справке» — определения (#105).<\/li>\n<li>Просмотр статус-отчёта: под заголовком — ответственный PM (#98).<\/li>\n<li>Поиск SharePoint в серой полосе скрыт: на телефоне он увеличивал страницу (#106).<\/li>\n<\/ul>\n<p><b>Исправлено<\/b><\/p>\n<ul>\n<li>Отзыв отправляется с первого раза: при сбое связи портал повторяет запрос сам, повторное «Отправить» не создаёт дубль; отправленный отзыв сразу виден в списке (#108, #103).<\/li>\n<\/ul>"},{"ver":"1.7.4.1","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>«Подробный обзор системы» в «Справке»: новый раздел «Помощник ИИ (пилот)», безопасность данных и состояние работ — с учётом помощника.<\/li>\n<\/ul>"},{"ver":"1.7.4.0","date":"14.10.2026","html":"<p><b>Новое<\/b><\/p>\n<ul>\n<li>Помощник ИИ для участников пилота: переключатель «Помощник ИИ» в меню аватара (согласие — один раз, при включении); в форме статус-отчёта — «Заполнить с ИИ» (черновик, «Что не забыть», предлагаемые оценки) и «Проверить с ИИ» (противоречия между отчётом и данными проекта); поле «Противоречия (анализ ИИ)» видно в отчёте и при согласовании. Подробно — «Справка», раздел «Помощник ИИ (пилот)».<\/li>\n<\/ul>"},{"ver":"1.7.3.13","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Плашки согласования («На согласовании», «Согласовано», «Возвращено») — снова одной строкой; «Возвращено на доработку» теперь «Возвращено».<\/li>\n<\/ul>"},{"ver":"1.7.3.12","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Таблицы «Проекты», «Статус-отчёты», «Риски» и «Архив» помещаются в окно без горизонтальной прокрутки: страница шире (до 1440 px), длинные заголовки и плашки переносятся, фильтр колонок-оценок — под названием, если места мало.<\/li>\n<\/ul>"},{"ver":"1.7.3.11","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.3.7","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Кнопки «Принять» и «Показать запись» в подсказках помощника ИИ выделены рамкой.<\/li>\n<li>Имя в колонках «PM» и «Автор» больше не разрывается посреди слова на третью строку.<\/li>\n<\/ul>"},{"ver":"1.7.3.1","date":"14.10.2026","html":"<p><b>Новое<\/b><\/p>\n<ul>\n<li>«Копировать риск» / «Копировать проблему» в сохранённой записи: открывается новая запись со всеми полями — измените нужное и сохраните, а исходную запись закройте (#92).<\/li>\n<li>PMO получает в колокольчике новые высокие риски (от 15) и все проблемы, а также смену их статуса (#87).<\/li>\n<\/ul>\n<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Риск: «Стратегия реагирования», «Меры по снижению риска» и «План действий при наступлении» — обязательны при любой оценке; проблема — описание и меры. Обязательные поля отмечены *, пояснение — у поля (#91, #88).<\/li>\n<li>Сохранённый риск или проблема меняется только статусом; остальные поля — через «Копировать» (#92).<\/li>\n<li>В форме новой записи — как обрабатываются риски: не согласуются, PMO видит их в уведомлениях, обратная связь — комментарием в карточке (#87).<\/li>\n<li>«Подробный обзор системы» в «Справке»: разделы о рисках и уведомлениях — по решениям о рисках.<\/li>\n<\/ul>\n<p><b>Проверьте повторно<\/b><\/p>\n<ul>\n<li>Новый риск без стратегии, мер или плана действий — ошибки у полей; новая проблема — только описание и меры.<\/li>\n<li>Сохранённый риск: меняется только «Статус»; «Копировать риск» — новая запись со всеми полями.<\/li>\n<li>PMO: через ~15 минут после нового высокого риска или проблемы от PM и смены их статуса — событие в колокольчике.<\/li>\n<\/ul>"},{"ver":"1.7.2.31","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.30","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.29","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.28","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.27","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.26","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.25","date":"14.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.24","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.23","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.22","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.21","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.20","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.19","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.18","date":"13.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Техническое обновление без изменений в работе портала.<\/li>\n<\/ul>"},{"ver":"1.7.2.17","date":"13.10. стр рисков (#81).<\/li>\n<li>«Срок выполнения мер» риска: для новой записи — не раньше сегодня, при изменении — не раньше даты регистрации; просроченный помечается «Срок истёк» (#88).<\/li>\n<li>Меню без пустого места после «Отзывы»; в форме проекта — права участникам появляются в течение ~15 минут (#83).<\/li>\n<\/ul>\n<p><b>Проверьте повторно<\/b><\/p>\n<ul>\n<li>Добавьте участника в команду проекта — через ~15 минут у него в колокольчике «Вас добавили в команду».<\/li>\n<li>Форма риска: срок раньше сегодня (новая запись) — ошибка у поля.<\/li>\n<li>Длинные списки: заголовки колонок и горизонтальная полоса прокрутки остаются видимыми.<\/li>\n<li>Колокольчик: «Новый выпуск портала» открывает «Что изменилось»; автор отзыва получает «Отзыв рассмотрен» после смены статуса или ответа.<\/li>\n<li>Карточка проекта: три последних отчёта и «Показать все отчёты (N)»; колонка «Отчёт» — подсказка «Подан … · автор».<\/li>\n<\/ul>"},{"ver":"1.7.2.1","date":"08.10.2026","html":"<p><b>Изменено<\/b><\/p>\n<ul>\n<li>Дата подачи отчёта — день сохранения, период считается сам (#62, #69).<\/li>\n<li>Проверки формы отчёта: фактическое завершение, описание нужного решения (#64, #67, #68).<\/li>\n<li>«Статус» проекта → «Фаза проекта»; фаза и тип записываются в каждый отчёт (#77, #78).<\/li>\n<li>Колонка «Отчёт» — согласование самого нового отчёта, фильтр по согласованию (#73); «Цель и описание» — до 10 строк (#71); кнопки на телефоне (#72).<\/li>\n<\/ul>"},{"ver":"1.7.1","date":"08.10.2026","html":"<p><b>Новое<\/b><\/p>\n<ul>\n<li>Уведомления: колокольчик с числом новых событий ваших проектов, «Отметить всё прочитанным».<\/li>\n<li>Архив по фазам «Завершён» / «Отменён», представления «Завершённые» / «Отменённые».<\/li>\n<li>Значки разделов в меню, цветная метка в каждом боковом окне.<\/li>\n<\/ul>"},{"ver":"1.7.0","date":"04.10.2026","html":"<p><b>Новое<\/b><\/p>\n<ul>\n<li>«Назначение»: PM и владельца меняет только PMO (#43).<\/li>\n<li>Форма риска: сначала тип, потом описание (#47, #55); дата завершения (факт) (#54).<\/li>\n<li>Синхронизация работает в Azure Automation.<\/li>\n<\/ul>"}]];
