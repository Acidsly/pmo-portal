<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портфель проектов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap&amp;subset=cyrillic" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --theme:#007aff; --theme-2:#0062cc; --theme-soft:rgba(0,122,255,.12);
  --bg-page:#f5f5f7; --bg:#ffffff; --bg-alt:#f2f2f7; --bg-hover:rgba(0,0,0,.04);
  --glass:rgba(255,255,255,.72); --glass-line:rgba(0,0,0,.08);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#aeaeb2;
  --line:rgba(0,0,0,.08); --track:#e5e5ea;
  --g:#34c759; --y:#ff9f0a; --r:#ff3b30; --na:#c7c7cc;
  --strat-bg:rgba(175,82,222,.12); --strat:#8e44c9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-hi:0 2px 6px rgba(0,0,0,.06),0 18px 40px rgba(0,0,0,.10);
  --radius:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --theme:#0a84ff; --theme-2:#409cff; --theme-soft:rgba(10,132,255,.2);
    --bg-page:#000000; --bg:#1c1c1e; --bg-alt:#2c2c2e; --bg-hover:rgba(255,255,255,.06);
    --glass:rgba(22,22,24,.72); --glass-line:rgba(255,255,255,.1);
    --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
    --line:rgba(255,255,255,.1); --track:#3a3a3c;
    --g:#30d158; --y:#ffd60a; --r:#ff453a; --na:#48484a;
    --strat-bg:rgba(191,90,242,.2); --strat:#da8fff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    --shadow-hi:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --theme:#0a84ff; --theme-2:#409cff; --theme-soft:rgba(10,132,255,.2);
  --bg-page:#000000; --bg:#1c1c1e; --bg-alt:#2c2c2e; --bg-hover:rgba(255,255,255,.06);
  --glass:rgba(22,22,24,.72); --glass-line:rgba(255,255,255,.1);
  --text:#f5f5f7; --text-2:#98989d; --text-3:#636366;
  --line:rgba(255,255,255,.1); --track:#3a3a3c;
  --g:#30d158; --y:#ffd60a; --r:#ff453a; --na:#48484a;
  --strat-bg:rgba(191,90,242,.2); --strat:#da8fff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --shadow-hi:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.47;color:var(--text);background:var(--bg-page);-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--theme-soft);outline-offset:2px;border-radius:10px}
.muted{color:var(--text-2)}

/* Frosted header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,#0a84ff,#5e5ce6);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:12px;color:var(--text-2)}
.nav{display:flex;gap:2px;background:var(--bg-alt);padding:3px;border-radius:12px;overflow-x:auto;max-width:100%}
.nav button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap;transition:background-color .2s,color .2s}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg-alt);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.viewas{display:inline-flex;align-items:center;gap:8px;background:var(--bg-alt);border-radius:10px;padding:3px 4px 3px 10px;font-size:13px;color:var(--text-2)}
.viewas select{border:0;background:var(--bg);border-radius:8px;padding:5px 8px;font-weight:600;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12);max-width:200px}
@media (max-width:1100px){.top-in{gap:12px}.nav{order:3;width:100%}.controls{margin-left:0}}

main{max-width:1280px;margin:0 auto;padding:40px 32px 96px}
@media (max-width:720px){main,.top-in{padding-left:16px;padding-right:16px} main{padding-top:24px}}
.hero{margin-bottom:28px}
.page-title{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:0}
.page-sub{color:var(--text-2);font-size:17px;margin:8px 0 0}
@media (max-width:720px){.page-title{font-size:30px}}
.msgbar{display:flex;gap:10px;align-items:flex-start;background:var(--theme-soft);color:var(--text);border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:28px;max-width:900px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-bottom:24px}
.stack{margin-bottom:24px}
@media (max-width:920px){.grid2{grid-template-columns:minmax(0,1fr)}}
.wp{background:var(--bg);border-radius:var(--radius);padding:24px 26px;min-width:0;box-shadow:var(--shadow)}
.wp-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.wp-h h2{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
.wp-h > span{display:inline-flex;align-items:center;gap:12px}
.more{background:none;border:0;color:var(--theme);cursor:pointer;padding:0;font-size:14px;font-weight:500;white-space:nowrap}
.more:hover{text-decoration:underline}
.hint{font-size:13px;color:var(--text-2);margin:12px 4px 0;max-width:820px}

/* Lists */
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--text-2);padding:8px 14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:220px}
tbody tr.row td{transition:background-color .15s}
tbody tr.row:hover td{background:var(--bg-hover)}
tr.grp td{font-weight:600;cursor:pointer;user-select:none;padding-top:20px;font-size:13px;color:var(--text-2);border-bottom:1px solid var(--line)}
tr.grp .chev{display:inline-block;width:18px;transition:transform .2s}
tr.grp.collapsed .chev{transform:rotate(-90deg)}
.link{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;color:var(--text)}
.link:hover{color:var(--theme)}
.empty{color:var(--text-2);padding:20px 0;margin:0}
.num{text-align:right;font-variant-numeric:tabular-nums}

.rag{display:inline-flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.sm{width:8px;height:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--text);white-space:nowrap}
.pill .dot{background:var(--c)}
.prog{display:inline-flex;align-items:center;gap:10px;min-width:130px}
.prog .track{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden;min-width:70px}
.prog .track i{display:block;height:100%;border-radius:3px}
.prog b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.late{color:var(--r);font-weight:600}
.warn{color:var(--y);font-weight:600}
.over{color:var(--r);font-weight:600}
.chip{display:inline-block;min-width:30px;text-align:center;padding:2px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:12px}
.flag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--theme-soft);color:var(--theme);font-size:12px;font-weight:600}
.strat{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--strat-bg);color:var(--strat);font-weight:600;font-size:12px}
.loop{color:var(--theme);font-weight:600;text-decoration:none;font-size:14px}
.loop:hover{text-decoration:underline}

.person{display:inline-flex;gap:10px;align-items:center;min-width:0}
.pav{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;letter-spacing:.02em}
.pav.lg{width:40px;height:40px;font-size:14px}
.pn{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.pn b{font-weight:600}
.pn small{color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis}

.cmdbar{display:flex;align-items:center;gap:8px;padding:0 0 16px;flex-wrap:wrap}
.cmd{background:var(--bg-alt);border:0;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;border-radius:10px;white-space:nowrap;font-size:14px;font-weight:500}
.cmd:hover{background:var(--track)}
.cmd.primary{background:var(--theme);color:#fff}
.cmd.primary:hover{background:var(--theme-2)}
.spacer{flex:1}
.viewsel{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}
.viewsel select{border:0;background:var(--bg-alt);border-radius:10px;padding:8px 12px;min-width:200px;font-size:14px;font-weight:500}
.listcard{background:var(--bg);border-radius:var(--radius);padding:22px 24px 12px;box-shadow:var(--shadow)}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tile{background:var(--bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;min-width:0}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
.listcard .tiles{padding:4px 0 12px}
.wp .tiles .tile{box-shadow:0 0 0 1px var(--line)}
.wp .tiles .tile:hover{box-shadow:var(--shadow-hi)}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tile-top .code{font-size:12px;color:var(--text-2);font-weight:500;letter-spacing:.02em;margin-right:auto}
.tile-t{font-size:19px;font-weight:600;line-height:1.28;letter-spacing:-.015em;margin:-4px 0 0}
.tile-pm{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg-alt)}
.tile-prog .pl{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);margin-bottom:8px}
.tile-prog .pl b{color:var(--text);font-variant-numeric:tabular-nums}
.tile-prog .track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.tile-prog .track i{display:block;height:100%;border-radius:4px}
.tile-upd{border-top:1px solid var(--line);padding-top:14px;flex:1}
.tile-upd .ul{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tile-upd .tx{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile-f{display:flex;justify-content:flex-end;min-height:20px}

/* Charts */
.donut-wrap{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.legend li{display:flex;align-items:center;gap:10px;font-size:14px}
.legend b{font-variant-numeric:tabular-nums;min-width:20px;display:inline-block;font-size:17px}
svg text{font-family:inherit}
.chart{width:100%;height:auto;max-width:560px;display:block}

/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
#scrim.open{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);box-shadow:var(--shadow-hi);border-radius:28px 0 0 28px;transform:translateX(104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;z-index:20;padding:calc(24px + env(safe-area-inset-top,0px)) 32px calc(40px + env(safe-area-inset-bottom,0px))}
@media (max-width:680px){#panel{border-radius:0;padding-left:20px;padding-right:20px}}
#panel.open{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.ph h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0;line-height:1.15}
.x{background:var(--bg-alt);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--text-2)}
.x:hover{background:var(--track)}
.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg-alt);font-size:12px;font-weight:600;color:var(--text-2)}
.btn{border:0;background:var(--bg-alt);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{background:var(--track)}
.btn.primary{background:var(--theme);color:#fff}
.btn.primary:hover{background:var(--theme-2)}
.sec{margin-top:28px}
.sec h3{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px;letter-spacing:.01em}
.group{background:var(--bg-alt);border-radius:16px;padding:4px 16px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text-2);font-size:14px}
.kv .v{text-align:right;font-weight:500}
.k{font-size:12px;color:var(--text-2)}
.pmcard{display:flex;gap:14px;align-items:center;background:var(--bg-alt);border-radius:16px;padding:14px 16px}
.pmcard .pn b{font-size:16px}
.pmcard .role{margin-left:auto;font-size:12px;font-weight:600;color:var(--theme);background:var(--theme-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.people2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.people2 > div{background:var(--bg-alt);border-radius:16px;padding:12px 14px}
@media (max-width:520px){.people2{grid-template-columns:minmax(0,1fr)}}
.access{background:var(--bg-alt);border-radius:16px;padding:14px 16px;font-size:14px}
.access ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.access li{display:flex;align-items:center;gap:10px}
.access .lvl{margin-left:auto;font-size:12px;color:var(--text-2);white-space:nowrap}
.access .arrow{color:var(--text-3);font-size:12px;padding-left:9px}
.matrix td,.matrix th{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line)}
.matrix td:first-child,.matrix th:first-child{text-align:left;color:var(--text-2);font-weight:400}
.rep{background:var(--bg-alt);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.rep-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rep p{margin:4px 0;font-size:14px}
.rep .lbl{color:var(--text-2)}
.hist-c{padding:10px 0;border-bottom:1px solid var(--line)}
.hist-c:last-of-type{border-bottom:0}
.hist-c .who{font-size:12px;color:var(--text-2);margin-bottom:2px}
.cmts{background:var(--bg-alt);border-radius:16px;padding:6px 16px 12px}
.cmt{display:inline-flex;gap:8px;align-items:center;max-width:300px}
.cmt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{background:var(--theme-soft);border:0;border-radius:999px;padding:1px 8px;font-size:12px;cursor:pointer;color:var(--theme);font-weight:700;flex:none}
.note{font-size:12px;color:var(--text-2);margin:10px 4px 0}

/* Form */
form .frow{margin-bottom:16px}
form label.t,form legend{display:block;font-weight:600;margin-bottom:6px;font-size:13px;padding:0;color:var(--text-2)}
form input[type=text],form input[type=number],form input[type=date],form select,form textarea{width:100%;border:1px solid transparent;border-radius:12px;padding:10px 12px;background:var(--bg-alt);transition:border-color .15s,background-color .15s}
form input:focus,form select:focus,form textarea:focus{outline:none;border-color:var(--theme);background:var(--bg)}
form textarea{min-height:72px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
fieldset.ragpick{border:0;margin:0 0 14px;padding:0}
.ragpick .opts{display:inline-flex;background:var(--bg-alt);padding:3px;border-radius:12px;gap:2px;flex-wrap:wrap}
.ragpick label{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:6px 14px;cursor:pointer;font-size:14px;font-weight:500}
.ragpick input{position:absolute;opacity:0;pointer-events:none}
.ragpick input:checked + label{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.ragpick input:focus-visible + label{outline:3px solid var(--theme-soft)}
.dims{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}
@media (max-width:560px){.dims{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--r);font-weight:600;margin:8px 0}
.actions{display:flex;gap:10px;margin-top:20px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--theme)}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--text);padding:14px 20px;border-radius:16px;box-shadow:var(--shadow-hi);border:1px solid var(--glass-line);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1);z-index:30;max-width:min(560px,calc(100% - 32px));font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px}
.tile-f{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:28px;margin-top:auto}
.tile-pm{display:inline-flex;align-items:center;gap:8px;margin-left:auto;min-width:0;background:none;padding:0}
.tile-pm b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-upd{flex:0 1 auto}
.actbar{display:flex;gap:8px;flex-wrap:wrap}
.note.lock{background:var(--bg-alt);border-radius:12px;padding:10px 14px;margin:0;font-size:13px}
.desc{margin:18px 0 0;color:var(--text-2);font-size:15px;max-width:60ch}
.pav.sm{width:22px;height:22px;font-size:9px}
.chg{padding:12px 0;border-bottom:1px solid var(--line)}
.chg:last-of-type{border-bottom:0}
.chg-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}

/* ================= Data layer ================= */
let PROJ = [];
let MODE = 'loading';   // loading | db | empty | local
let db = null;
const queues = {};
const parse = (o) => {
  const p = Object.assign({}, JSON.parse(JSON.stringify(o)), {id:+o.id});
  if (!Array.isArray(p.stakeholders)) p.stakeholders = p.product ? [p.product] : [];
  delete p.product;
  (p.reports || []).forEach(r => { r.rag = calcRag(r); });
  const last = (p.reports || []).slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
  if (last) p.rag = last.rag;
  return p;
};
function persist(p){
  if (!db) return Promise.resolve();
  const id = String(p.id), body = JSON.parse(JSON.stringify(p));
  const prev = queues[id] || Promise.resolve();
  const next = prev.then(() => db.doc('projects/' + id).set(body)).catch(e => { toast(t('saveErr')); console.error(e); });
  queues[id] = next;
  return next;
}
async function seed(){
  const data = buildSeed();
  if (!db){ PROJ = data.map(parse); MODE = 'local'; render(); return; }
  for (const p of data){ await db.doc('projects/' + p.id).set(p); }
}
async function resetDemo(){
  if (!confirm(t('resetConfirm'))) return;
  if (db){ for (const p of PROJ){ await db.doc('projects/' + p.id).delete(); } await seed(); }
  else { PROJ = buildSeed().map(parse); render(); }
}
async function initData(){
  try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch(e) { db = null; }
  if (!db){ MODE = 'local'; PROJ = buildSeed().map(parse); render(); return; }
  db.collection('projects').onSnapshot(snap => {
    if (snap.empty){ if (snap.metadata.fromCache) return; MODE = 'empty'; PROJ = []; }
    else { MODE = 'db'; PROJ = snap.docs.map(d => parse(Object.assign({}, d.data(), {id:d.id})));
      PROJ.filter(p => p.status === 'Завершено').forEach(p => { p.status = 'Архівний'; p.archivedAt = p.archivedAt || p.lastUpdate || iso(TODAY); persist(p); }); }
    render();
  }, err => { console.error(err); if (MODE === 'loading'){ db = null; MODE = 'local'; PROJ = buildSeed().map(parse); render(); } });
}

  const head = `<thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.l()}</th>`).join('')}</tr></thead>`;
  const row = (r, gk, hid) => `<tr class="row"${gk ? ` data-gk="${gk}"` : ''}${hid ? ' hidden' : ''}>${cols.map(c => `<td class="${c.cls || ''}">${c.r(r)}</td>`).join('')}</tr>`;
  let body = '';
  if (opt.group){
    const keys = [], map = {};
    rows.forEach(r => { const k = opt.group(r); if (!map[k]){ map[k] = []; keys.push(k); } map[k].push(r); });
    if (opt.order) keys.sort((a, b) => opt.order.indexOf(a) - opt.order.indexOf(b));
    keys.forEach(k => { const g = 'g' + (++gSeq);
      body += `<tr class="grp${opt.collapsed ? ' collapsed' : ''}" data-act="grp" data-g="${g}"><td colspan="${cols.length}"><span class="chev">▾</span>${esc(k)} <span class="muted">(${map[k].length})</span></td></tr>` + map[k].map(r => row(r, g, opt.collapsed)).join(''); });
  } else body = rows.map(r => row(r)).join('');
  return `<div class="tablewrap"><table>${head}<tbody>${body}</tbody></table></div>`;
}

function donut(){
  const act = visP().filter(isActive), c = {'Зелений':0,'Жовтий':0,'Червоний':0, none:0};
  act.forEach(p => c[p.rag || 'none']++);
  const segs = [['Зелений','var(--g)'],['Жовтий','var(--y)'],['Червоний','var(--r)'],['none','var(--na)']];
  const R = 76, C = 2 * Math.PI * R, total = act.length || 1; let off = 0, arcs = '';
  segs.forEach(([k, cl]) => { const len = c[k] / total * C;
    if (len > 0) arcs += `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${cl}" stroke-width="24" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off += len; });
  const legend = segs.filter(s => s[0] !== 'none' || c.none).map(([k, cl]) => `<li><span class="dot" style="background:${cl}"></span><b>${c[k]}</b>${k === 'none' ? t('notRated') : k}</li>`).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${t('wpHealth')}">
    <circle r="${R}" cx="100" cy="100" fill="none" stroke="var(--track)" stroke-width="24"/>${arcs}
    <text x="100" y="100" text-anchor="middle" font-size="40" font-weight="600" fill="var(--text)">${act.length}</text>
    <text x="100" y="124" text-anchor="middle" font-size="14" fill="var(--text-2)">${t('active')}</text></svg><ul class="legend">${legend}</ul></div>`;
}
function dynamics(){
  const pts = [];
  for (let k = 6; k >= 0; k--){
    const tt = daysAgo(k * 14), c = {'Зелений':0,'Жовтий':0,'Червоний':0};
    visAll().forEach(p => { const rs = repsOf(p).filter(r => r.d <= tt); if (!rs.length) return;
      if (isArch(p) && tt > lastUpd(p)) return; c[rs[rs.length - 1].rag]++; });
    pts.push({tt, c});
  }
  const W = 500, H = 230, L = 30, B = 30, TP = 12;
  const max = Math.max(1, ...pts.map(p => p.c['Зелений'] + p.c['Жовтий'] + p.c['Червоний']));
  const slot = (W - L - 8) / pts.length, bw = slot * 0.5, y = v => H - B - v / max * (H - B - TP);
  let g = '';
  [0, Math.ceil(max / 2), max].forEach(v => { g += `<line x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-2)">${v}</text>`; });
  pts.forEach((p, i) => { const x = L + i * slot + (slot - bw) / 2; let base = 0;
    RAGS.forEach(k => { const v = p.c[k]; if (!v) return; const y1 = y(base + v), h = y(base) - y1;
      g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(h - 2, 1)}" rx="5" fill="${RC[k]}"><title>${fmt(p.tt)}: ${k} — ${v}</title></rect>`;
      if (h > 16) g += `<text x="${x + bw / 2}" y="${y1 + h / 2 + 3}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${v}</text>`; base += v; });
    g += `<text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--text-2)">${i === pts.length - 1 ? t('today') : fmtShort(p.tt)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('wpDyn')}">${g}</svg><p class="hint">${t('dynHint')}</p>`;
}

const matchF = (fv, vals) => Array.isArray(fv) ? fv.some(x => vals.includes(String(x))) : vals.includes(String(fv));
const gearBtn = key => `<button class="iconbtn gear-lg" data-act="tcols" data-key="${key}" aria-label="${t('cols')}" title="${t('cols')}">${icoGear}</button>`;
function applyTable(key, rows){
  const st = tState(key), defs = TDEFS[key];
  let data = rows.filter(r => Object.entries(st.filters).every(([id, vals]) => !vals || !vals.length || !defs[id] || !defs[id].filter || matchF(defs[id].filter(r), vals)));
  if (st.sort && defs[st.sort.id] && defs[st.sort.id].sort){
    const f = defs[st.sort.id].sort, dir = st.sort.dir === 'desc' ? -1 : 1;
    data = data.slice().sort((a, b) => { const x = f(a), y = f(b); const ex = x === '' || x == null || x === -1, ey = y === '' || y == null || y === -1;
      if (ex && ey) return 0; if (ex) return 1; if (ey) return -1;
      return dir * (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'uk')); });
  }
  return data;
}
function dataTable(key, rows, emptyMsg){
  TROWS[key] = rows;
  const st = tState(key), defs = TDEFS[key], data = applyTable(key, rows), cols = st.cols.map(c => [c, defs[c]]);
  const chips = Object.entries(st.filters).filter(([id, v]) => v && v.length && defs[id]).map(([id, v]) =>
    `<span class="fchip">${defs[id].l()}: ${v.map(x => fvLabel(defs[id], x)).join(', ')}<button data-act="fclear" data-key="${key}" data-col="${id}" aria-label="${t('clear')}">×</button></span>`).join('');
  const head = cols.map(([id, d]) => {
    const s = st.sort && st.sort.id === id ? st.sort.dir : '';
    const fa = st.filters[id] && st.filters[id].length;
    return `<th class="${d.cls || ''}"><span class="th${d.filter ? ' hasf' : ''}">${d.sort ? `<button class="sortb${s ? ' on' : ''}" data-act="tsort" data-key="${key}" data-col="${id}" title="${t('sortBy')}: ${d.l()}">${d.h ? d.h() : d.l()}<i>${icoSort(s)}</i></button>` : `<span>${d.h ? d.h() : d.l()}</span>`}${d.filter ? `<button class="fbtn${fa ? ' on' : ''}" data-act="tfilter" data-key="${key}" data-col="${id}" aria-label="${t('filter')}: ${d.l()}">${icoFunnel}</button>` : ''}</span></th>`;
  }).join('');
  const body = data.map(r => `<tr class="row">${cols.map(([id, d]) => `<td class="${d.cls || ''}">${d.main(r)}</td>`).join('')}</tr>`).join('');
  return `<div class="dt-bar"><span class="muted">${t('shown')} ${data.length} ${t('of')} ${rows.length}</span>${chips}</div>
    ${data.length ? `<div class="tablewrap dt"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` : `<p class="empty">${emptyMsg || t('empty')}</p>`}`;
}

/* popovers */
const pop = document.getElementById('pop');
let POP = null;
function openPop(anchor, kind, key, col){
  POP = {kind, key, col, q:''};
  pop.hidden = false;
  renderPop();
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = kind === 'filter' ? r.left : r.right - w, top = r.bottom + 6;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  const f = pop.querySelector('input[type=search]'); if (f) f.focus();
}
function closePop(){ POP = null; pop.hidden = true; pop.innerHTML = ''; }
function renderPop(){
  if (!POP) return;
  if (POP.kind === 'filter'){
    const d = TDEFS[POP.key][POP.col], st = tState(POP.key), cur = st.filters[POP.col] || [];
    const vals = [...new Set((TROWS[POP.key] || []).flatMap(r => { const v = d.filter(r); return Array.isArray(v) ? v.map(String) : [String(v)]; }))].sort((a, b) => a.localeCompare(b, 'uk'));
    const q = POP.q.toLowerCase();
    pop.innerHTML = `<div class="pop-h">${t('filter')}: ${d.l()}</div>
      ${vals.length > 7 ? `<input type="search" class="pop-q" placeholder="${t('search')}" value="${esc(POP.q)}">` : ''}
      <div class="pop-list">${vals.filter(v => !q || v.toLowerCase().includes(q)).map(v => `<label class="pop-row"><input type="checkbox" data-pv="${esc(v)}"${cur.includes(v) ? ' checked' : ''}><span>${fvLabel(d, v)}</span></label>`).join('')}</div>
      <div class="pop-f"><button class="more" data-act="fclear" data-key="${POP.key}" data-col="${POP.col}">${t('clear')}</button></div>`;
  } else if (POP.kind === 'cols'){
    const defs = TDEFS[POP.key], st = tState(POP.key);
    const all = st.cols.concat(Object.keys(defs).filter(k => k !== '_lock' && !st.cols.includes(k)));
    pop.innerHTML = `<div class="pop-h">${t('cols')}</div><div class="pop-list">${all.map(id => {
      const on = st.cols.includes(id), idx = st.cols.indexOf(id), lock = id === defs._lock;
      return `<div class="pop-row col-row"><label><input type="checkbox" data-col="${id}"${on ? ' checked' : ''}${lock ? ' disabled' : ''}><span>${defs[id].l()}</span></label>
        <span class="mv"><button data-act="cmove" data-col="${id}" data-dir="-1" aria-label="↑"${!on || idx <= 1 ? ' disabled' : ''}>↑</button><button data-act="cmove" data-col="${id}" data-dir="1" aria-label="↓"${!on || lock || idx === st.cols.length - 1 ? ' disabled' : ''}>↓</button></span></div>`; }).join('')}</div>
      <div class="pop-f"><button class="more" data-act="creset">${t('colsReset')}</button></div>`;
  } else if (POP.kind === 'user'){
    pop.innerHTML = `<div class="pop-me">${avatar(VIEWER, 'lg')}<span class="pn"><b>${esc(VIEWER)}</b><small>${esc(roleOf(VIEWER))}</small><small>${esc(email(VIEWER))}</small></span></div>
      <div class="pop-sep">${t('switchUser')}</div>
      <div class="pop-list">${Object.keys(ORG).filter(n => n !== VIEWER).map(n => `<button class="pop-row pop-user" data-act="asuser" data-n="${esc(n)}">${person(n, roleOf(n))}</button>`).join('')}</div>`;
  }
}
pop.addEventListener('input', e => { if (e.target.classList.contains('pop-q')){ POP.q = e.target.value; const pos = e.target.selectionStart; renderPop(); const q = pop.querySelector('.pop-q'); q.focus(); q.setSelectionRange(pos, pos); } });
pop.addEventListener('change', e => {
  if (!POP) return;
  const st = tState(POP.key);
  if (POP.kind === 'filter' && e.target.dataset.pv !== undefined){
    const v = e.target.dataset.pv, cur = new Set(st.filters[POP.col] || []);
    e.target.checked ? cur.add(v) : cur.delete(v);
    st.filters[POP.col] = [...cur]; tSave(POP.key); rerenderMain();
  } else if (POP.kind === 'cols' && e.target.dataset.col){
    const id = e.target.dataset.col;
    if (e.target.checked){ if (!st.cols.includes(id)) st.cols.push(id); } else st.cols = st.cols.filter(c => c !== id);
    tSave(POP.key); rerenderMain(); renderPop();
  }
});

function changesHtml(p, showAll){
  const list = (p.changes || []).slice().sort((a, b) => D(b.date) - D(a.date));
  if (!list.length) return `<p class="empty">${t('noChanges')}</p>`;
  const kindL = {create:'kCreate', key:'kKey', edit:'kEdit', report:'kReport'};
  const item = c => `<div class="chg">
    <div class="chg-h">${avatar(c.who, 'sm')}<b>${esc(c.who)}</b><span class="muted">${fmtDT(D(c.date))}</span><span class="chg-k chg-${c.kind}">${t(kindL[c.kind] || 'kEdit')}</span></div>
    ${c.diffs && c.diffs.length ? `<div class="diffs">${c.diffs.map(d => `<div class="diff"><span class="df">${fl(d.f)}</span><span class="dv"><s>${valFmt(d.f, d.from)}</s><span class="arr">→</span>${valFmt(d.f, d.to)}</span></div>`).join('')}</div>` : ''}
    ${c.reason ? `<div class="chg-r">${esc(c.reason)}</div>` : ''}</div>`;
  const shown = showAll ? list : list.slice(0, 3);
  return `<div class="cmts">${shown.map(item).join('')}${list.length > 3 ? `<button class="more" data-act="togglech">${showAll ? t('hideHistory') : t('showHistory') + ` (${list.length})`}</button>` : ''}</div>`;
}

function projectPanel(id, showCm, keep, showCh){

  if (p.fc && p.plan){ const dd = Math.round((D(p.fc) - D(p.plan)) / DAY); dev = dd > 0 ? ` <span class="late">+${dd} ${t('days')}</span>` : dd < 0 ? ` <span class="muted">${dd} ${t('days')}</span>` : ''; }
  const dims = [['rag','rag'],['sched','rSched'],['budget','rBudget'],['res','rRes']];
  const matrix = last8.length ? `<div class="tablewrap"><table class="matrix"><thead><tr><th></th>${last8.map(r => `<th>${fmtShort(r.d)}</th>`).join('')}</tr></thead><tbody>

      `<button class="more" data-act="togglecm">${showCm ? t('hideHistory') : t('showHistory') + ` (${cms.length})`}</button>` : '') + '</div>'
    : `<p class="empty">${t('noComments')}</p>`;

  const actions = edit
    ? `<div class="actbar"><button class="btn primary" data-act="newrep" data-id="${p.id}">${iconPlus}${t('addReport')}</button>
       <button class="btn" data-act="editproj" data-id="${p.id}">${iconEdit}${t('editProject')}</button></div>`
    : `<p class="note lock">🔒 ${isArch(p) ? t('archivedNote') : t('noEdit')}</p>`;
  openPanel(`<div class="ph"><div><div class="k">${esc(p.code)} · ${t('listLabel')} «${t('navProjects')}»</div><h2>${esc(p.title)}</h2></div>${closeBtn()}</div>
    <div class="badges">${typeHtml(p.type)}${ragHtml(p.rag)}<span class="badge">${esc(p.status)}</span><span class="badge">${esc(p.prio)}</span>${p.loop ? `<a class="loop" href="${esc(p.loop)}" target="_blank" rel="noopener">${t('openLoop')} ↗</a>` : ''}</div>
    ${actions}
    ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
    <div class="sec"><h3>${t('secPeople')}</h3>
      <div class="pmcard">${avatar(p.pm, 'lg')}<span class="pn"><b>${esc(p.pm)}</b><small>${esc(roleOf(p.pm))} · ${esc(email(p.pm))}</small></span><span class="role">${t('pmRole')}</span></div>

    <div class="sec"><h3>${t('secDates')}</h3><div class="group">
      ${kv('start', fmt(D(p.start)))}${kv('golive', fmt(D(p.golive)))}${kv('plan', planHtml(p))}${kv('fc', p.fc ? fmt(D(p.fc)) + dev : '')}${p.archivedAt ? kv('archived', fmt(D(p.archivedAt))) : ''}</div></div>

    <div class="sec"><div class="sec-h"><h3>${t('secRisks')} (${risks.length})</h3>${edit ? `<button class="more" data-act="newrisk" data-id="${p.id}">${iconPlus} ${t('addRisk')}</button>` : ''}</div>
      ${risks.length ? `<div class="rlist">${risks.map(k => `<button class="rrow" data-act="riskopen" data-id="${p.id}" data-rid="${k.id}">${scoreHtml(k.p * k.i)}<span class="rt">${esc(k.title)}</span><span class="muted">${esc(k.type)} · ${esc(k.status)}</span></button>`).join('')}</div>` : `<p class="empty">${t('emptyRisks')}</p>`}</div>
    <div class="sec"><h3>${t('accessTitle')}</h3><div class="access"><div class="muted" style="font-size:13px">${t('accessDesc')}</div><ol>${accessList(p)}</ol></div></div>`, keep);
  document.getElementById('cmform').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('cm-t').value.trim();
    if (!v){ const er = document.getElementById('cm-err'); er.textContent = t('errCmt'); er.hidden = false; return; }
    p.comments = (p.comments || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, txt:v}]);
    rerenderMain(); projectPanel(id, state.panel.showCm, true, state.panel.showCh); persist(p); toast(t('cmtSaved'));

const segPick = (name, values, cur, colors) => `<div class="opts">${values.map((v, i) => `<input type="radio" id="${name}${i}" name="${name}" value="${esc(v)}"${v === cur ? ' checked' : ''}><label for="${name}${i}">${colors ? `<span class="dot sm" style="background:${RC[v]}"></span>` : ''}${esc(v)}</label>`).join('')}</div>`;

const formHead = (title, sub) => `<div class="ph"><div><div class="k">${sub}</div><h2>${title}</h2></div>${closeBtn()}</div>`;
const fErr = form => msg => { const e = form.querySelector('.err'); e.textContent = msg; e.hidden = false; e.scrollIntoView && e.scrollIntoView({block:'nearest'}); };
const radioVal = (form, n) => (form.querySelector(`input[name="${n}"]:checked`) || {}).value || '';

      <div><label class="t" for="p-plan">${fl('plan')}</label><input type="date" id="p-plan" value="${p.plan || ''}"></div>
    </div>
    <div class="fgrid2 frow"><div><label class="t" for="p-status">${fl('status')}</label><select id="p-status">${REPORT_STATUSES.map(s => opt(s, p.status)).join('')}</select></div><div></div></div>` : ''}
    <h3 class="fsec">${t('secMoney')}</h3>
    <div class="fgrid2 frow">
      <div><label class="t" for="p-prio">${fl('prio')}</label><select id="p-prio">${PRIOS.map(s => opt(s, p.prio)).join('')}</select></div>

  form.addEventListener('submit', e => {

      pm:g('p-pm').value, owner:g('p-owner').value, stakeholders:[...form.querySelectorAll('#p-st input:checked')].map(x => x.value), prio:g('p-prio').value, budget:+g('p-budget').value || 0, desc:g('p-desc').value.trim()};

    if (!vals.pm) return err(t('errPM'));

      const id = Math.max(0, ...PROJ.map(x => x.id)) + 1;
      const np = Object.assign({id, type:radioVal(form, 'p-type') || 'Звичайний', status:g('p-status').value, progress:0,

      PROJ.push(np);
      rerenderMain();
      if (canSee(np)) projectPanel(id, false); else closePanel();
      persist(np); toast(t('savedProject'));
    } else {
      const diffs = Object.keys(vals).filter(k => String(p[k] ?? '') !== String(vals[k] ?? '')).map(k => ({f:k, from:p[k] ?? '', to:vals[k]}));

      Object.assign(p, vals);
      p.changes = (p.changes || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'edit', reason:'', diffs:diffs.filter(d => d.f !== 'desc')}]);
      rerenderMain();
      if (canSee(p)) projectPanel(p.id, false); else closePanel();
      persist(p); toast(t('savedEdit'));
    }
  });
}

      <div class="fgrid2 frow">
        <div><label class="t" for="f-start">${fl('start')}</label><input type="date" id="f-start" value="${sel.start || ''}"></div>
        <div><label class="t" for="f-golive">${fl('golive')}</label><input type="date" id="f-golive" value="${sel.golive || ''}"></div>
        <div><label class="t" for="f-plan">${fl('plan')}</label><input type="date" id="f-plan" value="${sel.plan || ''}"></div>
        <div><label class="t" for="f-fc">${fl('fc')}</label><input type="date" id="f-fc" value="${sel.fc || ''}"></div>
      </div>
      <div class="frow"><label class="t" for="f-c">${fl('rCost')}, ₴</label><input type="number" id="f-c" min="0" step="1000" value="${sel.actual || 0}"></div>
      <div class="frow" id="f-kr-wrap" hidden><label class="t" for="f-kr">${t('keyReason')} *</label><textarea id="f-kr" placeholder="${t('reasonPh')}"></textarea></div>
    </div>
    <div class="frow"><label class="t" for="f-t">${fl('rTitle')} *</label><input type="text" id="f-t" placeholder="${t('summaryPh')}"></div>
    <div class="frow"><label class="t" for="f-done">${fl('rDone')}</label><textarea id="f-done"></textarea></div>
    <div class="frow"><label class="t" for="f-next">${fl('rNext')}</label><textarea id="f-next"></textarea></div>
    <div class="frow"><label class="t" for="f-iss">${fl('rIssues')}</label><textarea id="f-iss"></textarea></div>
    <div class="frow"><label class="check"><input type="checkbox" id="f-dec"> ${fl('rDec')}</label></div>
    <div class="frow" id="f-dec-wrap" hidden><label class="t" for="f-dect">${fl('rDecText')}</label><textarea id="f-dect"></textarea></div>
    <p class="err" hidden></p>
    <div class="actions"><button type="submit" class="btn primary">${t('save')}</button><button type="button" class="btn" data-act="close">${t('cancel')}</button></div>
  </form>`);
  const form = document.getElementById('repform'), err = fErr(form), g = id => form.querySelector('#' + id);
  const KEYF = [['f-st','status'],['f-start','start'],['f-golive','golive'],['f-plan','plan'],['f-fc','fc']];
  const curP = () => pById(+g('f-p').value);
  const keyChanged = () => { const p = curP(); return KEYF.some(([id, k]) => String(g(id).value || '') !== String(p[k] || '')) || (radioVal(form, 'f-type') || p.type) !== p.type; };
  const dimsNow = () => ({sched:radioVal(form, 'sched'), budget:radioVal(form, 'budget'), res:radioVal(form, 'res')});
  const syncKey = () => { g('f-kr-wrap').hidden = !keyChanged(); g('f-arch').hidden = g('f-st').value !== 'Завершено'; g('f-ragv').innerHTML = ragLabel(calcRag(dimsNow())); };
  form.addEventListener('input', syncKey); form.addEventListener('change', syncKey);
  g('f-p').addEventListener('change', e => { const p = pById(+e.target.value);
    g('f-pr').value = p.progress; g('f-c').value = p.actual || 0; g('f-st').value = p.status;
    ['start','golive','plan','fc'].forEach(k => g('f-' + k).value = p[k] || '');
    const tr = form.querySelector(`input[name="f-type"][value="${p.type}"]`); if (tr) tr.checked = true;
    form.querySelectorAll('input[name="rag"]').forEach(x => x.checked = false);
    const rr = form.querySelector(`input[name="rag"][value="${p.rag}"]`); if (rr) rr.checked = true;
    syncKey(); });
  g('f-dec').addEventListener('change', e => { g('f-dec-wrap').hidden = !e.target.checked; });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const dims = dimsNow(), title = g('f-t').value.trim(), dstr = g('f-d').value;
    if (Object.values(dims).some(v => !v)) return err(t('errDims'));
    const rag = calcRag(dims);
    if (!title){ g('f-t').focus(); return err(t('errSum')); }
    if (!dstr) return err(t('errDate'));
    const p = pById(+g('f-p').value);
    const kr = g('f-kr').value.trim();
    if (keyChanged() && !kr){ g('f-kr').focus(); return err(t('errKeyReason')); }
    const progress = Math.max(0, Math.min(100, +g('f-pr').value || 0)), cost = Math.max(0, +g('f-c').value || 0), dec = g('f-dec').checked;
    const complete = g('f-st').value === 'Завершено';
    p.reports = (p.reports || []).concat([{id:uid(), date:dstr, rag, sched:dims.sched, budget:dims.budget, res:dims.res,
      progress, status:g('f-st').value, period:g('f-per').value, title, done:g('f-done').value.trim() || '—', next:g('f-next').value.trim() || '—', issues:g('f-iss').value.trim(), author:VIEWER, decision:dec, decisionText:dec ? g('f-dect').value.trim() : ''}]);
    const vals = {status: complete ? 'Архівний' : g('f-st').value, type: radioVal(form, 'f-type') || p.type,
      start:g('f-start').value, golive:g('f-golive').value, plan:g('f-plan').value, fc:g('f-fc').value, progress};
    const newer = !p.lastUpdate || D(dstr) >= D(p.lastUpdate);
    if (newer) vals.rag = rag;
    const diffs = Object.keys(vals).filter(k => String(p[k] ?? '') !== String(vals[k] ?? '')).map(k => ({f:k, from:p[k] ?? '', to:vals[k]}));
    Object.assign(p, vals, {actual:cost});
    if (newer) Object.assign(p, {lastUpdate:dstr, lastReport:title});
    if (complete) p.archivedAt = dstr;
    if (diffs.length) p.changes = (p.changes || []).concat([{id:uid(), date:new Date().toISOString(), who:VIEWER, kind:'report', reason: kr ? kr + ' · ' + title : title, diffs}]);
    rerenderMain(); projectPanel(p.id, false); persist(p); toast(complete ? t('savedArch') : t('savedReport'));
  });
}

/* ================= Theme, toast, events ================= */
let THEME = null;
try { THEME = localStorage.getItem('pmo-theme'); } catch(e) {}
if (THEME !== 'light' && THEME !== 'dark') THEME = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
function applyTheme(){ document.documentElement.setAttribute('data-theme', THEME); }
applyTheme();
const toastEl = document.getElementById('toast'); let tt;
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 4200); }

document.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  if (POP && !e.target.closest('#pop') && !e.target.closest('[data-act=tfilter],[data-act=tcols],#me')) closePop();
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const a = el.dataset.act, id = el.dataset.id ? +el.dataset.id : null;
  if (a === 'nav'){ state.page = el.dataset.page; closePop(); closePanel(); render(); window.scrollTo(0, 0); }
  else if (a === 'lang'){ LI = +el.dataset.i; render(); }
  else if (a === 'theme'){ THEME = el.dataset.t; try { localStorage.setItem('pmo-theme', THEME); } catch(e) {} applyTheme(); renderChrome(); }
  else if (a === 'goview'){ state.page = el.dataset.page; state[{projects:'pv', reports:'rv', risks:'kv'}[state.page]] = el.dataset.view; render(); window.scrollTo(0, 0); }
  else if (a === 'mode'){ state[el.dataset.key] = el.dataset.mode; rerenderMain(); }
  else if (a === 'openp') projectPanel(id, false);
  else if (a === 'comments') projectPanel(id, true);
  else if (a === 'togglecm') projectPanel(state.panel.id, !state.panel.showCm, true, state.panel.showCh);
  else if (a === 'togglech') projectPanel(state.panel.id, state.panel.showCm, true, !state.panel.showCh);
  else if (a === 'newrep') reportForm(id);
  else if (a === 'newrisk') riskForm(id, null);
  else if (a === 'riskopen') riskForm(id, el.dataset.rid, el.dataset.src === 'list');
  else if (a === 'newproj') projectForm(null);
  else if (a === 'editproj') projectForm(pById(id));
  else if (a === 'backp') { if (id) projectPanel(id, false); else closePanel(); }
  else if (a === 'close') closePanel();
  else if (a === 'seed'){ el.disabled = true; el.textContent = t('seeding'); seed().catch(err => { console.error(err); toast(t('saveErr')); }); }
  else if (a === 'reset') resetDemo();
  else if (a === 'tsort'){ const st = tState(el.dataset.key), c = el.dataset.col;
    st.sort = !st.sort || st.sort.id !== c ? {id:c, dir:'asc'} : st.sort.dir === 'asc' ? {id:c, dir:'desc'} : null; tSave(el.dataset.key); rerenderMain(); }
  else if (a === 'tfilter'){ if (POP && POP.kind === 'filter' && POP.col === el.dataset.col) closePop(); else openPop(el, 'filter', el.dataset.key, el.dataset.col); }
  else if (a === 'tcols'){ if (POP && POP.kind === 'cols') closePop(); else openPop(el, 'cols', el.dataset.key); }
  else if (a === 'fclear'){ const st = tState(el.dataset.key); delete st.filters[el.dataset.col]; tSave(el.dataset.key); rerenderMain(); if (POP && POP.kind === 'filter') renderPop(); }
  else if (a === 'cmove'){ const st = tState(POP.key), i = st.cols.indexOf(el.dataset.col), j = i + (+el.dataset.dir);
    if (i > 0 && j > 0 && j < st.cols.length){ [st.cols[i], st.cols[j]] = [st.cols[j], st.cols[i]]; tSave(POP.key); rerenderMain(); renderPop(); } }
  else if (a === 'creset'){ TS[POP.key] = {cols:TDEFAULTS[POP.key].slice(), sort:null, filters:{}}; tSave(POP.key); rerenderMain(); renderPop(); }
  else if (a === 'me'){ if (POP && POP.kind === 'user') closePop(); else openPop(el, 'user'); }
  else if (a === 'asuser'){ VIEWER = el.dataset.n; closePop(); render(); }
  else if (a === 'grp'){ el.classList.toggle('collapsed'); const h = el.classList.contains('collapsed'); document.querySelectorAll(`[data-gk="${el.dataset.g}"]`).forEach(r => r.hidden = h); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'view'){ state[e.target.dataset.key] = e.target.value; rerenderMain(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && POP){ closePop(); return; }
  if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
render();
initData();
})();
</script>
